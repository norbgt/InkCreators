  .seg{padding:7px 8px;font-size:var(--t-micro)}
  .wrap{padding:0 14px}
  .abas,.subnav{margin:0 -14px;padding:0 14px}
  .abas{margin-right:0;padding-right:0}
  .aba{padding:11px 12px}
  .abas-acoes .btn.sm{padding:7px 9px;font-size:var(--t-micro)}
  .linhaabas{gap:6px}
  .top-in{gap:8px;height:56px}
  .pad{padding:13px 14px}
  .postinfo{padding:11px 12px}
  h1.page{font-size:20px}
  .grid{gap:11px}
  /* Botões de ação lado a lado não cabem em 393px sem apertar */
  .postinfo .row .btn.sm{padding:7px 10px;font-size:var(--t-micro)}
}

/* ── Toque: alvo mínimo confortável ──────────────────────────────
   Apple recomenda 44pt. Vale para iPad e iPhone igualmente — o que
   muda o alvo é o dedo, não o tamanho da tela. ─────────────────── */

<script>
/* Os três arquivos ao lado, com um carimbo de tempo colado no nome.

   Sem o carimbo, o navegador reaproveita a cópia que ele já tem: o
   index.html mudava e os três continuavam na versão anterior — e a tela
   ficava com metade do ajuste. Era essa a origem de "não atualizou
   nada", e ela sobrevive a qualquer servidor, porque é do navegador.

   document.write, e não createElement, porque estes três precisam
   executar em ordem e antes do 'load'. É o único jeito de manter isso
   sem reescrever a inicialização. */
(function(){
 /* Aberto do Finder (file:), o carimbo fica de fora: alguns navegadores
    tratam a interrogação como parte do nome do arquivo e não acham
    nada. Nesse caso ele também não faz falta — lendo do disco, cada
    abertura já é a versão de agora. O carimbo existe para o endereço
    publicado, onde o cache é de verdade. */
 var v = location.protocol==="file:" ? "" : "?v="+Date.now();
 ["dados.js","teste.js","verificar.js"].forEach(function(f){
  document.write('<scr'+'ipt src="'+f+v+'"><\/scr'+'ipt>');
 });
})();
</script>

/* Distância em linha reta entre duas coordenadas (fórmula de haversine).
   É cálculo de verdade — o que ainda é simulado são as coordenadas dos
   eventos, não a conta. */
function distanciaKm(a,b){
 var R=6371, r=Math.PI/180;
 var dLat=(b.lat-a.lat)*r, dLng=(b.lng-a.lng)*r;
 var x=Math.sin(dLat/2)*Math.sin(dLat/2)+
   Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)*Math.sin(dLng/2);
 return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
/* Devolve null quando não há como saber, em vez de NaN. Quem chama
   decide o que dizer — e "NaN km de você" era pior que não dizer nada. */
function kmDe(e){
 if(!e||e.lat==null||e.lng==null||!S.local||S.local.lat==null)return null;
 var d=distanciaKm(S.local,e);
 if(!isFinite(d))return null;
 return d<10 ? d.toFixed(1) : Math.round(d);
}
function distanciaTexto(e){
 var d=kmDe(e);
 return d==null ? "" : d+" km de você";
}

    selo. O que muda é só o sujeito. */
 {id:"higiene",cat:"fato",ic:"🧼",nome:"Higiene verificada",alvo:"estudio",
  regra:"Acima de 90% dos clientes confirmaram estúdio limpo, em pelo menos 30 checkouts.",
  porq:"É a única coisa que o cliente não consegue julgar antes de entrar, e a que mais importa para a saúde dele.",feed:true,compravel:false},
 {id:"estverificado",cat:"fato",ic:"🏛",nome:"Estúdio verificado",alvo:"estudio",
  regra:"CNPJ, endereço e licença sanitária conferidos com o registro oficial.",
  porq:"Afirmar algo sobre um lugar físico pede barra mais alta do que afirmar sobre o trabalho de uma pessoa.",feed:true,compravel:false},
 {id:"casadeguest",cat:"fato",ic:"👥",nome:"Casa de guest",alvo:"estudio",
  regra:"Recebeu 10 ou mais tatuadores visitantes, confirmados por check-in feito ali.",
  porq:"Sai de graça do check-in, e é o que um tatuador de fora precisa saber antes de propor uma temporada.",feed:false,compravel:false},
 {id:"enterprise",cat:"contratado",ic:"🏪",nome:"Estúdio Enterprise",alvo:"estudio",
  regra:"Estúdio com contrato de operação: equipe, agenda compartilhada e relatórios.",
  porq:"Diz que existe estrutura por trás, não que o trabalho é melhor.",feed:false,compravel:true}
];
var SELO_POR_ID={}; SELOS.forEach(function(x){SELO_POR_ID[x.id]=x});

/* Ordem de exibição: fato, depois pares, depois contratado. Um selo pago
   nunca aparece antes de um conquistado. */
var ORDEM_CAT={fato:0,pares:1,contratado:2};

function selosDe(a){
 var r=[];
 var ver=sessoesVerificadas(a);
 if(ver>0)r.push({id:"verificadas",valor:ver,texto:ver+" sessões verificadas"});
 if(recomendado(a))r.push({id:"recomendado",valor:null,texto:"Recomendado"});
 if(a.orientaPos>=90)r.push({id:"orienta",valor:a.orientaPos,texto:"Orienta o pós"});
 if(a.calibrouDor>=85)r.push({id:"prepara",valor:a.calibrouDor,texto:"Prepara para a dor"});
 if(a.years>=3)r.push({id:"tempo",valor:a.years,texto:a.years+" anos de casa"});
 if(a.rating>=4.7&&a.reviews>=30)r.push({id:"avaliado",valor:a.rating,texto:a.rating+" em "+a.reviews+" avaliações"});
 if(a.referendos>0)r.push({id:"referendado",valor:a.referendos,texto:"Referendado por "+a.referendos});
 if(a.embaixador)r.push({id:"embaixador",valor:a.embaixador,texto:"Embaixador "+a.embaixador});
 if(a.destaque)r.push({id:"destaque",valor:null,texto:"Destaque"});
 if(a.enterprise)r.push({id:"enterprise",valor:null,texto:"Estúdio Enterprise"});
 r.forEach(function(x){var d=SELO_POR_ID[x.id];x.cat=d.cat;x.ic=d.ic;x.nome=d.nome;x.feed=d.feed});
 return r.sort(function(x,y){return ORDEM_CAT[x.cat]-ORDEM_CAT[y.cat]});
}

/* Recomendado é o único selo com porta. Higiene e orientação sobre o
   pós são saúde: um estúdio adorado onde 3 em cada 10 pessoas saem sem
   saber cuidar da ferida não é recomendável, por melhor que seja o
   traço. Média esconderia exatamente isso. */
function recomendado(a){
 return a.avaliacoesCheckout>=20 && a.higiene>=90 && a.orientaPos>=90 && a.rating>=4.5;
}
function porqueNaoRecomendado(a){
 if(a.avaliacoesCheckout<20)return "Faltam checkouts avaliados para o número significar alguma coisa ("+a.avaliacoesCheckout+" de 20).";
 if(a.higiene<90)return "Higiene do estúdio abaixo do mínimo em "+(100-a.higiene)+"% dos checkouts.";
 if(a.orientaPos<90)return "Clientes saíram sem orientação de cuidado em "+(100-a.orientaPos)+"% dos checkouts.";
 if(a.rating<4.5)return "Avaliação média abaixo de 4,5.";
 return "";
}

/* Um selinho. 'compacto' é o do feed: ícone e número, sem explicação —
   a explicação vive no perfil, onde há espaço para ela. */
function selo(x,compacto){
 var d=SELO_POR_ID[x.id];
 var t=d.nome+" — "+d.regra;
 /* Classe estática, categoria em atributo. Montar o nome da classe em
    tempo de execução, concatenando a categoria no fim, deixava a
    auditoria de CSS do diagnóstico cega: ela lê os nomes de classe do
    código-fonte, e ali só existia um prefixo. */
 return '<span class="selinho" data-c="'+x.cat+'" title="'+escapar(t)+'">'+
        '<span class="si">'+x.ic+'</span>'+(compacto?x.texto:x.nome)+'</span>';
}

/* O mesmo selo sem palavra nenhuma, para o canto do card no feed.

   Quem varre um feed não lê rótulo — reconhece forma e cor, e só para
   quando alguma coisa interessa. O número ("25 sessões verificadas")
   ocupava uma linha inteira para uma informação que ninguém compara
   card a card; ela importa depois, quando a pessoa já escolheu um
   perfil para olhar. Aqui fica o sinal; o perfil guarda a frase.

   aria-label não é opcional: ícone sem nome acessível é botão mudo para
   quem usa leitor de tela, e isso seria trocar legibilidade por
   exclusão. */
function seloIcone(x){
 var d=SELO_POR_ID[x.id];
 var t=x.texto+" — "+d.regra;
 return '<span class="selinho soic" data-c="'+x.cat+'" role="img" '+
        'title="'+escapar(t)+'" aria-label="'+escapar(x.texto)+'">'+
        '<span class="si">'+x.ic+'</span></span>';
}
/* Os selos do lugar. Ficam no lugar — nunca somados aos números do
   tatuador. Um profissional excelente num estúdio ruim não pode herdar
   a nota do lugar, e um estúdio impecável não empresta reputação a quem
   trabalha mal dentro dele. */
function selosDoEstudio(e){
 var r=[];
 if(estudioTemNota(e)&&e.higiene>=90)r.push({id:"higiene",texto:"Higiene "+e.higiene+"%"});
 if(e.verificado)r.push({id:"estverificado",texto:"Estúdio verificado"});
 if(e.guests>=10)r.push({id:"casadeguest",texto:e.guests+" guests recebidos"});
 if(e.enterprise)r.push({id:"enterprise",texto:"Enterprise"});
 r.forEach(function(x){var d=SELO_POR_ID[x.id];x.cat=d.cat;x.ic=d.ic;x.nome=d.nome;x.feed=d.feed});
 return r.sort(function(x,y){return ORDEM_CAT[x.cat]-ORDEM_CAT[y.cat]});
}
function selosNoFeed(a){
 var l=selosDe(a).filter(function(x){return x.feed});
 /* No máximo três. O quarto selo não acrescenta confiança, divide
    atenção — e a partir daí cada selo vale menos que o anterior. */
 return l.slice(0,3);
}

/* ═══ CHECK-IN POR QR ══════════════════════════════════════════════
   O tatuador abre o check-in na hora em que a pessoa senta. A tela
   dele mostra um QR; a pessoa aponta a câmera e confirma. Pronto: a
   sessão fica registrada dos dois lados, no mesmo instante, por duas
   pessoas que estavam no mesmo lugar.

   Por que isso vale mais que um formulário depois:
   · para o cliente, vira carimbo verificado no passaporte — a diferença
     entre dizer que tatuou com alguém e ter isso confirmado;
   · para o tatuador, vira reputação que não dá para inventar, e um
     relógio honesto: quanto tempo levou, em que estilo, em que cidade;
   · para a plataforma, é o único dado de sessão que nasce confiável,
     porque exige as duas partes presentes.

   O código de seis caracteres existe porque câmera falha: luz ruim,
   lente suja, celular velho. Um fluxo que só funciona com QR trava a
   sessão por causa de uma câmera. */
function novoCodigoCheckin(){
 var abc="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // sem I, O, 0 e 1: viram engano ao ditar
 var c="";
 for(var i=0;i<6;i++)c+=abc[Math.floor(Math.random()*abc.length)];
 return c;
}

/* Um QR de mentira, mas estável: o mesmo código desenha sempre o mesmo
   padrão. Se fosse aleatório a cada repintura, o quadrado piscaria a
   cada clique e pareceria defeito. */
function qrFalso(codigo,lado){
 lado=lado||160;
 var n=21, cel=lado/n, semente=0, i;
 for(i=0;i<codigo.length;i++)semente=(semente*31+codigo.charCodeAt(i))>>>0;
 function proximo(){ semente=(semente*1103515245+12345)>>>0; return (semente>>>16)&1 }
 var h='<svg viewBox="0 0 '+lado+' '+lado+'" width="'+lado+'" height="'+lado+'" role="img" aria-label="Código do check-in">';
 h+='<rect width="'+lado+'" height="'+lado+'" fill="#fff"/>';
 function ancora(cx,cy){
  var r='<rect x="'+(cx*cel)+'" y="'+(cy*cel)+'" width="'+(7*cel)+'" height="'+(7*cel)+'" fill="#111"/>';
  r+='<rect x="'+((cx+1)*cel)+'" y="'+((cy+1)*cel)+'" width="'+(5*cel)+'" height="'+(5*cel)+'" fill="#fff"/>';
  r+='<rect x="'+((cx+2)*cel)+'" y="'+((cy+2)*cel)+'" width="'+(3*cel)+'" height="'+(3*cel)+'" fill="#111"/>';
  return r;
 }
 for(var y=0;y<n;y++)for(var x=0;x<n;x++){
  var naAncora=(x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9);
  if(naAncora){proximo();continue}
  if(proximo())h+='<rect x="'+(x*cel)+'" y="'+(y*cel)+'" width="'+cel+'" height="'+cel+'" fill="#111"/>';
 }
 h+=ancora(0,0)+ancora(n-7,0)+ancora(0,n-7);
 return h+'</svg>';
}

/* ═══ O CHECK-IN ABRE NA LINHA DA SESSÃO ═══════════════════════════
   Era um cartão de tela inteira, centralizado, com QR de 180px — e ele
   nascia ACIMA da lista, porque o bloco vinha antes no código. Quem
   gerava o código via uma parede aparecer no topo e perdia de vista a
   sessão que a tinha gerado.

   Agora ele abre embaixo da própria linha, recuado, com o QR no
   tamanho de escanear a um palmo de distância. O vínculo entre a
   sessão e o código deixa de precisar de explicação: está na posição. */
/* Fechar a janela NÃO cancela o check-in. São coisas diferentes: o
   check-in é um estado com relógio correndo; a janela é só onde se olha
   para ele. Confundir os dois faria o tatuador perder a sessão inteira
   ao tocar fora do QR sem querer. */
function verOQR(){ if(S.checkin.aberto){S.checkin.janela=true;render()} }
function fecharJanelaQR(){ S.checkin.janela=false;render() }

function cartaoDoCheckin(ck){
 if(!ck.janela)return "";
 var h='<div class="scrim" onclick="fecharJanelaQR()"></div>';
 h+='<div class="qrjanela" role="dialog" aria-modal="true" aria-label="Check-in de '+escapar(ck.sessao.c)+'">';
 h+='<button class="iconbtn qrfechar" aria-label="Fechar" onclick="fecharJanelaQR()">✕</button>';
 h+='<div class="ckin">';
  h+='<div class="row" style="gap:var(--e2)"><span class="b small">'+ck.sessao.c+'</span>';
  h+=ck.confirmado?'<span class="badge ok">✓ confirmou às '+(ck.quando||"")+'</span>':'<span class="badge warn">esperando escanear</span>';
  h+='</div>';
  h+='<div class="tiny muted">'+ck.sessao.area+' · Studio Marina · São Paulo</div>';

  if(!ck.confirmado){
   h+='<div class="qrcx">'+qrFalso(ck.codigo,132)+'</div>';
   h+='<div class="tiny muted">ou dite o código</div>';
   h+='<div class="codigo">'+ck.codigo+'</div>';
   h+='<div class="tiny muted" style="margin-top:var(--e2)">Mostre a tela para a pessoa. Câmera ruim acontece — por isso o código serve para ser ditado.</div>';
   h+='<div class="sep"></div>';
   h+='<div class="tiny muted">Enquanto ela não confirmar, nada é registrado. O check-in exige os dois.</div>';
   h+='<button class="btn blk" style="margin-top:var(--e3)" onclick="fecharCheckin()">Cancelar</button>';
  } else if(!ck.inicio){
   h+='<div style="font-size:34px;margin-top:var(--e4)">✅</div>';
   h+='<div class="b" style="margin-top:var(--e1)">Vinculado</div>';
   h+='<div class="small muted" style="margin-top:var(--e1)">Agora o relógio. Ele é o que transforma esta sessão em dado de desempenho — quanto tempo este estilo leva com você, de verdade.</div>';
   h+='<button class="btn primary blk" style="margin-top:var(--e3)" onclick="iniciarSessaoCheckin()">Iniciar a sessão</button>';
  } else if(!ck.fim){
   h+='<div class="relogio">em andamento</div>';
   h+='<div class="small muted">Começou às '+agoraHm()+'. Pode fechar a tela: o relógio continua.</div>';
   h+='<button class="btn primary blk" style="margin-top:var(--e3)" onclick="S.checkin.saida=\'qr\';encerrarSessaoCheckin()">Encerrar a sessão</button>';
  } else {
   h+='<div class="relogio">'+horasBonitas(duracaoCheckin())+'</div>';
   h+='<div class="small muted">'+rotuloDaSaida()+'</div>';
   h+='<div class="tiny muted" style="margin-top:var(--e1)">Registrado nos dois lados: no passaporte de '+ck.sessao.c+' e no seu histórico.</div>';
   if(duracaoEhMedida())
    h+='<div class="avisook" style="margin-top:var(--e3);text-align:left">A duração entra em <b>Desempenho</b>. Com algumas sessões, a média por estilo passa a valer mais que a sua estimativa.</div>';
   else
    h+='<div class="avisoerro" style="margin-top:var(--e3);text-align:left">Esta não entra em <b>Desempenho</b>: o fechamento foi por distância, e o tempo é estimativa. Misturar estimado com medido estragaria a média que você usa para orçar.</div>';
   h+='<div class="tiny muted" style="margin-top:var(--e3)">'+ck.sessao.c+' recebe agora as perguntas do checkout. Higiene e orientação sobre os cuidados são o que decide o seu selo <b>Recomendado</b>.</div>';
   h+='<button class="btn blk" style="margin-top:var(--e3)" onclick="fecharCheckin()">Concluir</button>';
  }
  h+='</div>';
 return h+'</div></div>';
}

/* O código nasce do agendamento, não de um botão genérico: cada sessão
   marcada gera o seu, e é isso que liga o QR a esta pessoa, neste dia,
   neste estúdio. Abrir de dentro da agenda deixa esse vínculo óbvio. */
function abrirCheckin(i){
 var b=BOOK[i]||BOOK[0];
 S.checkin={aberto:true,janela:true,codigo:novoCodigoCheckin(),sessao:b,confirmado:false,inicio:null,fim:null,erro:null};
 S.sub=S.sub||{}; S.sub.ck="agora";
 irSecao("studio-schedule","ag","sessoes");
}
function fecharCheckin(){
 S.checkin={aberto:false,codigo:null,sessao:null,confirmado:false,inicio:null,fim:null,erro:null};
 render();
}
/* O cliente digita o código, ou toca em escanear — que aqui faz o que a
   câmera faria: entrega o código que está na tela do tatuador. */
function escanearCheckin(){
 if(!S.checkin.aberto){S.checkin.erro="Nenhum check-in aberto. Peça ao tatuador para abrir o dele.";render();return}
 S.checkinCod=S.checkin.codigo;
 confirmarCheckin();
}
function confirmarCheckin(){
 var digitado=(S.checkinCod||"").trim().toUpperCase();
 if(!S.checkin.aberto){S.checkin.erro="Nenhum check-in aberto agora.";render();return}
 if(digitado!==S.checkin.codigo){S.checkin.erro="Esse código não confere com nenhum check-in aberto.";render();return}
 S.checkin.erro=null;
 S.checkin.confirmado=true;
 S.checkin.quando=agoraHm();
 render();
}
function iniciarSessaoCheckin(){ S.checkin.inicio=Date.now(); render() }
/* ═══ CHECKOUT ═════════════════════════════════════════════════════
   Fecha pelo mesmo QR. Mas ninguém lembra de fechar nada depois de seis
   horas de agulha — então a distância é a rede: quando o celular do
   cliente se afasta do estúdio, o produto pergunta se terminou.

   Duas coisas que essa rede não pode fazer:

   · Fechar sozinha, calada. A pessoa precisa confirmar; caso contrário
     o produto estaria escrevendo no histórico dela sem ela saber.
   · Contar como duração medida. Sessão fechada por distância ou por
     tempo entra como ESTIMADA, e fica dito assim. Se dado estimado se
     misturasse ao medido, o número que faz o check-in valer a pena —
     quanto tempo aquele estilo leva de verdade — viraria ruído em
     poucas semanas.

   A distância também custa uma permissão de localização pesada. Ela é
   rede de segurança, não o caminho principal: quem fecha pelo QR nunca
   precisa conceder nada. */
function afastouDoEstudio(){
 S.checkin.longe=true;
 render();
}
function encerrarPorDistancia(){
 S.checkin.saida="distancia";
 encerrarSessaoCheckin();
}
function duracaoEhMedida(){ return S.checkin.saida==="qr" }
function rotuloDaSaida(){
 return S.checkin.saida==="qr" ? "medida pelo relógio da sessão"
      : S.checkin.saida==="distancia" ? "estimada — fechada quando você se afastou do estúdio"
      : "estimada — fechada automaticamente no fim do dia";
}

function encerrarSessaoCheckin(){
 S.checkin.fim=Date.now();
 if(!S.checkin.saida)S.checkin.saida="qr";
 /* A sessão encerrada vira linha no passaporte do cliente, privada
    como todas. Guardá-la pública por padrão seria decidir por ele
    justamente no momento em que ele está menos disponível para
    decidir — acabou de levar quatro horas de agulha. */
 var b=S.checkin.sessao||BOOK[0];
 PASS.unshift({id:"pa"+Date.now(),quando:"hoje",ordem:PASS.length+1,artista:"Marina Vieira",arh:"@marinavtattoo",
  destaque:false,estudio:"Studio Marina",cidade:"São Paulo",uf:"SP",pais:"Brasil",continente:"América do Sul",
  estilo:"fineline",parte:b.area,horas:duracaoCheckin(),seed:31,verificado:true,publico:false,
  medida:duracaoEhMedida()});
 render();
}
function duracaoCheckin(){
 if(!S.checkin.inicio||!S.checkin.fim)return 0;
 return Math.max(0.1,(S.checkin.fim-S.checkin.inicio)/3600000);
}
function agoraHm(){
 var d=new Date();
 return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
}
function horasBonitas(h){
 if(!h)return "—";
 var m=Math.round(h*60);
 return m<60 ? m+" min" : Math.floor(m/60)+"h"+(m%60?("0"+(m%60)).slice(-2):"");
}

/* ═══ MARCOS DO PASSAPORTE ═════════════════════════════════════════
   Derivados dos fatos, sempre no passado. Nenhuma regra aqui olha para
   frente: não existe "faltam", não existe "próximo nível", não existe
   contagem regressiva. Um marco só nasce depois de acontecer, e a data
   dele é a data da sessão que o produziu.

   É a diferença entre um álbum e uma cartela de bingo. */
function marcosDo(l){
 var m=[], vistos={}, paises={}, estilos={};
 var ordenado=l.slice().sort(function(a,b){return a.ordem-b.ordem});
 ordenado.forEach(function(t,i){
  if(i===0)m.push({ic:"✨",t:"A primeira",d:t.quando,p:"com "+t.artista+", em "+t.cidade});
  if(!estilos[t.estilo]){estilos[t.estilo]=1;
   if(i>0)m.push({ic:"🎨",t:"Primeira em "+(SL[t.estilo]||t.estilo),d:t.quando,p:"com "+t.artista});}
  if(!paises[t.pais]){paises[t.pais]=1;
   if(i>0)m.push({ic:"🌐",t:"Primeira vez em "+t.pais,d:t.quando,p:t.cidade+" · "+t.estudio});}
  if(t.destaque)m.push({ic:"⭐",t:"Tatuou com "+t.artista,d:t.quando,p:"perfil em destaque no catálogo"});
 });
 var n=ordenado.length;
 [5,10,25].forEach(function(marca){
  if(n>=marca)m.push({ic:"🕘",t:marca+" sessões",d:ordenado[marca-1].quando,p:"desde "+ordenado[0].quando});
 });
 var continentes={}; ordenado.forEach(function(t){continentes[t.continente]=1});
 var nc=Object.keys(continentes).length;
 if(nc>1)m.push({ic:"🌐",t:nc+" continentes",d:"",p:Object.keys(continentes).join(" · ")});
 return m.reverse();
}
function passPublico(t){ return S.passPub.indexOf(t.id)>=0 }
function alternarPassPublico(id){
 var i=S.passPub.indexOf(id);
 if(i>=0)S.passPub.splice(i,1); else S.passPub.push(id);
 render();
}
/* ═══ AS DUAS FACES DO MESMO REGISTRO ══════════════════════════════
   Um check-in produz UM fato: fulana tatuou com beltrano, no estúdio
   tal, na cidade tal, no estilo tal, naquela data.

   O cliente lê esse fato como onde ele já esteve — tatuadores,
   estilos, estúdios, cidades, países.
   O tatuador lê o MESMO fato como o que já fez — pessoas, estilos,
   estúdios, cidades, países.

   É o mesmo dado com o sujeito trocado, e por isso o resumo é uma
   função só. O que muda é qual dimensão leva o nome do outro: para o
   cliente, "tatuadores"; para o tatuador, "pessoas".

   A assimetria que sobra é de granularidade, não de natureza: o
   cliente tem uma linha por sessão porque são poucas e cada uma é uma
   marca no corpo dele. O tatuador tem agregados porque sessenta e
   cinco linhas seriam ruído — mas as dimensões contadas são as mesmas
   cinco, nos dois lados. */
var DIMENSOES=["sessoes","estilos","estudios","cidades","paises"];

function resumoDaTrajetoria(itens, papel){
 var estilos={},estudios={},cidades={},paises={},gente={},sessoes=0,horas=0,ver=0;
 itens.forEach(function(t){
  var peso=t.peso||1;
  sessoes+=peso;
  if(t.estilo)estilos[t.estilo]=1;
  if(t.estudio)estudios[t.estudio]=1;
  if(t.cidade)cidades[t.cidade]=1;
  if(t.pais)paises[t.pais]=1;
  /* A dimensão que troca de nome com o papel. */
  var outro = papel==="cliente" ? t.artista : t.cliente;
  if(outro)gente[outro]=1;
  horas+=(t.horas||0);
  if(t.verificado)ver+=peso;
 });
 return {sessoes:sessoes,estilos:Object.keys(estilos).length,
         estudios:Object.keys(estudios).length,cidades:Object.keys(cidades).length,
         paises:Object.keys(paises).length,gente:Object.keys(gente).length,
         horas:horas,verificadas:ver,
         rotuloGente: papel==="cliente" ? "tatuadores" : "pessoas"};
}

function trajetoriaDoTatuador(){
 var itens=HIST_ESTUDIOS.map(function(e){

 });

/* A mesma faixa de números nos dois lados. Formas diferentes para o
   mesmo fato fariam a pessoa que é cliente E tatuadora — que é a
   maioria de quem tatua — reaprender a ler ao trocar de papel. */
function faixaDaTrajetoria(r,papel){
 var cliente = papel==="cliente";
 /* As dimensões e a ordem são as mesmas nos dois lados. O que muda é
    a nota embaixo — porque a mesma sessão é "onde você tatuou" para
    quem levou a agulha e "incluindo os de passagem" para quem a
    segurou. */
 var linhas=[
  ["◉","Sessões",r.sessoes,r.verificadas+" com check-in"],
  ["🎨","Estilos",r.estilos,"registrados"],
  ["🏠","Estúdios",r.estudios,cliente?"onde você se tatuou":"incluindo os de passagem"],
  ["📍","Cidades",r.cidades,"diferentes"],
  ["🌐","Países",r.paises,cliente?"onde você tatuou":"onde você trabalhou"]
 ];
 /* Horas só existem do lado de quem contou o relógio. Mostrar zero
    seria pior que não mostrar. */
 if(r.horas>0)linhas.push(["🕘","Horas sob agulha",Math.round(r.horas),"somando as sessões"]);
 var h='<div class="stats" style="margin-top:var(--e4)">';
 linhas.forEach(function(x){
  h+='<div class="stat"><div class="lbl">'+x[0]+' '+x[1]+'</div><div class="val">'+x[2]+'</div><div class="hint">'+x[3]+'</div></div>';
 });
 h+='</div>';
 return h;
}

function resumoDoPassaporte(l){

 l.forEach(function(t){paises[t.pais]=1;estilos[t.estilo]=1;artistas[t.artista]=1;horas+=t.horas;if(t.verificado)ver++});

   Quantas sessões daquele tatuador foram confirmadas por check-in.

   aconteceu. Um perfil pode comprar elogio; não pode comprar duas

function sessoesVerificadas(a){

/* ═══ PERSISTÊNCIA ═══════════════════════════════════════════════
   Até aqui um F5 apagava tudo: sessão, carrinho, seguidos, curtidas,
   progresso de cadastro e a própria tela. Num teste com gente de
   verdade isso não é incômodo, é perda de dado — a pessoa some do
   funil por um recarregamento e a leitura fica errada.

   Guardamos uma lista fechada de chaves, não o S inteiro: o estado
   também carrega o que veio do banco (artistas, preços, portfólio),
   que precisa ser buscado de novo e não sobreviver em cache velho. */
/* v2: o formato do estado mudou quando o cadastro virou três passos.
   Trocar a chave descarta o estado antigo em vez de restaurá-lo por
   cima do novo — um S.cad da versão anterior levaria a pessoa para um
   passo que não existe mais. */
var CHAVE_ESTADO="ink.estado.v2";
var GUARDA=["session","route","artist","tab","modo","seguindo","curtidas","cart",
 "cad","perfilLanding","abaPerfil","shopAud","shopCat","shopQ","shopVista","feedQuem","evAba","q",
 "destaqueAtivo","roleSource","voltarPara","voltarArtista","abaModelo","histAba","sub","agendaGoogle","googleCalendario","emailConfirmado","emailPendente","onbStep","onbName","onbStyles","onbEstudio","onbCidade","onbUf","onbInsta","usuario","fazCobertura","ehFornecedor",
 "notifFilter","pfTab","ue","f","feedLote","caro","cep","sqSel","orcPasso","passPub","checkin","aval","estudioSel","administraEstudio"];
// orcEnviado fica de fora de propósito: é a confirmação de uma ação que
// acabou de acontecer. Sobreviver à recarga faria a tela comemorar de
// novo um envio de ontem.
function salvarEstado(){
 try{var o={};GUARDA.forEach(function(k){if(S[k]!==undefined)o[k]=S[k]});
  // Senha em disco não. Ela sobrevive à recarga só enquanto a aba
  // estiver viva, e some junto com ela.
  if(o.cad)o.cad=Object.assign({},o.cad,{senha:""});
  localStorage.setItem(CHAVE_ESTADO,JSON.stringify(o))}catch(e){}
}
/* ── LIMPEZA DO QUE FICOU GRAVADO ──────────────────────────────────
   Sub-aba é escolha guardada, e arquitetura muda. Quem usou o produto
   ontem tem no navegador a chave de uma seção que hoje não existe — e
   uma escolha guardada apontando para o nada é como uma tela abre
   vazia sem ninguém entender por quê.

   Duas limpezas, e as duas com o mesmo espírito: guardar a escolha de
   quem já esteve aqui, mas nunca deixá-la mandar numa arquitetura que
   ela não conhece.

   1. Chave aposentada: a seção inteira deixou de existir.
   2. Valor inválido: a chave vive, a peça escolhida não. */
var CHAVES_APOSENTADAS=[
 "vg",    // seções da Visão geral, até a decisão 033
 "ck",    // check-in como aba própria
 "hoje"   // primeira versão da Visão geral
];
function limparSubAntigo(sub){
 if(!sub||typeof sub!=="object")return {};
 CHAVES_APOSENTADAS.forEach(function(k){delete sub[k]});
 var validos={};
 Object.keys(SECOES_DA_GESTAO).forEach(function(rota){
  SECOES_DA_GESTAO[rota].forEach(function(sec){
   (validos[sec[0]]=validos[sec[0]]||[]).push(sec[1]);
  });
 });
 Object.keys(sub).forEach(function(k){
  if(validos[k] && validos[k].indexOf(sub[k])<0)delete sub[k];
 });
 return sub;
}
function restaurarEstado(){
 try{var o=JSON.parse(localStorage.getItem(CHAVE_ESTADO)||"{}");
  GUARDA.forEach(function(k){if(o[k]!==undefined)S[k]=o[k]});
  S.sub=limparSubAntigo(S.sub)}catch(e){}
}
function limparEstado(){try{localStorage.removeItem(CHAVE_ESTADO)}catch(e){}}

/* Geolocalização REAL do navegador. Não precisa de chave nem de conta —

   O que ainda falta para fechar a integração com o Google Maps:
     · transformar coordenada em endereço legível (geocodificação reversa)
     · buscar por endereço digitado
     · desenhar o mapa de verdade em vez da grade simulada
   Os três exigem chave da API e passam por servidor, para a chave não
   ficar exposta no navegador. Está anotado em decisoes/pendencias.md. */
function usarMinhaLocalizacao(){
 if(!navigator.geolocation){
  S.localErro="Este navegador não oferece geolocalização.";render();return;

   ? "Permissão negada. Você pode digitar a cidade no campo de busca."

}

/* ═══ CARDS EM GRADE ═══════════════════════════════════════════════
   Feed de uma foto por card é regular demais: a pessoa desce e tudo
   tem a mesma cara. Dois tipos de grade quebram o ritmo, e cada um
   responde a uma pergunta diferente.

   A densidade de cada um vem da pergunta, não da estética. Quatro
   células para julgar consistência de traço de uma pessoa — em nove
   células ninguém julga traço. Nove células para descobrir gente nova
   num estilo — ali a pessoa varre, não julga.
   ═════════════════════════════════════════════════════════════════ */

/* Quem entra em grade é decidido pelo seed, não por sorteio: sorteio
   embaralharia o feed a cada repintura e pareceria defeito. */
function grades(lista, indice) {
  if (lista.length < 5) return "";
  var qual = indice % 2;
  if (qual === 0) {
    var a = lista[(indice * 7) % lista.length];
    return (a && !a.empty && a.port.length >= 4) ? gradePortfolio(a) : "";
  }
  return gradeEstilo(lista, indice);
}

/* Quatro trabalhos da mesma pessoa. Uma foto isolada diz se você gosta
   daquela peça; quatro dizem se você gosta da mão. */
function gradePortfolio(a) {
  var h = '<article class="post postgrade">';
  h += '<button class="gcx" onclick="go(\'artist\',\'' + a.id + '\')" aria-label="Ver o portfólio de ' + escapar(a.name) + '">';
  h += '<div class="gcels quatro">';
  a.port.slice(0, 4).forEach(function (p) {
    h += '<span class="gcel" style="background-image:' + tex(p) + '"></span>';
  });
  h += '</div>';
  h += '<span class="getiq">' + a.port.length + ' trabalhos</span>';
  h += '</button>';
  h += '<button class="postpe" onclick="go(\'artist\',\'' + a.id + '\')">';
  h += '<div class="row" style="gap:var(--e2);min-width:0"><span class="pnome">' + a.name + '</span></div>';
  h += '<div class="ppe">' + a.port.length + ' trabalhos · ' + a.city + '/' + a.state + '</div>';
  h += '</button></article>';
  return h;
}

/* Nove trabalhos de gente diferente no mesmo estilo. Serve para
   descobrir quem você ainda não viu — por isso o card leva ao filtro,
   não a um perfil. */
function gradeEstilo(lista, indice) {
  var estilos = Object.keys(SL);
  var slug = estilos[(indice * 5) % estilos.length];
  var deles = lista.filter(function (x) { return !x.empty && x.styles.indexOf(slug) >= 0 });
  if (deles.length < 3) return "";
  /* Uma peça por pessoa: nove fotos do mesmo tatuador não seriam uma
     descoberta, seriam o portfólio dele com outro nome. */
  var fotos = [];
  deles.forEach(function (x) { if (x.port.length) fotos.push(x.port[0]) });
  while (fotos.length < 9 && deles.length) {
    var x = deles[fotos.length % deles.length];
    var p = x.port[Math.floor(fotos.length / deles.length) % x.port.length];
    if (p === undefined) break;
    fotos.push(p);
  }
  fotos = fotos.slice(0, 9);
  if (fotos.length < 6) return "";

  var h = '<article class="post postgrade">';
  h += '<button class="gcx" onclick="filtrarPorEstilo(\'' + slug + '\')" aria-label="Ver tatuadores de ' + escapar(SL[slug]) + '">';
  h += '<div class="gcels nove">';
  fotos.forEach(function (p) { h += '<span class="gcel" style="background-image:' + tex(p) + '"></span>' });
  h += '</div>';
  /* Sem isto, um mosaico de nove fotos se confunde com nove cards
     vizinhos do masonry. A etiqueta diz que os nove são um só. */
  h += '<span class="getiq">' + fotos.length + ' trabalhos</span>';
  h += '</button>';
  h += '<button class="postpe" onclick="filtrarPorEstilo(\'' + slug + '\')">';
  h += '<div class="row" style="gap:var(--e2);min-width:0"><span class="pnome">' + SL[slug] + '</span></div>';
  h += '<div class="ppe">' + deles.length + ' tatuadores · perto de você</div>';
  h += '</button></article>';
  return h;
}

/* O filtro mora em S.f.styles, não em S.styles. Escrevi no lugar
   errado na primeira versão e o card virava um botão que não fazia
   nada — o pior defeito possível num card de descoberta, porque a
   pessoa conclui que não há mais nada naquele estilo. */
function filtrarPorEstilo(slug) {
  S.f.styles = [slug];
  S.f.q = "";
  S.feedLote = 1;
  S.route = "home";
  window.scrollTo(0, 0);
  render();
}

/* Intercala as grades entre os cards, a cada três publicações.

   Eram cinco, e a primeira caía na posição 5 de um lote de 8: uma
   grade só, no meio de uma coluna, fácil de não ver. Com fotos menores
   o feed corre mais rápido, e três é a distância em que a quebra de
   ritmo se nota sem virar o próprio ritmo.

   A PRIMEIRA é a de estilo, com nove células — é a que se lê como
   grade à primeira vista. A de portfólio, com quatro, parece um card
   com quatro fotos, e sozinha não comunica a ideia. */
/* Quantas colunas cabem. Os MESMOS pontos de quebra que o CSS usava —
   se um dia mudarem lá, mudam aqui, e o diagnóstico compara os dois.
   Recebe a largura por parâmetro para o teste poder variar o que o
   navegador de verdade varia. */
/* Quatro no teto, a pedido dela: acima disso a foto encolhe além do
   que um feed de descoberta aguenta em desktop. Duas no chão, sempre. */
function quantasColunas(w){
 w=w||window.innerWidth;
 return w<560?2:w<700?3:4;
}

/* As grades entram depois de 3 posts, depois de 4, alternando. O
   intervalo variável não é capricho: com o ziguezague abaixo, período
   constante par faria toda grade cair sempre na MESMA coluna — a
   alternância que a estética pede depende de o intervalo variar. */
function comGrades(lista, ate) {
  var pecas = [], g = 1, desde = 0, passo = 3;
  lista.slice(0, ate).forEach(function (a) {
    pecas.push(publicacao(a)); desde++;
    if (desde === passo) { pecas.push(grades(lista, g)); g++; desde = 0; passo = passo === 3 ? 4 : 3 }
  });
  return pecas;
}

/* ── A ESTÉTICA DO FEED É ZIGUEZAGUE ──────────────────────────────
   A primeira versão disto punha cada peça na coluna estimada mais
   curta. Parou a dança — e matou o ritmo: as duas grades caíram na
   mesma coluna e a outra levou cinco posts seguidos. O Pinterest que
   ela pediu não é só altura variada; é a ALTERNÂNCIA — o olho lê em
   ziguezague, vizinho na sequência é vizinho na tela.

   Ziguezague estrito: a peça i mora na coluna i % n. Três coisas de
   graça: a ordem de leitura fica previsível, as colunas ficam com a
   mesma contagem, e a estabilidade é trivial — o índice de uma peça
   nunca muda, então repintar com mais um lote não move ninguém. */
function emColunas(pecas){
 var nc=quantasColunas();
 colunasDesenhadas=nc;
 var cols=[];
 for(var k=0;k<nc;k++)cols.push("");
 pecas.forEach(function(html,i){ cols[i%nc]+=html });
 /* O layout das colunas vai INLINE, além das classes — de propósito e
    por cicatriz: no navegador dela (e no publicado, visto com meus
    próprios olhos) a regra .feedposts{display:flex} chegava computada
    como BLOCK, com a regra byte-perfeita na folha. Nunca achamos o
    assassino — extensão, cache, parser, não importa: estilo inline
    não tem intermediário para morrer. O masonry é a alma desta tela;
    alma não fica pendurada numa regra que algo pode engolir. */
 /* O degrau nas colunas pares durou uma rodada: com o masonry enfim
    visível, ela pediu a primeira linha ALINHADA ao topo, rente ao
    campo de busca — como no Pinterest de verdade, onde o desencontro
    nasce das alturas das fotos, não de um empurrão artificial.
    Decisão que trocou de sinal, registrada: o empurrão existiu para
    compensar um desencontro que as proporções novas já produzem. */
 var estiloCol='flex:1 1 0;min-width:0;';
 return '<div class="feedposts" style="display:flex;gap:8px;align-items:flex-start">'+
  cols.map(function(c){
   return '<div class="feedcol" style="'+estiloCol+'">'+c+'</div>';
  }).join("")+'</div>';
}

/* O card do estúdio no feed: a mesma gramática do card de tatuador —
   foto grande com canto de cartaz, pé de duas linhas — porque é o
   mesmo feed; o que muda é o sujeito. A capa usa a textura do id, e
   o pé responde o que se pergunta de um LUGAR: higiene medida, quem
   atende lá, desde quando. */
function cardDeEstudio(e,i){
 var h='<article class="post">';
 h+='<div class="postimg" style="aspect-ratio:'+proporcaoDaFoto(i+2)+'">';
 h+='<div class="sl on" style="background-image:'+tex(i*5+3)+'"></div>';
 h+='<button class="postir" aria-label="Ver o estúdio '+escapar(e.nome)+'" onclick="S.estudioSel=\''+e.id+'\';go(\'estudio\')"></button>';
 if(e.verificado)h+='<span class="tagtl">✔ verificado</span>';
 h+='</div>';
 h+='<button class="postpe" onclick="S.estudioSel=\''+e.id+'\';go(\'estudio\')">';
 h+='<div class="row" style="gap:var(--e2);min-width:0"><span class="pnome">'+e.nome+'</span></div>';
 h+='<div class="ppe">'+e.cidade+(e.uf?'/'+e.uf:'')+' · '+e.cadeiras+' cadeira(s) · desde '+e.desde+'</div>';
 h+='<div class="pehover"><div class="ppe">Higiene '+e.higiene+'% · '+e.residentes.length+' residentes</div></div>';
 h+='</button></article>';
 return h;
}

function listaDeEstudios(){
 var l=ESTUDIOS.filter(function(e){
  var q=(S.f.q||"").trim().toLowerCase();
  if(q&&(e.nome+" "+e.cidade).toLowerCase().indexOf(q)<0)return false;
  return true;
 });
 if(!l.length)return '<div class="card pad muted" style="margin-top:var(--e4)">Nenhum estúdio com essa busca.</div>';
 var pecas=l.map(function(e,i){return cardDeEstudio(e,i)});
 return emColunas(pecas)+
  '<div class="row" style="justify-content:center;padding:var(--e5) 0"><span class="tiny muted">Você viu todos os estúdios por perto.</span></div>';
}

function feedList(){
 if(S.feedQuem==="estudios")return listaDeEstudios();
 // Em modo real, o catálogo vem do banco. Se estiver vazio, dizer isso
 // com clareza é mais honesto do que preencher com gente que não existe.
 if(S.modo==="real"){
  if(S.reaisArtistas===null){
   carregarArtistasReais();
   return '<div class="card pad muted" style="margin-top:var(--e4)">Carregando do banco…</div>';
  }
  if(S.reaisArtistas.length===0){
   return '<div class="card pad" style="margin-top:var(--e4)"><div class="b">Nenhum tatuador cadastrado ainda.</div>'+
    '<div class="small muted" style="margin-top:var(--e1)">O banco está vazio — o que é esperado, ele foi criado hoje. Para ver o catálogo funcionando com dado real, crie uma conta de tatuador, preencha o perfil e publique.</div>'+
    '<div class="row" style="gap:var(--e2);margin-top:var(--e3)"><button class="btn" onclick="go(\'conexao\')">Criar conta de teste</button>'+
    '<button class="btn" onclick="setModo(\'demo\')">Voltar para demonstração</button></div></div>';
  }
  return emColunas(comGrades(S.reaisArtistas,S.reaisArtistas.length));
 }
 var l=filteredArtists();
 if(!l.length)return '<div class="card pad muted" style="margin-top:var(--e4)">Nenhum tatuador com esses filtros. Tente ampliar a faixa de preço ou remover algum estilo.</div>';

 // Destaque contratado sobe, e só. Não filtra ninguém e não esconde quem
 // não paga — por isso a etiqueta é obrigatória: sem ela o cliente lê a
 // ordem como mérito.
 l=l.slice().sort(function(x,y){return (y.destaque?1:0)-(x.destaque?1:0)});

 /* Scroll infinito: mostra um lote por vez e cresce ao chegar no fim.
    O lote era de três porque cada card ocupava a largura toda. Com a
    foto menor e duas colunas, três cards são meia tela — e meia tela
    de conteúdo com o rodapé aparecendo parece que acabou. */
 var ate=Math.min(l.length,S.feedLote*8);
 var h=emColunas(comGrades(l,ate));
 if(ate<l.length){
  h+='<div id="sentinela" class="row" style="justify-content:center;padding:var(--e5) 0"><span class="tiny muted">carregando mais…</span></div>';
 }else{
  h+='<div class="row" style="justify-content:center;padding:var(--e5) 0"><span class="tiny muted">Você viu tudo que combina com esses filtros.</span></div>';
 }
 return h;
}

/* Publicação: um tatuador por vez, com o portfólio como carrossel.
   Curtir foto e seguir tatuador alimentam o que a plataforma entende
   sobre o gosto da pessoa — e é isso que faz o orçamento chegar em quem
   realmente combina, em vez de em quem só bate o filtro. */
/* ═══ O CARD DO FEED ═══════════════════════════════════════════════
   Interface #2: a foto é o card.

   Antes eram quatro faixas de texto e uma foto em 4:3. Tatuagem não
   cabe em 4:3 — a maioria é vertical, e recortar para caber numa
   moldura é editar o trabalho de outra pessoa sem pedir.

   Agora a foto define a altura, o texto encolheu para duas linhas no
   pé, e os selos flutuam no canto. Cabem três a quatro vezes mais
   trabalhos por tela.

   ONDE FORAM PARAR OS BOTÕES
   Orçar, agenda e seguir saíram da face do card e vivem no perfil —
   que é onde já estavam também. Doze cards × quatro botões era o
   ruído. E há um argumento de produto: o card inteiro leva ao perfil,
   e o perfil é onde a reputação está antes do preço. A decisão de
   pedir orçamento deveria acontecer depois de olhar, não durante.

   No desktop eles reaparecem ao passar o mouse, sobre o rodapé da
   foto. No celular não há hover — e ali um toque no card já leva ao
   perfil, que é o gesto que a pessoa faria de qualquer forma.

   Salvar continua na foto: é a única ação que pertence à imagem, e não
   ao profissional. */

/* Proporção derivada do mesmo número que gera a textura. Real, a altura
   viria da foto; aqui ela precisa ser estável — se mudasse a cada
   repintura, a coluna dançaria a cada clique. */
/* Sete proporções, do quadrado ao pin alto. Cinco davam um vão de
   1,0–1,67 entre a mais baixa e a mais alta; com o 9/16 o vão vai a
   1,78 e o feed ganha o pin ALTO que dá ao Pinterest a cara de
   Pinterest — sem ele, tudo parece variação tímida do mesmo card. */
var PROPORCOES=["3 / 4","2 / 3","1 / 1","4 / 5","3 / 5","9 / 16","5 / 7"];
function proporcaoDaFoto(seed){ return PROPORCOES[Math.abs(seed)%PROPORCOES.length] }

function publicacao(a){
 var i=S.caro[a.id]||0;
 var fotos=a.empty?[]:a.port.slice(0,6);
 var total=fotos.length;
 var segue=S.seguindo.indexOf(a.id)>=0;
 var curtiu=S.curtidas.indexOf(a.id+":"+i)>=0;
 var dist=distanciaTexto(a);
 var sf=selosNoFeed(a);
 var pagos=sf.filter(function(x){return x.cat==="contratado"});
 var ganhos=sf.filter(function(x){return x.cat!=="contratado"});

 var h='<article class="post">';

 /* ── A foto ─────────────────────────────────────────────────── */
 h+='<div class="postimg" style="aspect-ratio:'+proporcaoDaFoto(a.seed)+'">';
 if(!total){
  h+='<div class="vazio"><span class="b small">Portfólio em construção</span>';
  h+='<span class="tiny">ainda sem fotos publicadas</span></div>';
 }else{
  fotos.forEach(function(p,k){h+='<div class="sl '+(k===i?"on":"")+'" style="background-image:'+tex(p)+'"></div>'});
  /* Área invisível cobrindo a foto: o card inteiro leva ao perfil.
     Os controles ficam por cima dela, com z-index. */
  h+='<button class="postir" aria-label="Ver o perfil de '+escapar(a.name)+'" onclick="go(\'artist\',\''+a.id+'\')"></button>';
  if(a.insta)h+='<span class="tagtl">Instagram</span>';
  if(ganhos.length){
   h+='<button class="selosic" title="Ver como esta reputação se formou" aria-label="Reputação de '+escapar(a.name)+'" onclick="event.stopPropagation();S.abaPerfil=\'reputacao\';go(\'artist\',\''+a.id+'\')">';
   h+=ganhos.map(seloIcone).join("")+'</button>';
  }
  if(i>0)h+='<button class="nav l" aria-label="Foto anterior" onclick="event.stopPropagation();caro(\''+a.id+'\',-1,'+total+')">‹</button>';
  if(i<total-1)h+='<button class="nav r" aria-label="Próxima foto" onclick="event.stopPropagation();caro(\''+a.id+'\',1,'+total+')">›</button>';
  h+='<button class="coracao '+(curtiu?"on":"")+'" title="'+(curtiu?"Salva":"Salvar esta foto")+'" aria-label="'+(curtiu?"Tirar dos salvos":"Salvar esta foto")+'" onclick="event.stopPropagation();alternarCurtida(\''+a.id+'\','+i+')">'+(curtiu?"♥":"♡")+'</button>';
  h+='<div class="pips">';for(var k=0;k<total;k++)h+='<i class="'+(k===i?"on":"")+'"></i>';h+='</div>';

  /* Ações no hover, sobre o rodapé da foto. Só no ponteiro fino: no
     toque elas nunca apareceriam, e um botão que não aparece é pior
     que um botão que não existe. */
  h+='<div class="postacoes">';
  h+='<button class="btnicone'+(contaPendente()?" pendente":"")+'" title="Pedir orçamento" aria-label="Pedir orçamento" onclick="event.stopPropagation();'+(contaPendente()?"explicarTrava('pedir orçamento')":"quoteFor('"+a.id+"')")+'">👛</button>';
  /* "Ver agenda" saiu do card. Quem decide quando é o tatuador —
     mostrar horário livre para o cliente escolher inverte quem manda
     na semana de trabalho de alguém. O que o card oferece agora é
     orçar e seguir; a data vem depois, decidida por ele. */
  h+='<button class="btnicone'+(segue?" on":"")+'" title="'+(segue?"Deixar de seguir":"Seguir")+'" aria-label="'+(segue?"Deixar de seguir":"Seguir")+'" onclick="event.stopPropagation();alternarSeguir(\''+a.id+'\')">'+(segue?"✓":"👤")+'</button>';
  h+='</div>';
 }
 h+='</div>';

 /* ── O pé: duas linhas, e o resto ao passar o mouse ─────────────
    Quem, e onde atende. Estilos e preço continuam existindo, mas
    embaixo de uma foto pequena quatro linhas de texto ficam da altura
    da própria imagem — e aí o feed deixa de ser um feed de trabalho e
    vira uma lista com foto.

    No toque não há hover, então lá ficam as duas linhas. As outras
    duas estão no perfil, a um toque, e existe um diagnóstico que
    falha se algum dia deixarem de estar. */
 h+='<button class="postpe" onclick="go(\'artist\',\''+a.id+'\')">';
 h+='<div class="row" style="gap:var(--e2);min-width:0">';
 h+='<span class="pnome">'+a.name+(a.verified?' <span style="color:var(--accent)">✔</span>':'')+'</span>';
 h+=pagos.map(function(x){return selo(x,false)}).join("");
 h+='</div>';
 h+='<div class="ppe">'+(a.studio?a.studio+' · ':'')+a.city+'/'+a.state+(dist?' · '+dist:'')+'</div>';
 h+='<div class="pehover">';
 h+='<div class="ppe">'+a.styles.map(function(x){return SL[x]}).join(" · ")+'</div>';
 h+='<div class="ppe">'+cifroes(a)+' <span class="pph">por hora</span></div>';
 h+='</div>';
 h+='</button>';

 if(segue){
  h+='<div class="pseg">seguindo</div>';
 }
 h+='</article>';
 return h;
}

function alternarSeguir(id){
 var i=S.seguindo.indexOf(id);
 if(i>=0)S.seguindo.splice(i,1);else S.seguindo.push(id);
 if(S.route==="artist")render();else renderFeedOnly();
}
function alternarCurtida(id,idx){
 var c=id+":"+idx, i=S.curtidas.indexOf(c);
 if(i>=0)S.curtidas.splice(i,1);else S.curtidas.push(c);
 renderFeedOnly();
}

/* Carrega o próximo lote quando a sentinela entra na tela. */
/* Trocar de largura pode trocar o número de colunas — e só nesse
   caso o feed se re-desenha. Redesenhar a cada pixel de resize faria
   no desktop a dança que acabou de sair do celular. */
var colunasDesenhadas=null;
window.addEventListener("resize",function(){
 clearTimeout(window._rzFeed);
 window._rzFeed=setTimeout(function(){
  var c=quantasColunas();
  if(colunasDesenhadas!==null&&c!==colunasDesenhadas&&S.route==="home"){
   colunasDesenhadas=c;render();
  }
 },150);
});

function ligarScrollInfinito(){
 var s=document.getElementById("sentinela");
 if(!s)return;
 if(S.obs)S.obs.disconnect();
 S.obs=new IntersectionObserver(function(e){
  if(e[0].isIntersecting){S.feedLote++;renderFeedOnly()}
 },{rootMargin:"300px"});
 S.obs.observe(s);
}
function aCard(a){
 var i=S.caro[a.id]||0;
 var h='<div class="acard"><div class="caro">';
 if(a.empty){
  h+='<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--e1);background:var(--muted);color:var(--muted-foreground)">';
  h+='<span class="small b">Portfólio em construção</span><span class="tiny">O tatuador ainda não publicou fotos</span></div>';
 }else{
  a.port.slice(0,5).forEach(function(p,k){h+='<div class="sl '+(k===i?"on":"")+'" style="background-image:'+tex(p)+'"></div>'});
  if(a.insta)h+='<span class="tagtl">📷 Instagram</span>';
  h+='<button class="nav l" '+(i===0?'disabled style="opacity:.35"':'')+' onclick="caro(\''+a.id+'\',-1,5)">‹</button>';
  h+='<button class="nav r" '+(i===4?'disabled style="opacity:.35"':'')+' onclick="caro(\''+a.id+'\',1,5)">›</button>';
  h+='<div class="pips">';for(var k=0;k<5;k++)h+='<i class="'+(k===i?"on":"")+'"></i>';h+='</div>';
 }
 h+='</div><div class="pad">';
 h+='<div class="row" style="align-items:flex-start"><div class="av">'+ini(a.name)+'</div><div style="min-width:0;flex:1">';
 h+='<div class="b small">'+a.name+(a.verified?' <span style="color:var(--accent)">✔</span>':'')+'</div>';
 h+='<div class="tiny muted">'+a.studio+'</div>';
 h+='<div class="tiny muted">📍 '+a.city+'/'+a.state+'</div></div>';
 h+='<div style="text-align:right"><div class="small b">★ '+a.rating+'</div><div class="tiny muted">('+a.reviews+')</div>';
 h+='<div style="margin-top:var(--e1)">'+cifroes(a)+'</div></div></div>';
 h+='<div class="row" style="margin-top:var(--e2)"><div class="row wrapf" style="gap:var(--e1)">';
 h+=a.styles.map(function(s){return '<span class="badge">'+SL[s]+'</span>'}).join("");
 h+='<span class="badge acc">'+CPLX[a.cx]+'</span></div>';
 h+='<span class="sp tiny muted" style="white-space:nowrap">🗓 '+a.months+'m</span></div>';
 h+='<div class="row" style="margin-top:var(--e3);padding-top:4px">';
 h+='<button class="btn primary" style="padding:var(--e2) 18px" onclick="go(\'artist\',\''+a.id+'\')">Perfil</button>';
 h+='<div class="row sp" style="gap:var(--e1)">';
 h+='<button class="btn sm" title="Orçar" style="width:34px;padding:var(--e2) 0" onclick="quoteFor(\''+a.id+'\')">👛</button>';
 h+='</div></div></div></div>';
 return h;
}
/* Converte a linha do banco para o formato que os cards já entendem.
   Mantém a interface intacta e isola a diferença num único lugar. */
function doBanco(a){
 var p=a.profiles||{};
 var estilos=(a.artist_styles||[]).map(function(s){return s.style_slug});
 var port=(a.portfolio_items||[]).map(function(x,i){return x.image_url||(i*7+3)});
 var cx=estilos.reduce(function(m,s){
  var e=STYLES.filter(function(x){return x.s===s})[0];
  return e&&e.c>m?e.c:m},2);
 return {id:a.profile_id,name:p.display_name||"Tatuador(a)",studio:a.studio_name||"",
  city:p.city||"",state:p.state||"",styles:estilos.length?estilos:["minimalista"],cx:cx,
  bio:p.bio||"",years:a.years_experience||0,
  rating:+(a.rating_avg||0)||5,reviews:a.rating_count||0,
  min:a.min_hourly_cents||(9000+cx*3500),max:a.max_hourly_cents||(9000+cx*3500+8000+cx*3000),
  verified:false,insta:!!a.instagram_handle,seed:(a.id||"").charCodeAt(0)||1,
  months:1,empty:port.length===0,port:port.length?port:[1,2,3,4,5,6,7,8,9]};
}
async function carregarArtistasReais(){
 if(S.carregando)return; S.carregando=true;
 try{
  var linhas=await window.Dados.listarTatuadores();
  S.reaisArtistas=linhas.map(doBanco);
 }catch(e){
  S.reaisArtistas=[];
  S.conn={ok:false,etapa:"listar tatuadores",detalhe:e.message||String(e)};
 }
 S.carregando=false; render();
}
function caro(id,d,n){var c=S.caro[id]||0;S.caro[id]=Math.max(0,Math.min(n-1,c+d));render()}
function renderFeedOnly(){
 var el=document.getElementById("feedHost");
 if(!el)return;

/* --- agenda do tatuador --- */
/* A agenda do tatuador não é pública, e isso não é detalhe de tela: é
   quem manda na semana de trabalho de alguém.

   Mostrar horários livres para o cliente escolher transforma o
   tatuador em recurso a ser reservado. Aqui o cliente PEDE — pelo
   orçamento ou pela conversa — e o tatuador decide, marca, e a sessão
   aparece do lado do cliente já resolvida.

   A gaveta continua existindo porque o pedido de horário acontece nela;
   o que saiu foram os botões que levavam o cliente para lá a partir do
   card e do perfil, como se a agenda fosse dele para folhear. */
function verAgenda(id){S.agArtist=id;S.agDia=null;S.agHora=null;S.agFeito=false;openDrawer("agenda")}

function minhasSessoes(){
 return [

   cidade:"São Paulo",area:"Antebraço interno",estilo:"fineline",estado:"confirmada",horas:3},

   cidade:"Lisboa",area:"Ombro",estilo:"blackwork",estado:"aguardando confirmação",horas:4}
 ];

function diasDaAgenda(a){
 var hoje=new Date(2026,6,26),r=[];
 for(var k=1;k<=24&&r.length<8;k++){
  var d=new Date(hoje.getTime()+k*86400000);
  if(d.getDay()===0)continue;                              // domingo fechado
  var q=(a.seed*7+k*13)%5;                                 // 0 a 4 horarios livres
  if(!q)continue;
  r.push({rot:d.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short"}).replace(/\./g,""),
          horas:["10:00","11:30","14:00","15:30","17:00"].slice(0,q)});
 }
 return r;
}
function agendaBody(){
 var a=ARTISTS.filter(function(x){return x.id===S.agArtist})[0]||ARTISTS[0];
 var h='<div class="banner" style="margin-bottom:var(--e3)"><div class="av">'+ini(a.name)+'</div>'+
   '<div><div class="b small">Agenda de '+a.name+'</div><div class="tiny muted">'+a.studio+' · '+a.city+'</div></div></div>';

 // Agenda fechada nao e beco: e a conversa, que e como se marca hoje.
 if(!a.agenda){
  h+='<p class="small muted">Este tatuador prefere não exibir a agenda publicamente. Combine o horário direto com ele.</p>';
  h+='<button class="btn primary blk" style="margin-top:var(--e3)" onclick="'+(isLog()?"openDrawer('chat')":"closeDrawer();irCadastro(null)")+'">💬 Pedir um horário</button>';
  return h;
 }
 if(S.agFeito){
  h+='<div class="card pad"><div class="b small">✅ Horário solicitado</div>';
  h+='<p class="small muted" style="margin-top:var(--e2)">'+S.agDia+' às '+S.agHora+'. '+a.name.split(" ")[0]+' recebe a solicitação na área de gestão e confirma por lá.</p></div>';
  h+='<button class="btn blk" style="margin-top:var(--e3)" onclick="S.agFeito=false;S.agHora=null;renderDrawer()">Escolher outro horário</button>';
  return h;
 }
 var dias=diasDaAgenda(a);
 if(!dias.length)return h+'<p class="small muted">Sem horários livres nas próximas semanas.</p>';

 h+='<div class="tiny muted" style="font-weight:600;text-transform:uppercase;letter-spacing:.08em">Dia</div>';
 h+='<div class="row wrapf" style="gap:var(--e2);margin-top:var(--e2)">';
 dias.forEach(function(d){
  h+='<button class="chip '+(S.agDia===d.rot?"on":"")+'" onclick="S.agDia=\''+d.rot+'\';S.agHora=null;renderDrawer()">'+d.rot+'</button>'});
 h+='</div>';

 if(S.agDia){
  var dd=dias.filter(function(d){return d.rot===S.agDia})[0];
  h+='<div class="tiny muted" style="margin-top:var(--e4);font-weight:600;text-transform:uppercase;letter-spacing:.08em">Horário</div>';
  h+='<div class="row wrapf" style="gap:var(--e2);margin-top:var(--e2)">';
  dd.horas.forEach(function(x){
   h+='<button class="chip '+(S.agHora===x?"on":"")+'" onclick="S.agHora=\''+x+'\';renderDrawer()">'+x+'</button>'});
  h+='</div>';
 }
 h+='<button class="btn primary blk" style="margin-top:var(--e4)"'+(S.agHora?'':' disabled')+
    ' onclick="'+(isLog()?"S.agFeito=true;renderDrawer()":"closeDrawer();irCadastro(null)")+'">Solicitar este horário</button>';
 h+='<p class="tiny muted" style="margin-top:var(--e2)">A solicitação não bloqueia a agenda até o tatuador confirmar.</p>';

function listaLoja(){
 var l=PRODUCTS.filter(function(p){
  if(p.a!==S.shopAud)return false;
  if(S.shopCat!=="all"&&p.c!==S.shopCat)return false;
  if(S.shopQ.trim()&&(p.n+" "+p.b).toLowerCase().indexOf(S.shopQ.trim().toLowerCase())<0)return false;
  return true});
 if(S.shopSort==="price_asc")l.sort(function(a,b){return a.p-b.p});
 if(S.shopSort==="price_desc")l.sort(function(a,b){return b.p-a.p});
 if(S.shopSort==="rating")l.sort(function(a,b){return b.r-a.r});

 if(!l.length)return '<div class="card pad muted" style="margin-top:var(--e4)">Nenhum produto com esses filtros.</div>';

 /* Contagem à esquerda, modo de ver à direita. A contagem existe
    porque numa grade regular a pessoa perde a noção de quanto tem —
    no feed ela rola até cansar, aqui ela quer saber se vale olhar. */
 /* A contagem e as vistas subiram para a linha-meta da barra de
    busca (cfg.contagem e cfg.direita): eram uma linha inteira a mais
    fazendo trabalho de meia. A vitrinecab morreu junto. */
 var lista=S.shopVista==="lista";
 var h='';

 /* Doze por vez, e não três. Três era o lote de quando o card ocupava
    a largura toda; numa grade de quatro colunas três cards não fecham
    nem a primeira fileira. Doze fecha fileira em duas, três e quatro
    colunas — sobra no meio da linha parece catálogo acabando. */
 var ate=Math.min(l.length,S.feedLote*12);
 h+='<div class="vitrine'+(lista?" emlista":"")+'">';
 l.slice(0,ate).forEach(function(p){
  var i=S.caro["sh"+p.id]||0;
  /* Mesmo componente do feed: `post` traz a foto com carrossel, as
     setas, os pips e o hover; `prod` acrescenta só o que a grade
     regular exige. Duas classes em vez de dois componentes. */
  h+='<article class="post prod">';
  h+='<div class="postimg">';
  /* Três fotos por produto, como o portfólio tem várias do mesmo
     trabalho: quem compra quer ver a embalagem, o conteúdo e a
     escala. */
  for(var k=0;k<3;k++)
   h+='<div class="sl '+(k===i?"on":"")+'" style="background-image:'+tex(p.n.length+k*2)+'"><span class="emj">'+[p.e,"📸","🔎"][k]+'</span></div>';
  if(p.bg)h+='<span class="tagtl">'+p.bg+'</span>';
  if(i>0)h+='<button class="nav l" aria-label="Foto anterior" onclick="caro(\'sh'+p.id+'\',-1,3)">‹</button>';
  if(i<2)h+='<button class="nav r" aria-label="Próxima foto" onclick="caro(\'sh'+p.id+'\',1,3)">›</button>';
  h+='<div class="pips"><i class="'+(i===0?"on":"")+'"></i><i class="'+(i===1?"on":"")+'"></i><i class="'+(i===2?"on":"")+'"></i></div>';
  h+='</div>';
  h+='<div class="prodinfo"><div class="prodtxt">';
  h+='<div class="prodnome">'+p.n+'</div>';
  h+='<div class="proddesc">'+p.d+'</div>';
  h+='<div class="ppe">'+p.b+'</div>';
  h+='<div class="prodnota">'+stars(p.r)+' '+p.r+' <span class="muted">('+p.rv+')</span></div>';
  h+='</div>';
  h+='<div class="prodpe"><div class="prodpreco">'+money(p.p)+(p.o?'<s>'+money(p.o)+'</s>':'')+'</div>';
  h+='<button class="btn sm" onclick="addCart(\''+p.id+'\')">Adicionar</button></div>';
  h+='</div></article>';
 });
 h+='</div>';
 h+= ate<l.length
  ? '<div id="sentinela" class="row" style="justify-content:center;padding:var(--e5) 0"><span class="tiny muted">carregando mais…</span></div>'
  : '<div class="row" style="justify-content:center;padding:var(--e5) 0"><span class="tiny muted">Você viu tudo dessa categoria.</span></div>';
 return h;
}

/* Altura única para todo mapa da plataforma. Quando eventos tinha 170
   e cursos 210, trocar de aba mexia o chão sob a lista — e a pessoa
   perdia a referência de onde estava olhando. */
var ALT_MAPA=190;
/* O mesmo mapa serve eventos, cursos e pedidos de orçamento. O que
   muda entre eles é só quem está selecionado e o que o pino faz — por
   isso os dois entram como parâmetro em vez de virarem três mapas. */
function mapinha(pontos,alt,sel,acao){
 sel = sel!==undefined ? sel : S.evSel;
 acao = acao || "S.evSel='$id';render()";
 var h='<div class="mapa" style="height:'+(alt||ALT_MAPA)+'px">';
 pontos.slice(0,8).forEach(function(e,k){
  h+='<div class="pin '+(sel===e.id?"on":"")+'" style="left:'+e.x+'%;top:'+e.y+'%" onclick="'+acao.replace("$id",e.id)+'"><b>'+(k+1)+'</b></div>';
 });
 h+='<div class="pin voce" style="left:50%;top:50%"><b>◉</b></div>';
 h+='<div class="mapaselo">'+(S.localReal?"sua posição":"mapa simulado")+'</div>';
 h+='</div>';
 return h;
}

  h+='<div class="tiny muted">'+x.who+' · '+x.dur+'</div>';

  h+='<span class="tiny '+(x.spots<6?"":"muted")+'" style="'+(x.spots<6?"color:var(--x-warning)":"")+'">'+x.spots+' vagas</span></div>';
  h+='</button>';
 });
 h+='</div>';
 h+= ate<c.length
  ? '<div id="sentinela" class="row" style="justify-content:center;padding:var(--e5) 0"><span class="tiny muted">carregando mais…</span></div>'
  : '<div class="row" style="justify-content:center;padding:var(--e5) 0"><span class="tiny muted">Você viu os '+c.length+' cursos.</span></div>';
 return h;
}

/* ============ PERFIL PÚBLICO ============ */
function vArtist(){
 var a=ARTISTS.filter(function(x){return x.id===S.artist})[0]||ARTISTS[0];
 var temInsta=!!a.insta;
 var eventosDele=EVENTS.slice(0,2);
 // Cursos que este artista ministra. Deterministico pelo seed, para o
 // mesmo perfil mostrar sempre os mesmos.
 var cursosDele=COURSES.filter(function(x,i){return (a.seed+i)%3===0}).slice(0,2);
 // Coluna única, dimensionada pelo celular. Duas colunas empurravam as
 // ações para a lateral, que no telefone cai depois de todo o portfólio.
 var obras=obrasDoArtista(a);
 var abas=[["portfolio","Portfólio"]];
 if(obras.length)abas.push(["galeria","Galeria"]);
 if(temInsta)abas.push(["instagram","Instagram"]);
 if(cursosDele.length)abas.push(["cursos","Cursos"]);
 if(eventosDele.length)abas.push(["eventos","Eventos"]);
 /* Avaliações e selos eram duas abas, e respondiam à mesma pergunta:
    por que confiar nesta pessoa. Quem chegava numa não tinha motivo
    para procurar a outra — e as duas metades da resposta ficavam
    separadas justamente no momento em que a pessoa está decidindo.

    Agora é uma aba com as duas leituras em ordem: o que dizem quem já
    passou por ele, e o que a plataforma conseguiu verificar. */
 abas.push(["reputacao","Reputação"]);
 var aba = abas.map(function(x){return x[0]}).indexOf(S.abaPerfil)>=0 ? S.abaPerfil : "portfolio";

 var h='<main><div class="wrap"><div class="perfilcol">';
 h+='<button class="btn sm" onclick="go(\'home\')">← Voltar</button>';

 /* ── CABEÇALHO DO PERFIL ─────────────────────────────────────────
    Reescrito por causa do defeito mais caro que ele tinha: os quatro
    botões de ação eram só ícone. Um ✨ preto, um calendário, um balão
    e um tique — quatro caixas grandes sem uma palavra.

    Ícone sozinho só funciona com vocabulário universal: fechar, buscar,
    voltar. "Pedir orçamento" não tem ícone universal, e era justamente
    a ação que sustenta o negócio.

    A ordem agora segue a decisão: quem é → o que dizem → quanto custa
    → o que fazer. E o preço encostou na ação de orçar, porque é ali
    que ele pesa. */
 h+='<div class="perfilcab">';

 /* 1. QUEM É */
 h+='<div class="row" style="gap:var(--e3);align-items:flex-start">';
 h+='<div class="av" style="width:56px;height:56px;font-size:17px;flex-shrink:0">'+ini(a.name)+'</div>';
 h+='<div style="min-width:0;flex:1">';
 h+='<h1 class="perfilnome">'+a.name+(a.verified?' <span class="vfd" title="identidade verificada">✔</span>':'')+'</h1>';
 h+='<div class="perfilloc">'+a.studio+' · '+a.city+'/'+a.state+'</div>';
 /* Estilos junto do nome: é o que a pessoa procura, e antes ficavam
    depois dos selos, longe de quem eles descrevem. */
 h+='<div class="row wrapf" style="gap:var(--e1);margin-top:var(--e2)">'+
    a.styles.map(function(s){return '<span class="badge">'+SL[s]+'</span>'}).join("")+'</div>';
 h+='</div></div>';

 /* 2. O QUE DIZEM — três medidas numa linha, sem competir com o nome */
 /* O preço voltou para esta linha. Ele morava dentro do botão de
    orçar, e o botão deixou de ser barra. Preço não pode sumir do
    cabeçalho: é a segunda coisa que a pessoa procura, depois de
    "esta mão me serve?". */
 h+='<div class="perfilnum">'+stars(a.rating)+' '+a.rating+' <span class="muted">('+a.reviews+' avaliações)</span> · '+a.years+' anos de ofício · '+cifroes(a)+' por hora</div>';
 h+='<div class="tiny muted" style="margin-top:var(--e1)">O valor final sai do orçamento — os cifrões são a faixa que ele costuma praticar.</div>';

 /* 3. OS SELOS, contidos.
    Eram seis pastilhas em duas linhas, com mais peso visual que o
    nome. Aqui aparecem três e o resto entra num contador que leva à
    aba de reputação, onde cada um vem com a regra que o produziu. */
 var selosT=selosDe(a);
 if(selosT.length){
  h+='<div class="selos" style="margin-top:var(--e3)">';
  h+=selosT.slice(0,3).map(function(x){return selo(x,true)}).join("");
  if(selosT.length>3)
   h+='<button class="maisselos" onclick="S.abaPerfil=\'reputacao\';render()">+'+(selosT.length-3)+' e como se ganham ›</button>';
  h+='</div>';
 }

 /* 4. O QUE FAZER — três acessos, mesmo peso.
    Orçar era uma barra preta com o preço dentro. A pedido dela virou
    um acesso como conversar: mesma forma, mesma altura, mesma linha.

    A hierarquia que importa não estava ali. Está no que cada um abre:
    conversar abre uma conversa em branco, seguir é um clique, e orçar
    abre um formulário de campos fixos — o mesmo para todo mundo. */
 var seg=S.seguindo.indexOf(a.id)>=0;
 h+='<div class="perfilacoes"><div class="acoessec">';
 h+='<button class="btn'+(contaPendente()?" pendente":"")+'" onclick="'+
    (contaPendente()?"explicarTrava(\'pedir orçamento\')":"quoteFor(\'"+a.id+"\')")+'">✨ Pedir orçamento</button>';
 h+='<button class="btn" onclick="'+(contaPendente()?"explicarTrava(\'conversar\')":(isLog()?"openDrawer(\'chat\')":"irCadastro(null)"))+'">💬 Conversar</button>';
 h+='<button class="btn'+(seg?" primary":"")+'" onclick="alternarSeguir(\''+a.id+'\')">'+(seg?"✓ Seguindo":"👤 Seguir")+'</button>';
 h+='</div></div>';

 /* 5. SOBRE — duas linhas, sempre visíveis.
    Era um <details> fechado com o triângulo nativo do navegador. Texto
    de duas linhas escondido atrás de um clique é texto que ninguém lê,
    e o triângulo era o único componente do produto desenhado pelo
    sistema operacional. */
 h+='<p class="perfilbio">'+a.bio+'</p>';

 /* 6. O LUGAR, separado da pessoa.
    Os selos do estúdio ficam num bloco próprio — nunca misturados aos
    de quem tatua. Um profissional excelente não herda a nota de um
    estúdio ruim, e um estúdio impecável não empresta reputação a quem
    trabalha mal dentro dele. */
 var est=estudioDe(a.studio);
 if(est){
  var selosE=selosDoEstudio(est);
  h+='<button class="cxestudio" onclick="S.estudioSel=\''+est.id+'\';go(\'estudio\')">';
  h+='<div class="row" style="gap:var(--e2)"><span class="tiny muted">Atende em</span>';

  h+='<span class="sp tiny muted">ver o estúdio ›</span></div>';
  if(selosE.length)h+='<div class="selos" style="margin-top:var(--e2)">'+selosE.map(function(x){return selo(x,true)}).join("")+'</div>';
  h+='<div class="tiny muted" style="margin-top:var(--e1)">Estes selos são do lugar, não de '+a.name.split(" ")[0]+'.</div>';
  h+='</button>';
 }
 h+='</div>';

 /* ── TOGGLE: portfólio, instagram, eventos ─────────────────────── */
 if(abas.length>1){
  h+='<div class="segmento" style="margin-top:var(--e4)">';
  abas.forEach(function(t){
   h+='<button class="seg '+(aba===t[0]?"on":"")+'" onclick="S.abaPerfil=\''+t[0]+'\';render()">'+t[1]+'</button>'});
  h+='</div>';
 }

 if(aba==="portfolio"){
  h+='<div class="grid gradeport" style="margin-top:var(--e4)">';
  /* A proporção vem do próprio trabalho, pela mesma função do feed:
     o mesmo trabalho aparece com a mesma forma nos dois lugares. */
  a.port.forEach(function(p){h+='<div class="tat" style="aspect-ratio:'+proporcaoDaFoto(p)+';border-radius:var(--r-foto);background-image:'+tex(p)+'"></div>'});
  h+='</div>';
  h+='<div class="tiny muted" style="margin-top:var(--e2)">'+a.port.length+' trabalhos publicados aqui'+tg("real")+'</div>';
 }
 if(aba==="galeria"){

   h+='<button class="obra">';
   h+='<div class="obrafoto" style="background-image:'+tex(o.seed)+'">'+(o.unico?'<span class="obraetiq">único</span>':'')+'</div>';
   h+='<div class="obrainfo"><div class="b small">'+o.nome+'</div>';
   h+='<div class="tiny muted">'+o.tipoL+' · '+(o.unico?"peça única":o.restam+" disponíveis")+'</div>';
   h+='<div class="b small" style="margin-top:var(--e1)">'+brl(o.preco)+'</div></div>';
   h+='</button>';
  });
  h+='</div>';
  h+='<div class="tiny muted" style="margin-top:var(--e2)">'+obras.length+' obra(s) à venda'+tg("mock")+'</div>';
 }
 if(aba==="instagram"){

  if(ii>0)h+='<button class="nav l" onclick="caro(\'ig'+a.id+'\',-1,6)">‹</button>';
  if(ii<5)h+='<button class="nav r" onclick="caro(\'ig'+a.id+'\',1,6)">›</button>';
  h+='<div class="pips">';for(var k=0;k<6;k++)h+='<i class="'+(k===ii?"on":"")+'"></i>';h+='</div></div>';
  h+='<div class="tiny muted" style="margin-top:var(--e2)">Post '+(ii+1)+' de 6 · @'+a.name.toLowerCase().replace(/\s+/g,".")+tg("real")+'</div>';
 }
 if(aba==="cursos"){
  h+='<div class="lista" style="margin-top:var(--e4)">';
  cursosDele.forEach(function(x){
   h+='<button class="lrow clicavel compacto"><div class="itemfoto">'+x.e+'</div>';
   h+='<div class="itemtxt"><div class="b small">'+x.n+'</div>';
   h+='<div class="tiny muted">'+x.dur+' · início '+x.st+'</div>';
   h+='<div class="row wrapf" style="gap:var(--e1);margin-top:var(--e1)"><span class="badge">'+x.t+'</span><span class="badge">'+x.lv+'</span></div></div>';
   h+='<div class="itemfim"><div class="b small">'+(x.cost?money(x.cost):"Grátis")+'</div>';
   h+='<span class="tiny '+(x.spots<6?"":"muted")+'" style="'+(x.spots<6?"color:var(--x-warning)":"")+'">'+x.spots+' vagas</span></div></button>'});
  h+='</div>';

 }
 if(aba==="eventos"){

  eventosDele.forEach(function(e){

 if(aba==="reputacao"&&a.reviews>0){

  h+='<div class="card pad" style="margin-top:var(--e4)"><div class="row"><span class="b small">O que dizem</span>'+tg("mock")+'</div>';

  h+='<div><div class="tiny">'+stars(a.rating)+'</div><div class="tiny muted">'+a.reviews+' avaliações</div></div></div>';
  h+='<div class="sep"></div>';
  REVS.slice(0,3).forEach(function(r,i,arr){
   h+='<div style="padding:var(--e2) 0'+(i<arr.length-1?';border-bottom:1px solid var(--border)':'')+'"><div class="row"><span class="b small">'+r.c+'</span><span class="tiny sp">'+stars(r.r)+'</span></div>';

 }

 /* ── REPUTAÇÃO: os selos com a regra de cada um à vista ───────────

 if(aba==="reputacao"){

  h+='<div class="card pad" style="margin-top:var(--e4)"><div class="row"><span class="b small">Como esta reputação se formou</span>'+tg("novo")+'</div>';

   h+='<div class="regracat" style="margin-top:var(--e4)">'+titulos[c][0]+'</div>';

    h+='<div class="tiny muted" style="margin-top:var(--e1);opacity:.8">'+d.porq+'</div>';
    h+='</div></div>';
   });
   h+='</div>';
  });

  /* Dizer o que falta é diferente aqui do que era no passaporte do
     cliente: ali seria cobrar tatuagem de alguém, aqui é dizer a um
     profissional o que o mercado espera dele. */
  var faltando=SELOS.filter(function(d){return !meus.filter(function(x){return x.id===d.id}).length});
  if(faltando.length){
   h+='<div class="sep"></div><div class="regracat">Ainda não tem</div>';

   faltando.forEach(function(d){

    h+='<div class="b small">'+d.nome+'</div>';

    if(d.id==="recomendado")h+='<div class="tiny" style="margin-top:var(--e1);color:var(--x-warning)">'+porqueNaoRecomendado(a)+'</div>';
    h+='</div></div>';
   });
   h+='</div>';
  }
  h+='</div>';

  h+='<div class="card pad" style="margin-top:var(--e4)"><div class="row"><span class="b small">O que o checkout apurou</span>'+tg("novo")+'</div>';
  h+='<div class="tiny muted" style="margin-top:var(--e1)">'+a.avaliacoesCheckout+' sessões avaliadas no fim, pelo cliente, com a sessão ainda fresca.</div>';
  [["Estúdio limpo e organizado",a.higiene,90],
   ["Saiu orientado sobre os cuidados",a.orientaPos,90],
   ["A dor foi como o tatuador preparou",a.calibrouDor,85]].forEach(function(x){
   var passou=x[1]>=x[2];
   h+='<div style="margin-top:var(--e3)"><div class="row"><span class="small">'+x[0]+'</span>';
   h+='<span class="sp b small" style="color:var(--'+(passou?"x-success":"x-warning")+')">'+x[1]+'%</span></div>';
   h+='<div class="bar" style="margin-top:var(--e1)"><i style="width:'+x[1]+'%'+(passou?'':';background:var(--x-warning)')+'"></i></div>';
   h+='<div class="tiny muted" style="margin-top:var(--e1)">mínimo para o selo: '+x[2]+'%</div></div>';
  });
  h+='<div class="tiny muted" style="margin-top:var(--e3)">Higiene e orientação são porta, não média: um perfil muito bem avaliado onde parte das pessoas sai sem saber cuidar da ferida continua sendo risco, e nenhuma estrela compensa isso.</div>';
  h+='</div>';
 }

 return h+'</div></div></main>';
}

/* O contador do trilho: mesma linguagem do portfólio dela, 01 / 04.
   Atualiza no scroll — o card "atual" é o que está encostado na
