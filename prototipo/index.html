<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ink Creators — protótipo</title>
<link rel="icon" type="image/png" href="marca/favicon.png" />
<link rel="apple-touch-icon" href="marca/logo-preto.png" />
<style>
:root{
  /* ── Tokens oficiais shadcn/ui — mesmos valores de src/styles.css do projeto ── */
  --radius:0.75rem;
  --background:oklch(1 0 0);
  --foreground:oklch(0.16 0 0);
  --card:oklch(1 0 0);
  --card-foreground:oklch(0.16 0 0);
  --popover:oklch(1 0 0);
  --popover-foreground:oklch(0.16 0 0);
  --primary:oklch(0.16 0 0);
  --primary-foreground:oklch(0.99 0 0);
  --secondary:oklch(0.96 0 0);
  --secondary-foreground:oklch(0.22 0 0);
  --muted:oklch(0.96 0 0);
  --muted-foreground:oklch(0.5 0 0);
  --accent:oklch(0.42 0.06 215);
  --accent-foreground:oklch(0.99 0 0);
  --destructive:oklch(0.55 0.18 25);
  --destructive-foreground:oklch(0.99 0 0);
  --border:oklch(0.92 0 0);
  --input:oklch(0.92 0 0);
  --ring:oklch(0.42 0.06 215);
  --chart-1:oklch(0.16 0 0);--chart-2:oklch(0.42 0.06 215);--chart-3:oklch(0.55 0 0);
  --chart-4:oklch(0.75 0 0);--chart-5:oklch(0.88 0 0);
  /* ── Extensões do protótipo (prefixo -x-): estados que o shadcn não cobre ── */
  --x-accent-bg:oklch(0.965 0.012 215);
  --x-accent-border:oklch(0.89 0.025 215);
  --x-success:oklch(0.45 0.12 150);--x-success-bg:oklch(0.96 0.03 150);
  --x-warning:oklch(0.48 0.10 75);--x-warning-bg:oklch(0.96 0.04 85);
  --x-danger:oklch(0.50 0.16 25);--x-danger-bg:oklch(0.96 0.03 25);
  --x-tag-violet:oklch(0.45 0.14 300);--x-tag-violet-bg:oklch(0.96 0.03 300);
  --x-tag-blue:oklch(0.45 0.13 250);--x-tag-blue-bg:oklch(0.96 0.03 250);
  --x-tag-teal:oklch(0.45 0.09 190);--x-tag-teal-bg:oklch(0.95 0.03 190);
}
html[data-dark]{
  /* ── Tema escuro CORRIGIDO: mesma identidade monocromática + petróleo do claro.
       O projeto hoje tem roxo aqui (resto do template padrão) — ver dark-theme-corrigido.css ── */
  --background:oklch(0.14 0 0);
  --foreground:oklch(0.97 0 0);
  --card:oklch(0.18 0 0);
  --card-foreground:oklch(0.97 0 0);
  --popover:oklch(0.18 0 0);
  --popover-foreground:oklch(0.97 0 0);
  --primary:oklch(0.97 0 0);
  --primary-foreground:oklch(0.14 0 0);
  --secondary:oklch(0.24 0 0);
  --secondary-foreground:oklch(0.95 0 0);
  --muted:oklch(0.24 0 0);
  --muted-foreground:oklch(0.68 0 0);
  --accent:oklch(0.72 0.07 215);
  --accent-foreground:oklch(0.14 0 0);
  --destructive:oklch(0.62 0.19 25);
  --destructive-foreground:oklch(0.99 0 0);
  --border:oklch(0.27 0 0);
  --input:oklch(0.27 0 0);
  --ring:oklch(0.72 0.07 215);
  --chart-1:oklch(0.97 0 0);--chart-2:oklch(0.72 0.07 215);--chart-3:oklch(0.68 0 0);
  --chart-4:oklch(0.48 0 0);--chart-5:oklch(0.34 0 0);
  --x-accent-bg:oklch(0.26 0.030 215);
  --x-accent-border:oklch(0.35 0.045 215);
  --x-success:oklch(0.78 0.14 150);--x-success-bg:oklch(0.25 0.05 150);
  --x-warning:oklch(0.82 0.12 85);--x-warning-bg:oklch(0.27 0.05 85);
  --x-danger:oklch(0.75 0.15 25);--x-danger-bg:oklch(0.27 0.06 25);
  --x-tag-violet:oklch(0.78 0.12 300);--x-tag-violet-bg:oklch(0.26 0.05 300);
  --x-tag-blue:oklch(0.78 0.11 250);--x-tag-blue-bg:oklch(0.25 0.05 250);
  --x-tag-teal:oklch(0.78 0.09 190);--x-tag-teal-bg:oklch(0.24 0.04 190);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--background);color:var(--foreground);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit;background:var(--card)}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.hide{display:none!important}
.ico{width:1em;height:1em;display:inline-block;vertical-align:-.14em;flex-shrink:0}
.iconbtn .ico{width:19px;height:19px;vertical-align:0}
.stars{display:inline-flex;gap:1px;vertical-align:-.14em}
.stars .ico{width:.92em;height:.92em;vertical-align:0}
.pcard .im .ico{width:40px;height:40px;stroke-width:1.2;color:var(--muted-foreground)}
.thumb .ico,.datebox .ico{width:19px;height:19px}
.stat .lbl .ico{width:13px;height:13px;vertical-align:-.16em}

header.top{position:sticky;top:0;z-index:40;background:var(--background);border-bottom:1px solid var(--border)}
.top-in{display:flex;align-items:center;gap:14px;height:60px}
.logo{display:flex;align-items:center;gap:9px;cursor:pointer}
/* A marca é op-art de alto contraste: no tema escuro precisa inverter,
   senão o preto do padrão desaparece no fundo. Duas imagens, uma por tema. */
.logo .marca{width:34px;height:34px;flex-shrink:0;object-fit:contain;display:block}
html[data-dark] .logo .marca{content:url("marca/logo-branco.png")}
.logo .txt{display:flex;flex-direction:column;line-height:1;font-size:11.5px;font-weight:900;text-transform:uppercase;letter-spacing:-.01em}
.search{flex:1;max-width:400px;position:relative}
.search input{width:100%;height:35px;border:1px solid var(--border);border-radius:999px;padding:0 14px 0 32px;outline:none}
.search .ic{position:absolute;left:11px;top:9px;color:var(--muted-foreground);line-height:0}
.search .ic .ico{width:16px;height:16px}
.protobar .ico{width:13px;height:13px;vertical-align:-.15em}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:5px}
.iconbtn{width:35px;height:35px;border-radius:9px;display:flex;align-items:center;justify-content:center;position:relative}
.iconbtn:hover{background:var(--muted)}
/* Convite: pill com rótulo, em cor de acento. Tem texto porque é espaço
   de conversão — ícone sozinho não anuncia o que oferece. */
.pill.convite{color:var(--accent);border-color:var(--accent-bd)}
.pill.convite:hover{background:var(--x-accent-bg);border-color:var(--accent)}
.pill.convite.ativo{background:var(--accent);color:var(--accent-foreground);border-color:var(--accent)}
.pill.convite .ico{width:15px;height:15px}
/* Só o rótulo some no celular; o botão continua lá, em cor de acento. */
@media(max-width:560px){.pill.convite .rot{display:none}.pill.convite{padding:6px 10px}}
.dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
/* O número era centrado por line-height, que não considera a borda de
   2px nem a altura real do dígito — ficava fora do eixo. Flexbox centra
   nos dois eixos independente de fonte, borda ou tamanho do número. */
.count{position:absolute;top:2px;right:1px;
  display:flex;align-items:center;justify-content:center;
  box-sizing:border-box;min-width:17px;height:17px;padding:0 4px;
  border-radius:999px;border:2px solid var(--background);
  background:var(--primary);color:var(--primary-foreground);
  font-size:9.5px;font-weight:700;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:0}
.pill.accent-solid{background:var(--accent);color:var(--accent-foreground);border-color:var(--accent)}
.menu{position:absolute;right:0;top:40px;min-width:210px;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:5px;z-index:60}
.menu a{display:block;padding:8px 10px;border-radius:7px;font-size:13px;cursor:pointer}
.menu a:hover{background:var(--muted)}
.menu .mlabel{padding:7px 10px;font-size:11.5px;color:var(--muted-foreground);overflow:hidden;text-overflow:ellipsis}
.menu .msep{height:1px;background:var(--border);margin:4px 0}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--card)}
.pill:hover{border-color:var(--muted-foreground)}
.pill.solid{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.pill.accent{background:var(--x-accent-bg);color:var(--accent);border-color:var(--x-accent-border)}
.marcagrande{width:64px;height:64px;object-fit:contain;display:block}
html[data-dark] .marcagrande{content:url("marca/logo-branco.png")}
.avatarbtn{width:33px;height:33px;border-radius:50%;background:var(--muted);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;border:1px solid var(--border)}

main{padding:24px 0 60px}
h1.page{font-size:25px;font-weight:600;letter-spacing:-.02em}
p.sub{color:var(--muted-foreground);margin-top:4px;font-size:13.5px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}
.pad{padding:15px 17px}
.grid{display:grid;gap:14px}
.cols2{grid-template-columns:2fr 1fr}
.cols16{grid-template-columns:1.6fr 1fr}
.muted{color:var(--muted-foreground)}
.small{font-size:12.5px}.tiny{font-size:11.5px}.b{font-weight:600}
.row{display:flex;align-items:center;gap:9px}
.sp{margin-left:auto}
.wrapf{flex-wrap:wrap}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;background:var(--muted);color:var(--muted-foreground)}
.badge.ok{background:var(--x-success-bg);color:var(--x-success)}
.badge.warn{background:var(--x-warning-bg);color:var(--x-warning)}
.badge.bad{background:var(--x-danger-bg);color:var(--x-danger)}
.badge.acc{background:var(--x-accent-bg);color:var(--accent)}
.badge.vio{background:var(--x-tag-violet-bg);color:var(--x-tag-violet)}
.badge.blu{background:var(--x-tag-blue-bg);color:var(--x-tag-blue)}
.badge.tea{background:var(--x-tag-teal-bg);color:var(--x-tag-teal)}
.sep{height:1px;background:var(--border);margin:13px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--card);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600}
.btn:hover{border-color:var(--muted-foreground)}
.btn.primary{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn.blk{width:100%}
.fld{width:100%;text-align:left;font-weight:400;border:1px solid var(--border);border-radius:10px;padding:9px 12px;outline:none}
.fld:focus{border-color:var(--muted-foreground)}
label.lb{font-size:11.5px;color:var(--muted-foreground);display:block;margin-bottom:4px}

/* Abas: faixa com sublinhado, rolável. Ações ficam fora para não rolarem junto. */
.linhaabas{display:flex;align-items:flex-end;gap:14px;margin-top:16px;border-bottom:1px solid var(--border);flex-wrap:nowrap}
.abas{display:flex;gap:2px;flex:1 1 0;min-width:0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.abas::-webkit-scrollbar{display:none}
.aba{display:inline-flex;align-items:center;gap:7px;padding:11px 14px;border-bottom:2px solid transparent;font-size:13.5px;font-weight:600;color:var(--muted-foreground);white-space:nowrap;flex-shrink:0;background:none}
.aba:hover{color:var(--foreground)}
.aba.on{color:var(--foreground);border-bottom-color:var(--foreground)}
.aba .ico{width:17px;height:17px}
.abas-acoes{display:flex;gap:7px;flex:0 0 auto;padding-bottom:7px}
.btn.sm.destaque{background:var(--accent);color:var(--accent-foreground);border-color:var(--accent)}
/* Controle segmentado — recorte dentro da aba.
   Peças unidas num trilho translúcido; a ativa sobe como uma lente.
   O desfoque de fundo faz o conteúdo que rola por baixo aparecer
   levemente, dando profundidade sem competir com o conteúdo. */
.segmento{display:flex;margin-top:16px;padding:3px;border-radius:999px;position:relative;
  background:color-mix(in oklab, var(--muted) 75%, transparent);
  backdrop-filter:blur(18px) saturate(170%);
  -webkit-backdrop-filter:blur(18px) saturate(170%);
  border:1px solid color-mix(in oklab, var(--foreground) 7%, transparent);
  box-shadow:inset 0 1px 0 color-mix(in oklab, #fff 55%, transparent), 0 1px 2px rgba(0,0,0,.05);
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.segmento::-webkit-scrollbar{display:none}
.seg{flex:1 1 0;min-width:0;white-space:nowrap;padding:7px 11px;border-radius:999px;
  font-size:12.5px;font-weight:600;color:var(--muted-foreground);background:none;
  transition:color .18s ease, background .18s ease}
.seg:hover{color:var(--foreground)}
.seg.on{color:var(--foreground);
  background:color-mix(in oklab, var(--card) 92%, transparent);
  box-shadow:0 1px 3px rgba(0,0,0,.11), 0 0 0 .5px color-mix(in oklab, var(--foreground) 6%, transparent),
    inset 0 1px 0 color-mix(in oklab, #fff 70%, transparent)}
html[data-dark] .segmento{
  background:color-mix(in oklab, var(--muted) 60%, transparent);
  box-shadow:inset 0 1px 0 color-mix(in oklab, #fff 8%, transparent), 0 1px 2px rgba(0,0,0,.3)}
html[data-dark] .seg.on{
  background:color-mix(in oklab, var(--card) 96%, transparent);
  box-shadow:0 1px 4px rgba(0,0,0,.45), inset 0 1px 0 color-mix(in oklab, #fff 10%, transparent)}

/* Barra de localização + mapa pequeno + lista compacta.
   Padrão de app de mobilidade: contexto no topo, decisão na lista. */
.avisoerro{margin-top:12px;padding:9px 12px;border-radius:9px;background:var(--x-warning-bg);color:var(--x-warning);font-size:12.5px}
.btnlocal{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted-foreground);background:none}
.btnlocal:hover{background:var(--muted);color:var(--foreground)}
.btnlocal.on{color:var(--accent)}
.btnlocal .ico{width:17px;height:17px}
.barrabusca .campo input{padding-right:42px}

.mapa{position:relative;margin-top:13px;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:var(--muted);
  background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:30px 30px}
.mapa .pin{position:absolute;transform:translate(-50%,-100%);cursor:pointer}
.mapa .pin b{display:block;width:22px;height:22px;border-radius:50%;background:var(--primary);color:var(--primary-foreground);font-size:11px;line-height:22px;text-align:center;border:2px solid var(--card)}
.mapa .pin.on b{background:var(--accent);transform:scale(1.2)}
.mapa .pin.voce b{background:var(--accent);width:15px;height:15px;line-height:15px;font-size:9px}
.mapaselo{position:absolute;bottom:7px;left:8px;font-size:10.5px;color:var(--muted-foreground);background:var(--card);border-radius:5px;padding:2px 7px;opacity:.9}

.lista{margin-top:12px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--card)}
.item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:12px 13px;border-bottom:1px solid var(--border);background:none}
.item:last-child{border-bottom:none}
.item:hover{background:var(--muted)}
.item.on{background:var(--x-accent-bg)}
.item.compacto{padding:10px 13px}
.itemtxt{min-width:0;flex:1}
.itemfim{text-align:right;flex-shrink:0;display:flex;flex-direction:column;gap:2px}
.itemfoto{width:46px;height:46px;border-radius:9px;background:var(--muted);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.itemfoto .ico{width:24px;height:24px;color:var(--muted-foreground)}
.chip{border:1px solid var(--border);background:var(--card);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.chip.acc.on{background:var(--accent);border-color:var(--accent);color:var(--accent-foreground)}
.fbar{margin-top:16px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card)}
.fgroup{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:9px}
.fgroup .gl{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-foreground);min-width:78px}

/* Barra: busca, filtros e ordenar lado a lado */
.barrabusca{display:flex;gap:8px;margin-top:16px}
.barrabusca .campo{flex:1;position:relative;min-width:0}
.barrabusca .campo input{width:100%;height:40px;border:1px solid var(--border);border-radius:10px;padding:0 12px 0 34px;background:var(--card);outline:none}
.barrabusca .campo input:focus{border-color:var(--muted-foreground)}
.barrabusca .lupa{position:absolute;left:11px;top:11px;color:var(--muted-foreground);line-height:0}
.barrabusca .lupa .ico{width:16px;height:16px}
.btnbarra{position:relative;height:40px;padding:0 14px;border:1px solid var(--border);border-radius:10px;background:var(--card);display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;white-space:nowrap}
.btnbarra:hover{border-color:var(--muted-foreground)}
.btnbarra.on{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.btnbarra.temfiltro{border-color:var(--accent)}
.btnbarra .ico{width:17px;height:17px}
.btnbarra .pontinho{background:var(--accent);color:var(--accent-foreground);border-radius:999px;min-width:16px;height:16px;font-size:10px;line-height:16px;padding:0 4px}
.painel{margin-top:9px;padding:13px 15px;border:1px solid var(--border);border-radius:12px;background:var(--card)}

/* Feed em publicações, uma por vez */
.feedposts{max-width:440px;margin:14px auto 0}
.post{border:1px solid var(--border);border-radius:12px;background:var(--card);overflow:hidden;margin-bottom:14px}
.postinfo{padding:10px 12px 11px}
.btnseguir{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border:1px solid var(--border);border-radius:7px;background:var(--card);font-size:12px;font-weight:600;flex-shrink:0;white-space:nowrap}
.btnicone{width:32px;height:32px;border:1px solid var(--border);border-radius:8px;background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.btnicone:hover{border-color:var(--muted-foreground)}
.btnicone .ico{width:17px;height:17px}
.btnseguir:hover{border-color:var(--muted-foreground)}
.btnseguir.on{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.btnseguir .ico{width:13px;height:13px}
.postimg{position:relative;aspect-ratio:4/3;background:var(--muted)}
.postimg .sl{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .25s}
.postimg .sl.on{opacity:1}
.postimg .vazio{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted-foreground)}
.postimg .nav{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:flex;align-items:center;justify-content:center}
.postimg .nav.l{left:9px}.postimg .nav.r{right:9px}
.postimg .nav .ico{width:17px;height:17px}
.postimg .pips{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:4px}
.postimg .pips i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.5)}
.postimg .pips i.on{background:#fff}
.postimg .tagtl{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;padding:3px 9px;font-size:10.5px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.coracao{position:absolute;bottom:9px;right:9px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;line-height:1;backdrop-filter:blur(3px);transition:transform .15s}
.coracao:hover{transform:scale(1.08)}

.caro .nav.l{left:8px}.caro .nav.r{right:8px}
.caro .pips{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:4px}
.caro .pips i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.5)}
.caro .pips i.on{background:#fff}
.caro .tagtl{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;padding:2px 8px;font-size:10.5px;font-weight:600}
.qa{position:absolute;bottom:8px;right:8px;display:flex;gap:5px}
.qa button{background:rgba(255,255,255,.94);color:#111;border-radius:8px;padding:5px 9px;font-size:11.5px;font-weight:700}
.tat{background-size:cover;background-position:center}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:13px;margin-top:14px}
.pcard{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--card)}
.pcard .im{height:125px;background:var(--muted);display:flex;align-items:center;justify-content:center;font-size:36px;position:relative}
.pcard .im .nv{position:absolute;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:11px}
.stat{background:var(--muted);border-radius:var(--radius);padding:13px 15px}

.stat .val{font-size:22px;font-weight:600;margin-top:4px;letter-spacing:-.02em}
.stat .hint{font-size:11px;color:var(--muted-foreground);margin-top:2px}

.envhead{border-bottom:1px solid var(--border);background:var(--card)}

.subnav a{display:inline-flex;align-items:center;gap:5px;padding:10px 12px;font-size:12.5px;font-weight:600;color:var(--muted-foreground);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
.subnav a.on{color:var(--foreground);border-bottom-color:var(--foreground)}

.av{width:36px;height:36px;border-radius:50%;background:var(--muted);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:var(--muted-foreground)}
.datebox{width:44px;height:44px;border-radius:9px;background:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.datebox .m{font-size:9px;font-weight:700;text-transform:uppercase;color:var(--muted-foreground)}
.datebox .d{font-size:15px;font-weight:700;line-height:1}

.authwrap{max-width:400px;margin:36px auto;padding:0 18px}

.req{color:var(--x-danger);font-size:11.5px;font-weight:600}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50}

.drawer .dh{padding:14px 17px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px}
.drawer .db{flex:1;overflow-y:auto;padding:15px 17px}
.drawer .df{border-top:1px solid var(--border);padding:11px 15px}

.banner{display:flex;align-items:center;gap:11px;background:var(--x-accent-bg);border:1px solid var(--x-accent-border);border-radius:var(--radius);padding:12px 15px}

.tag{background:#333;border-radius:5px;padding:1px 6px;font-size:10.5px}
.tag.real{background:#1b6e3c}.tag.mock{background:#9c2b2b}.tag.new{background:#2b5c70}

table.t td{padding:10px 0;border-bottom:1px solid var(--border)}
.bar{height:6px;background:var(--muted);border-radius:3px;overflow:hidden}

.pin b{display:block;width:19px;height:19px;border-radius:50%;background:var(--primary);color:var(--primary-foreground);font-size:10px;line-height:19px;margin:0 auto;border:2px solid var(--background)}
.pin.on b{background:var(--accent);transform:scale(1.25)}
.pin span{font-size:9.5px;background:var(--background);border:1px solid var(--border);border-radius:4px;padding:0 4px;white-space:nowrap}
.bub{max-width:78%;padding:8px 11px;border-radius:13px;font-size:13px;margin-bottom:7px}
.bub.them{background:var(--muted);border-bottom-left-radius:4px}
.bub.me{background:var(--primary);color:var(--primary-foreground);margin-left:auto;border-bottom-right-radius:4px}
/* Vantagens: margens da página vêm do .wrap, iguais às demais telas.
   O ritmo vertical tem três degraus, para o olho separar os níveis:
     14px  entre coisas do mesmo bloco
     26px  entre bloco e bloco
     40px  entre seções
   No celular cada degrau encolhe, senão a página vira rolagem vazia. */
.resumobusca{margin-top:10px}
.acoescentro{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.segmento.centrado{max-width:420px;margin:26px auto 0}
.blococentro{max-width:620px;margin:26px auto 0;text-align:center}
.blococentro.banner{text-align:left;margin-top:16px}
.gradeconteudo{display:grid;gap:14px;margin:26px auto 0;max-width:900px;
  grid-template-columns:repeat(3,1fr)}
.secao{margin-top:40px}
.secao + .gradeconteudo{margin-top:14px}
@media(max-width:1100px){.gradeconteudo{grid-template-columns:repeat(2,1fr)}}
@media(max-width:699px){
  .gradeconteudo{grid-template-columns:1fr;gap:11px;margin-top:20px}
  .segmento.centrado{margin-top:20px}
  .blococentro{margin-top:20px}
  .secao{margin-top:30px}
}
/* Trio de ações: mesma escala do botão Seguir, em linha. Rolam na
   horizontal se um rótulo crescer, em vez de quebrar linha. */
.acoestrio{display:flex;gap:6px;margin-top:11px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.acoestrio::-webkit-scrollbar{display:none}
.acoestrio .btn{flex-shrink:0;white-space:nowrap}

/* Perfil em coluna única, largura de leitura. Dimensionado pelo celular:
   o que cabe em 393px cabe em qualquer lugar. */
.perfilcol{max-width:640px;margin:0 auto}
.gradeport{grid-template-columns:repeat(3,1fr);gap:7px}
@media(max-width:460px){.gradeport{gap:5px}}
.vantagem{display:flex;flex-direction:column}
.vantagem .small.muted{flex:1}
.plan{border:1px solid var(--border);border-radius:var(--radius);padding:18px;background:var(--card);position:relative}
.plan.hl{border:2px solid var(--primary)}
.plan .rib{position:absolute;top:-10px;left:18px;background:var(--primary);color:var(--primary-foreground);border-radius:999px;padding:2px 10px;font-size:10.5px;font-weight:700}
.thumbsq{width:56px;height:56px;border-radius:8px;background-size:cover;background-position:center;position:relative;flex-shrink:0}
.thumbsq .x{position:absolute;top:-5px;right:-5px;width:17px;height:17px;border-radius:50%;background:var(--primary);color:var(--primary-foreground);font-size:10px;display:flex;align-items:center;justify-content:center}
/* ═══════════════════════════════════════════════════════════════════
   RESPONSIVIDADE — desenhada para os aparelhos que de fato acessam

   Tatuador trabalha no iPad; cliente navega no iPhone. Os pontos de
   quebra estão nos vãos entre essas larguras, nunca em cima delas.

     iPhone 16          393px   (Plus 430 · Pro Max 440)
     iPad mini          744px
     iPad 10.9 / Air    820px   ← retrato
     iPad Pro 11        834px
     iPad Pro 13       1024px
     iPad paisagem     1024–1366px

   O corte antigo em 820px caía exatamente no iPad retrato: o mesmo
   aparelho ganhava layouts diferentes conforme o modelo, e o tatuador
   perdia a busca justo onde mais trabalha.

   Os cortes atuais ficam nos vãos entre famílias de aparelho:
     460px   entre iPhone Pro Max (440) e iPad mini (744)
     700px   idem, separando telefone de tablet
    1100px   entre iPad retrato (1024) e iPad paisagem (1180)
   Nenhum aparelho cai a menos de 20px de um corte.
   ═══════════════════════════════════════════════════════════════════ */

/* ── iPad retrato e abaixo: uma coluna ───────────────────────────── */
@media(max-width:1100px){
  .cols2,.cols16{grid-template-columns:1fr}
  .feed{grid-template-columns:1fr}
}

/* ── iPad retrato (744–1023): mantém busca e atalhos, encurta rótulos
      Nada é escondido aqui — é a tela de trabalho do tatuador. ───── */
@media(max-width:1100px) and (min-width:700px){
  .aba{padding:10px 12px;font-size:13px}
  .search{max-width:280px}
  .feedposts{max-width:460px}
}

/* ── Telefones (até 699px) ───────────────────────────────────────── */
@media(max-width:699px){
  /* Feed precisa começar cedo: o primeiro card tem de caber inteiro e
     ainda deixar ver o começo do segundo. Cada pixel aqui é pixel de foto. */
  main{padding:14px 0 60px}
  h1.page{font-size:19px}
  p.sub{font-size:12.5px;margin-top:2px}
  .feedposts{margin-top:10px}
  .resumobusca{margin-top:6px;font-size:11px}
  .postinfo{padding:9px 12px 10px}
  /* No telefone o subtítulo da home cede lugar à foto: o título já diz. */
  .subhome{display:none}
  /* 7:5 em vez de 4:3 — devolve 13px por card sem achatar o trabalho. */
  .postimg{aspect-ratio:7/5}
  .aba{padding:9px 13px}
  .btnbarra,.barrabusca .campo input{height:42px}
  .search{display:none}
  h1.page{font-size:21px}
  /* Ações ficam SEMPRE na mesma linha das abas. Quem cede espaço são as
     abas, que rolam na horizontal — nunca os botões, que são a ação. */
  .linhaabas{gap:8px}
  .abas{margin-left:-18px;padding-left:18px}
  .aba span{display:none}
  .aba{padding:11px 14px}
  .abas-acoes .btn.sm{padding:7px 11px;font-size:12.5px;gap:5px}
  .abas-acoes{gap:6px}
  .feedposts{max-width:none}
  .btnbarra .rot{display:none}
  .btnbarra{padding:0 13px}
  .drawer{width:100%;border-left:none}
  .subnav{margin:0 -18px;padding:0 18px}
  /* Rodapé do drawer e da página respeitam a faixa do indicador do iPhone */
  .drawer .df{padding-bottom:calc(11px + env(safe-area-inset-bottom,0px))}
  footer.note{padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
}

/* ── iPhone 16 e menores (até 440px) ─────────────────────────────── */
@media(max-width:460px){
  .seg{padding:7px 8px;font-size:12px}
  .wrap{padding:0 14px}
  .abas,.subnav{margin:0 -14px;padding:0 14px}
  .abas{margin-right:0;padding-right:0}
  .aba{padding:11px 12px}
  .abas-acoes .btn.sm{padding:7px 9px;font-size:12px}
  .linhaabas{gap:6px}
  .top-in{gap:8px;height:56px}
  .pad{padding:13px 14px}
  .postinfo{padding:11px 12px}
  h1.page{font-size:20px}
  .grid{gap:11px}
  /* Botões de ação lado a lado não cabem em 393px sem apertar */
  .postinfo .row .btn.sm{padding:7px 10px;font-size:12px}
}

/* ── Toque: alvo mínimo confortável ──────────────────────────────
   Apple recomenda 44pt. Vale para iPad e iPhone igualmente — o que
   muda o alvo é o dedo, não o tamanho da tela. ─────────────────── */
@media(pointer:coarse){
  .iconbtn{width:42px;height:42px}
  /* Botão maior no toque: o contador acompanha para não flutuar solto */
  .count{top:5px;right:4px;min-width:18px;height:18px;font-size:10px}
  .btnseguir{height:38px;padding:0 12px}
  .btnicone{width:40px;height:40px}
  .coracao{width:44px;height:44px;font-size:19px}
  .postimg .nav{width:38px;height:38px}
  .chip{padding:8px 13px}
  .btn.sm{padding:9px 13px}
  .subnav a{padding:13px 14px}
  .pill{padding:9px 14px}
  .btnbarra{height:44px}
  .barrabusca .campo input{height:44px}
  .avatarbtn{width:38px;height:38px}
}

/* Distância em linha reta entre duas coordenadas (fórmula de haversine).
   É cálculo de verdade — o que ainda é simulado são as coordenadas dos
   eventos, não a conta. */
function distanciaKm(a,b){
 var R=6371, r=Math.PI/180;
 var dLat=(b.lat-a.lat)*r, dLng=(b.lng-a.lng)*r;
 var x=Math.sin(dLat/2)*Math.sin(dLat/2)+
   Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)*Math.sin(dLng/2);
 return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function kmDe(e){
 var d=distanciaKm(S.local,e);
 return d<10 ? d.toFixed(1) : Math.round(d);
}

function barraBusca(cfg){

 h+='<button class="btnbarra '+(painel==="ordenar"?"on":"")+'" onclick="abrirPainel(\''+cfg.aba+'\',\'ordenar\')" title="Ordenar">↕<span class="rot">Ordenar</span></button>';
 h+='</div>';

 if(painel==="filtros"){

 }
 if(painel==="ordenar"){
  h+='<div class="painel"><div class="fgroup" style="margin-top:0"><span class="gl">Ordenar por</span>';
  cfg.ordenacoes.forEach(function(o){
   h+='<button class="chip '+(cfg.sort===o[0]?"on":"")+'" onclick="'+cfg.onOrdenar.replace("$1",o[0])+'">'+o[1]+'</button>'});
  h+='</div></div>';
 }

 var rot=(cfg.ordenacoes.filter(function(o){return o[0]===cfg.sort})[0]||cfg.ordenacoes[0])[1];
 h+='<div class="tiny muted resumobusca">'+rot+(cfg.nFiltros?' · '+cfg.nFiltros+' filtro'+(cfg.nFiltros>1?"s":""):'')+'</div>';
 return h;
}

/* Geolocalização REAL do navegador. Não precisa de chave nem de conta —
   o navegador pede permissão e devolve as coordenadas.
   O que ainda falta para fechar a integração com o Google Maps:
     · transformar coordenada em endereço legível (geocodificação reversa)
     · buscar por endereço digitado
     · desenhar o mapa de verdade em vez da grade simulada
   Os três exigem chave da API e passam por servidor, para a chave não
   ficar exposta no navegador. Está anotado em decisoes/pendencias.md. */
function usarMinhaLocalizacao(){
 if(!navigator.geolocation){
  S.localErro="Este navegador não oferece geolocalização.";render();return;
 }
 S.buscandoLocal=true;S.localErro="";render();
 navigator.geolocation.getCurrentPosition(function(pos){
  S.local={lat:pos.coords.latitude,lng:pos.coords.longitude};
  S.localReal=true;
  S.localNome="Sua localização atual";
  S.precisao=Math.round(pos.coords.accuracy);
  S.buscandoLocal=false;S.feedLote=1;render();
 },function(err){
  S.buscandoLocal=false;
  S.localErro = err.code===1
   ? "Permissão negada. Você pode digitar a cidade no campo de busca."
   : "Não foi possível obter sua localização agora.";
  render();
 },{enableHighAccuracy:false,timeout:8000,maximumAge:300000});
}

function filteredArtists(){
 var f=S.f;
 var l=ARTISTS.filter(function(a){
  if(f.styles.length&&!a.styles.some(function(s){return f.styles.indexOf(s)>=0}))return false;
  if(f.q.trim()){var q=f.q.trim().toLowerCase();
   if((a.name+" "+a.studio+" "+a.city+" "+a.styles.map(function(s){return SL[s]}).join(" ")).toLowerCase().indexOf(q)<0)return false}
  return true});
 if(f.sort==="price_asc")l.sort(function(a,b){return a.min-b.min});
 if(f.sort==="price_desc")l.sort(function(a,b){return b.min-a.min});

function feedList(){
 // Em modo real, o catálogo vem do banco. Se estiver vazio, dizer isso
 // com clareza é mais honesto do que preencher com gente que não existe.
 if(S.modo==="real"){
  if(S.reaisArtistas===null){
   carregarArtistasReais();
   return '<div class="card pad muted" style="margin-top:16px">Carregando do banco…</div>';
  }
  if(S.reaisArtistas.length===0){
   return '<div class="card pad" style="margin-top:16px"><div class="b">Nenhum tatuador cadastrado ainda.</div>'+
    '<div class="small muted" style="margin-top:5px">O banco está vazio — o que é esperado, ele foi criado hoje. Para ver o catálogo funcionando com dado real, crie uma conta de tatuador, preencha o perfil e publique.</div>'+
    '<div class="row" style="gap:8px;margin-top:11px"><button class="btn" onclick="go(\'conexao\')">Criar conta de teste</button>'+
    '<button class="btn" onclick="setModo(\'demo\')">Voltar para demonstração</button></div></div>';
  }
  var h='<div class="feedposts">';
  S.reaisArtistas.forEach(function(a){h+=publicacao(a)});
  return h+'</div>';
 }
 var l=filteredArtists();
 if(!l.length)return '<div class="card pad muted" style="margin-top:16px">Nenhum tatuador com esses filtros. Tente ampliar a faixa de preço ou remover algum estilo.</div>';

 // Scroll infinito: mostra um lote por vez e cresce ao chegar no fim.
 // Uma publicação por vez cabe melhor na tela do celular que uma grade.
 var ate=Math.min(l.length,S.feedLote*3);
 var h='<div class="feedposts">';
 l.slice(0,ate).forEach(function(a){h+=publicacao(a)});
 h+='</div>';
 if(ate<l.length){
  h+='<div id="sentinela" class="row" style="justify-content:center;padding:22px 0"><span class="tiny muted">carregando mais…</span></div>';
 }else{
  h+='<div class="row" style="justify-content:center;padding:22px 0"><span class="tiny muted">Você viu tudo que combina com esses filtros.</span></div>';
 }
 return h;
}

/* Publicação: um tatuador por vez, com o portfólio como carrossel.
   Curtir foto e seguir tatuador alimentam o que a plataforma entende
   sobre o gosto da pessoa — e é isso que faz o orçamento chegar em quem
   realmente combina, em vez de em quem só bate o filtro. */
function publicacao(a){
 var i=S.caro[a.id]||0;
 var fotos=a.empty?[]:a.port.slice(0,6);
 var total=fotos.length;
 var segue=S.seguindo.indexOf(a.id)>=0;
 var chaveFoto=a.id+":"+i;
 var curtiu=S.curtidas.indexOf(chaveFoto)>=0;
 var nCurtidas=S.curtidas.filter(function(c){return c.indexOf(a.id+":")===0}).length;

 var h='<article class="post">';

 // Cabeçalho e detalhes juntos: quem é, quanto cobra e as ações. Assim a
 // decisão de clicar acontece antes da foto, e o card fica mais curto.
 h+='<div class="postinfo">';

/* Converte a linha do banco para o formato que os cards já entendem.
   Mantém a interface intacta e isola a diferença num único lugar. */
function doBanco(a){
 var p=a.profiles||{};
 var estilos=(a.artist_styles||[]).map(function(s){return s.style_slug});
 var port=(a.portfolio_items||[]).map(function(x,i){return x.image_url||(i*7+3)});
 var cx=estilos.reduce(function(m,s){
  var e=STYLES.filter(function(x){return x.s===s})[0];
  return e&&e.c>m?e.c:m},2);
 return {id:a.profile_id,name:p.display_name||"Tatuador(a)",studio:a.studio_name||"",
  city:p.city||"",state:p.state||"",styles:estilos.length?estilos:["minimalista"],cx:cx,
  bio:p.bio||"",years:a.years_experience||0,
  rating:+(a.rating_avg||0)||5,reviews:a.rating_count||0,
  min:a.min_hourly_cents||(9000+cx*3500),max:a.max_hourly_cents||(9000+cx*3500+8000+cx*3000),
  verified:false,insta:!!a.instagram_handle,seed:(a.id||"").charCodeAt(0)||1,
  months:1,empty:port.length===0,port:port.length?port:[1,2,3,4,5,6,7,8,9]};
}
async function carregarArtistasReais(){
 if(S.carregando)return; S.carregando=true;
 try{

function listaEventos(){
 var l=EVENTS.map(function(e){return Object.assign({},e,{km:+kmDe(e)})}).filter(function(e){
  if(S.evT!=="all"&&e.t!==S.evT)return false;
  if(S.evP==="free"&&e.cost>0)return false;
  if(S.evP==="paid"&&e.cost===0)return false;
  if(S.evD==="near"&&e.km>5)return false;
  if(S.evD==="mid"&&(e.km<=5||e.km>10))return false;
  if(S.evD==="far"&&e.km<=10)return false;
  return true});
 if(S.evSort==="distance")l.sort(function(a,b){return a.km-b.km});
 if(S.evSort==="price-asc")l.sort(function(a,b){return a.cost-b.cost});
 if(S.evSort==="price-desc")l.sort(function(a,b){return b.cost-a.cost});
 if(S.evSort==="name")l.sort(function(a,b){return a.n.localeCompare(b.n)});

 var h=avisoLocal();
 h+=mapinha(l,170);
 if(!l.length)return h+'<div class="card pad muted" style="margin-top:14px">Nenhum evento com esses filtros.</div>';

 var ate=Math.min(l.length,S.feedLote*6);
 h+='<div class="lista">';
 l.slice(0,ate).forEach(function(e,k){

  h+='<div class="datebox"><span class="m">'+e.d.split(" ").pop()+'</span><span class="d">'+e.d.split(/[–\s]/)[0]+'</span></div>';
  h+='<div class="itemtxt"><div class="b small">'+e.n+'</div>';
  h+='<div class="tiny muted">'+e.t+' · '+e.city+'</div>';
  h+='<div class="tiny muted">a '+e.km+' km de você</div></div>';
  h+='<div class="itemfim"><div class="b small">'+(e.cost?money(e.cost):"Grátis")+'</div>';
  h+='<span class="tiny muted">participar ›</span></div>';
  h+='</button>';
 });
 h+='</div>';
 h+= ate<l.length
  ? '<div id="sentinela" class="row" style="justify-content:center;padding:20px 0"><span class="tiny muted">carregando mais…</span></div>'
  : '<div class="row" style="justify-content:center;padding:20px 0"><span class="tiny muted">Você viu os '+l.length+' eventos por perto.</span></div>';
 return h;
}

function listaCursos(){
 var c=COURSES.filter(function(x){
  if(S.coT!=="all"&&x.t!==S.coT)return false;
  if(S.coL!=="all"&&x.lv!==S.coL)return false;
  if(S.coP==="free"&&x.cost>0)return false;
  if(S.coP==="lt500"&&(x.cost===0||x.cost>=500))return false;
  if(S.coP==="gte500"&&x.cost<500)return false;
  if(S.coQ&&S.coQ.trim()&&(x.n+" "+x.who).toLowerCase().indexOf(S.coQ.trim().toLowerCase())<0)return false;
  return true});
 if(S.coSort==="price-asc")c.sort(function(a,b){return a.cost-b.cost});
 if(S.coSort==="price-desc")c.sort(function(a,b){return b.cost-a.cost});
 if(S.coSort==="spots")c.sort(function(a,b){return b.spots-a.spots});
 if(S.coSort==="name")c.sort(function(a,b){return a.n.localeCompare(b.n)});

 // Mapa em destaque: mais alto que no de eventos. Só os presenciais e
 // híbridos têm lugar — os online aparecem na lista sem pino.
 var comLugar=c.filter(function(x){return x.t!=="Online"})
   .map(function(x,i){return {id:x.id,x:20+(i*17)%64,y:24+(i*23)%52}});

/* ═══ CADASTRO UNIFICADO ═══════════════════════════════════════════
   Um fluxo só para os três perfis. O primeiro passo cria a conta e
   pergunta quem é a pessoa; os passos seguintes mudam conforme a
   resposta. Antes havia dois fluxos separados — conta e onboarding de
   tatuador — e cliente não tinha nenhum. */

var PERFIS_CADASTRO=[
 {id:"cliente",icone:"👤",nome:"Cliente",desc:"Quero me tatuar, comprar e ir a eventos"},
 {id:"tatuador",icone:"🎨",nome:"Tatuador",desc:"Quero atender clientes e mostrar meu trabalho"},
 {id:"fornecedor",icone:"🏪",nome:"Fornecedor",desc:"Quero vender material para tatuadores",estado:"hipotese"}
];

function roteiroCadastro(){
 var r=[{id:"conta",t:"Sua conta"}];
 var p=S.cad.perfil;
 if(p==="cliente") r=r.concat([{id:"gostos",t:"O que você procura"},{id:"pronto",t:"Tudo pronto"}]);
 if(p==="tatuador"){
  r=r.concat([{id:"estudio",t:"Você e seu estúdio"},{id:"estilos",t:"Seus estilos"},{id:"portfolio",t:"Portfólio e redes"}]);
  if(S.onbQuerOrcamento) r.push({id:"orcamento",t:"Modelo de orçamento"});
  r.push({id:"pronto",t:"Revisar e publicar"});
 }
 if(p==="fornecedor") r=r.concat([{id:"empresa",t:"Sua empresa"},{id:"catalogo",t:"O que você fornece"},{id:"pronto",t:"Tudo pronto"}]);
 return r;
}
function irCadastro(perfil){
 S.cad={passo:0,perfil:perfil||null,nome:"",email:"",senha:"",msg:"",erro:false};
 S.onbStep=1;
 go("cadastro");
}
function passoCad(){
 var r=roteiroCadastro();
 return r[Math.min(S.cad.passo,r.length-1)];
}
function podeAvancar(){
 var id=passoCad().id, c=S.cad;
 if(id==="conta") return !!c.perfil && c.nome.trim().length>1 && /.+@.+\..+/.test(c.email) && c.senha.length>=6;
 if(id==="estudio") return S.onbName.trim().length>1;
 if(id==="empresa") return (S.forn.nome||"").trim().length>1;
 return true;
}
function avancarCad(){
 var r=roteiroCadastro();
 if(S.cad.passo < r.length-1){S.cad.passo++;render()}
 else concluirCadastro();
}
function voltarCad(){ if(S.cad.passo>0){S.cad.passo--;render()} }

function concluirCadastro(){
 var p=S.cad.perfil;
 if(p==="fornecedor"){
  S.cad.msg="Fornecedor ainda não tem cadastro de verdade — não existe tabela nem cobrança. Você entrou numa lista de espera fictícia.";
  S.cad.erro=false;S.cad.passo=roteiroCadastro().length-1;render();return;
 }
 S.session = p==="tatuador" ? "artist" : "client";
 S.roleSource="signup_trigger";
 if(p==="tatuador"){
  S.pf={nome:S.onbName,estudio:S.onbEstudio,cidade:S.onbCidade,uf:S.onbUf,estilos:S.onbStyles.slice(),publicado:true};
  go("studio");
 }else{
  go("me");
 }
}

function vCadastro(){
 var r=roteiroCadastro(), passo=passoCad(), i=S.cad.passo, c=S.cad;
 var h='<main><div class="wrap" style="max-width:620px">';
 h+='<div class="kicker">Criar conta</div>';
 h+='<h1 class="page" style="margin-top:3px">'+(c.perfil?PERFIS_CADASTRO.filter(function(x){return x.id===c.perfil})[0].nome:"Vamos começar")+'</h1>';
 h+='<div class="steps">';r.forEach(function(x,k){h+='<i class="'+(k<=i?"on":"")+'"></i>'});h+='</div>';
 h+='<div class="tiny muted" style="margin-top:7px">Passo '+(i+1)+' de '+r.length+' · '+passo.t+'</div>';
 h+='<div class="card pad" style="margin-top:14px">';

 // ── 1. conta + escolha de perfil
 if(passo.id==="conta"){
  h+='<div class="grid" style="gap:10px">';
  h+='<div><label class="lb">Seu nome</label><input class="fld" value="'+c.nome+'" oninput="S.cad.nome=this.value;render()" placeholder="Como quer ser chamado" /></div>';
  h+='<div><label class="lb">Email</label><input class="fld" value="'+c.email+'" oninput="S.cad.email=this.value;render()" placeholder="nome@email.com" /></div>';
  h+='<div><label class="lb">Senha</label><input class="fld" type="password" oninput="S.cad.senha=this.value;render()" placeholder="mínimo 6 caracteres" /></div>';
  h+='</div>';

  // Alternativa ao email fica logo abaixo dele, onde a decisão acontece
  h+='<div class="ou"><span>ou</span></div>';
  h+='<button class="btn blk" onclick="S.gateRole=null;go(\'gate\')">Continuar com Google</button>';

  h+='<div class="sep"></div>';
  h+='<div class="row"><span class="b small">Como você vai usar a plataforma?</span><span class="req">obrigatório</span></div>';
  h+='<div class="tiny muted" style="margin-top:3px">Define os próximos passos. Dá para acrescentar outro perfil depois.</div>';
  h+='<div class="perfis">';
  PERFIS_CADASTRO.forEach(function(x){
   h+='<button class="perfilopt '+(c.perfil===x.id?"on":"")+'" onclick="S.cad.perfil=\''+x.id+'\';render()">';
   h+='<span class="ic">'+x.icone+'</span>';
   h+='<span class="nome">'+x.nome+'</span>';
   if(x.estado==="hipotese")h+='<span class="badge warn">em estudo</span>';
   h+='</button>';
  });
  h+='</div>';
 }

/* ============ ONBOARDING ============ */
/* O roteiro do onboarding é montado na hora. O passo 4 — modelo de
   orçamento — só entra se a pessoa tiver sinalizado interesse no passo 3.
   Assim quem só quer aparecer no catálogo faz 4 passos, não 5. */
function passosDoOnboarding(){
 var r=[{n:1,t:"Sobre você e seu estúdio"},{n:2,t:"Seus estilos"},{n:3,t:"Portfólio e redes"}];
 if(S.onbQuerOrcamento) r.push({n:4,t:"Modelo de orçamento"});
 r.push({n:5,t:"Revisar e publicar"});
 return r;
}
function passoSeguinte(st){
 var ns=passosDoOnboarding().map(function(p){return p.n});
 var i=ns.indexOf(st);
 return i>=0&&i<ns.length-1 ? ns[i+1] : st;
}
function passoAnterior(st){
 var ns=passosDoOnboarding().map(function(p){return p.n});
 var i=ns.indexOf(st);
 return i>0 ? ns[i-1] : st;
}
function irPasso(destino){
 S.onbStep=destino;
 render();
}

function subirModeloOrcamento(arquivos){
 if(!arquivos||!arquivos.length)return;
 var a=arquivos[0];
 if(!/\.xlsx?$/i.test(a.name)){
  S.onbErro=true;S.onbMsg="Só planilhas .xls ou .xlsx.";render();return;
 }
 if(a.size>2*1024*1024){
  S.onbErro=true;S.onbMsg="Planilha acima de 2 MB.";render();return;
 }
 // No protótipo só registramos o nome. Ler a planilha e extrair as faixas
 // de preço exige backend — está anotado como pendência.
 S.onbModeloArquivo=a.name;
 S.onbModelo="proprio";
 S.onbErro=false;S.onbMsg="";
 render();
}

   anos:S.onbAnos||null, instagram:S.onbInsta||null,

 }

/* No app real os drawers do TopBar abrem para qualquer visitante — o login
   só é exigido na ação final (enviar pedido, finalizar compra). */
function openDrawer(k){S.menu=false;S.drawer=k;renderDrawer();renderTop()}
function closeDrawer(){S.drawer=null;renderDrawer()}
function renderDrawer(){
 var host=document.getElementById("drawerHost");
 if(!S.drawer){host.innerHTML="";return}
 var t="",b="",f="";
 if(S.drawer==="hub"){t="✨ Orçamentos"+tg("real");b=hubBody()}
 if(S.drawer==="assist"){t="✨ Assistente de orçamento"+tg("real");b=assistBody()}
 if(S.drawer==="chat"){t="💬 Mensagens"+tg("mock");b=chatBody();if(S.chatOpen)f='<div class="row"><input class="fld" placeholder="Escreva uma mensagem…" /><button class="btn primary">Enviar</button></div>'}
 if(S.drawer==="notif"){t="🔔 Notificações"+tg("mock");b=notifBody()}
 if(S.drawer==="cart"){t="🛒 Carrinho"+tg("mock");b=cartBody();f=cartFoot()}
 host.innerHTML=icons('<div class="scrim" onclick="closeDrawer()"></div><aside class="drawer">'+
  '<div class="dh">'+(S.drawer==="chat"&&S.chatOpen?'<button class="iconbtn" onclick="S.chatOpen=null;renderDrawer()">←</button>':'')+
  '<span class="b">'+t+'</span><button class="iconbtn sp" onclick="closeDrawer()">✕</button></div>'+
  '<div class="db">'+b+'</div>'+(f?'<div class="df">'+f+'</div>':'')+'</aside>');
}

function calcUE(){
 var u=S.ue;
 var custoMes=u.custo*u.qtd;
 var margemAssin=u.preco-custoMes;
 var ticket=80000/100; // sessão média R$ 800
 var receitaTake=ticket*(u.take/100);
 var el=document.getElementById("ueOut");
 if(!el)return;
 var h='<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">';
 h+='<div class="stat"><div class="lbl">Custo de IA por tatuador/mês</div><div class="val">R$ '+custoMes.toFixed(2)+'</div></div>';
 h+='<div class="stat"><div class="lbl">Margem na assinatura</div><div class="val" style="color:'+(margemAssin<0?'var(--x-danger)':'var(--x-success)')+'">R$ '+margemAssin.toFixed(2)+'</div>';
 h+='<div class="hint">'+(margemAssin<0?'prejuízo por assinante':'por assinante')+'</div></div>';
 h+='<div class="stat"><div class="lbl">Comissão por trabalho fechado</div><div class="val">R$ '+receitaTake.toFixed(2)+'</div><div class="hint">sessão média de R$ 800</div></div>';
 h+='<div class="stat"><div class="lbl">Trabalhos/mês para empatar</div><div class="val">'+(receitaTake>0?Math.ceil(custoMes/receitaTake):'—')+'</div><div class="hint">só com comissão</div></div>';
 h+='</div>';
 if(margemAssin<0)h+='<div class="banner" style="margin-top:10px;background:var(--x-danger-bg);border-color:var(--x-danger)"><div class="small" style="color:var(--x-danger)"><b>Atenção:</b> nesta configuração cada assinante dá prejuízo. Quanto mais sucesso, maior a perda — o clássico problema de plano gratuito com custo variável alto.</div></div>';
 el.innerHTML=icons(h);
}

   h+='<tr><td class="muted">Estilos no catálogo</td><td style="text-align:right" class="b">'+c.tabelas+'</td></tr>';
   h+='<tr><td class="muted">Sessão ativa</td><td style="text-align:right" class="b">'+(c.sessao?c.sessao.user.email:"nenhuma")+'</td></tr>';
   if(S.papeis)h+='<tr><td class="muted">Papéis desta conta</td><td style="text-align:right">'+(S.papeis.length?S.papeis.map(function(p){return '<span class="badge ok">'+p.role+'</span>'}).join(" "):'<span class="muted">—</span>')+'</td></tr>';
   h+='</table>';
  }else{
   h+='<div class="row"><span class="badge bad">falhou</span><span class="sp tiny muted">na etapa: '+c.etapa+'</span></div>';
   h+='<div class="small" style="margin-top:8px;color:var(--x-danger)">'+c.detalhe+'</div>';
   if(location.protocol==="file:"){
    h+='<div class="banner" style="margin-top:11px"><div><div class="b small">Provável causa: aberto direto do Finder.</div>';
    h+='<div class="tiny muted">O navegador bloqueia conexões quando a página vem de um arquivo. Feche esta aba e use <b>abrir-prototipo.command</b>, que serve a página por HTTP local.</div></div></div>';
   }
  }
 }else{
  h+='<div class="sep"></div><div class="small muted">Em demonstração, tudo funciona com dados fictícios — inclusive telas que não têm backend nenhum. Útil para navegar o produto inteiro, enganoso para avaliar maturidade.</div>';
 }
 h+='</div>';

 // ── o que está de fato ligado
 h+='<div class="row" style="margin-top:24px"><span class="b" style="font-size:16px">O que está ligado ao banco</span></div>';
 h+='<div class="card pad" style="margin-top:10px">';
 [["Cadastro e login","real","Supabase Auth. A escolha de papel no cadastro grava em user_roles pelo gatilho."],
  ["Papéis cliente/tatuador","real","Fonte de verdade da autorização, com origem registrada."],
  ["Catálogo de estilos","real","15 estilos com complexidade e faixa de preço."],
  ["Catálogo de tatuadores","real","Só publicados aparecem — garantido por política, não por filtro."],
  ["Perfil e portfólio do tatuador","real","Criação e edição gravam no banco."],
  ["Pedido de orçamento + matching","real","Grava o pedido e convida tatuadores compatíveis por estilo e cidade."],
  ["Análise por IA","pendente","Precisa de chave própria do provedor. Hoje o resultado é simulado."],
  ["Upload de imagens","pendente","Buckets existem, a interface ainda não envia."],
  ["Loja, chat, agenda, eventos, campanhas, avaliações, pagamentos","nenhum","Não existem tabelas. Interface apenas."]
 ].forEach(function(l,i,arr){
  var t=l[1]==="real"?"ok":l[1]==="pendente"?"warn":"bad";
  h+='<div class="row wrapf" style="padding:9px 0;'+(i<arr.length-1?'border-bottom:1px solid var(--border)':'')+'">';
  h+='<div style="flex:1;min-width:200px"><div class="b small">'+l[0]+'</div><div class="tiny muted">'+l[2]+'</div></div>';
  h+='<span class="badge '+t+'">'+l[1]+'</span></div>';
 });
 h+='</div>';

 // ── conta real de teste
 if(S.modo==="real"&&c&&c.ok){
  h+='<div class="row" style="margin-top:24px"><span class="b" style="font-size:16px">Criar conta de verdade</span></div>';
  h+='<div class="card pad" style="margin-top:10px">';
  h+='<div class="small muted">Cria um usuário real no seu Supabase. Serve para verificar que o modelo de papéis funciona ponta a ponta.</div>';
  h+='<div class="grid" style="gap:9px;margin-top:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">';
  h+='<div><label class="lb">Nome</label><input class="fld" id="rNome" value="'+(S.reg.nome||"")+'" oninput="S.reg.nome=this.value" /></div>';
  h+='<div><label class="lb">Email</label><input class="fld" id="rEmail" value="'+(S.reg.email||"")+'" oninput="S.reg.email=this.value" /></div>';
  h+='<div><label class="lb">Senha</label><input class="fld" type="password" id="rSenha" oninput="S.reg.senha=this.value" /></div>';
  h+='</div>';
  h+='<div class="row" style="margin-top:11px"><span class="small b">Também é tatuador?</span>';
  h+='<div class="row sp" style="gap:6px">';
  h+='<button class="chip '+(S.reg.artista===false?"on":"")+'" onclick="S.reg.artista=false;render()">Não</button>';
  h+='<button class="chip '+(S.reg.artista===true?"on":"")+'" onclick="S.reg.artista=true;render()">Sim</button>';
  h+='</div></div>';
  h+='<div class="row" style="gap:8px;margin-top:12px">';
  h+='<button class="btn primary" '+(S.reg.artista===null?"disabled":"")+' onclick="registrarReal()">Criar conta</button>';
  h+='<button class="btn" onclick="entrarReal()">Entrar com esta conta</button>';
  if(c.sessao)h+='<button class="btn sp" onclick="sairReal()">Sair</button>';
  h+='</div>';
  if(S.regMsg)h+='<div class="banner" style="margin-top:11px;'+(S.regErro?'background:var(--x-danger-bg);border-color:var(--x-danger)':'')+'"><div class="small"'+(S.regErro?' style="color:var(--x-danger)"':'')+'>'+S.regMsg+'</div></div>';
  h+='</div>';
 }

 h+='<div class="row" style="margin-top:20px"><button class="btn" onclick="go(\'home\')">← Voltar ao produto</button></div>';
 return h+'</div></main>';
}

function setModo(m){
 S.modo=m;S.conn=null;
 var p=document.getElementById("pilhaStatus");if(p)p.textContent=m==="real"?"real":"demo";
 render();
 if(m==="real")checarConexao();
}
async function checarConexao(){
 try{
  S.conn=await window.Dados.testarConexao();
  if(S.conn.ok&&S.conn.sessao){try{S.papeis=await window.Dados.meusPapeis()}catch(e){S.papeis=[]}}
  else S.papeis=null;
 }catch(e){S.conn={ok:false,etapa:"iniciar",detalhe:String(e)}}
 if(S.route==="conexao")render();
}
async function registrarReal(){
 S.regMsg="Criando…";S.regErro=false;render();
 try{
  await window.Dados.criarConta(S.reg.email,S.reg.senha,S.reg.nome,S.reg.artista);
  S.regMsg="Conta criada. Se a confirmação por email estiver ligada no Supabase, confirme antes de entrar.";
  await checarConexao();
 }catch(e){S.regErro=true;S.regMsg=e.message||String(e)}
 render();
}
async function entrarReal(){
 S.regMsg="Entrando…";S.regErro=false;render();
 try{
  await window.Dados.entrar(S.reg.email,S.reg.senha);
  await checarConexao();
  S.papeis=await window.Dados.meusPapeis();
  var tem=S.papeis.map(function(p){return p.role});
  S.session=tem.indexOf("artist")>=0?"artist":"client";
  S.regMsg="Entrou. Papéis: "+tem.join(", ")+". A sessão do protótipo passou a refletir a conta real.";
 }catch(e){S.regErro=true;S.regMsg=e.message||String(e)}
 render();
}
async function salvarPerfilReal(){
 S.pfMsg="Salvando…";S.pfErro=false;render();
 try{
  await window.Dados.salvarPerfilDeArtista({
   nome:S.pf.nome,estudio:S.pf.estudio,cidade:S.pf.cidade,uf:S.pf.uf,
   estilos:S.pf.estilos,publicado:S.pf.publicado
  });
  S.reaisArtistas=null; // força recarga do catálogo
  S.pfMsg=S.pf.publicado
   ? "Salvo e publicado. Vá para o catálogo público e veja seu perfil aparecer — inclusive deslogada."
   : "Salvo. Como não está publicado, ninguém além de você consegue ver.";
 }catch(e){S.pfErro=true;S.pfMsg=e.message||String(e)}
 render();
}
async function sairReal(){
 await window.Dados.sair();S.session="anon";S.papeis=null;S.regMsg="Sessão encerrada.";S.regErro=false;
 await checarConexao();render();
}

/* ============ RENDER ============ */
function render(){
 renderTop();
 var r=S.route,h="";
 if(r==="conexao")h=vConexao();
 else if(r==="modelo")h=vModelo();
 else if(r==="home")h=vHome();
 else if(r==="artist")h=vArtist();
 else if(r==="plataforma")h=vLanding();
 else if(r==="auth")h=vAuth();
 else if(r==="cadastro"||r==="signup")h=vCadastro();
 else if(r==="gate")h=vGate();
 else if(r.indexOf("me")===0)h=isLog()?vMe(r):vAuth();
 else if(r.indexOf("studio")===0)h=isLog()?vStudio(r):vAuth();
 document.getElementById("app").innerHTML=icons(h);
 document.getElementById("sessionSel").value=S.session;
 if(r==="modelo")calcUE();
 if(r==="home")ligarScrollInfinito();
 if(S.autoAssist){S.autoAssist=false;openDrawer("assist")}
}
document.getElementById("sessionSel").addEventListener("change",function(e){
 S.session=e.target.value;
 if(S.session==="artist"&&!S.roleSource)S.roleSource="signup_trigger";
 if(!isLog()&&(S.route.indexOf("me")===0||S.route.indexOf("studio")===0))S.route="home";
 render();
});
/* markup estático da barra superior também passa pelo pós-processador */
["staticSearchIc","staticTheme"].forEach(function(id){
 var e=document.getElementById(id);if(e)e.innerHTML=icons(e.innerHTML);
});
render();
</script>
</body>
