<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ink Creators — protótipo</title>
<link rel="icon" type="image/png" href="marca/favicon.png" />
<link rel="apple-touch-icon" href="marca/logo-preto.png" />
<style>
:root{
  /* ── Tokens oficiais shadcn/ui — mesmos valores de src/styles.css do projeto ── */
  --radius:0.75rem;
  --background:oklch(1 0 0);
  --foreground:oklch(0.16 0 0);
  --card:oklch(1 0 0);
  --card-foreground:oklch(0.16 0 0);
  --popover:oklch(1 0 0);
  --popover-foreground:oklch(0.16 0 0);
  --primary:oklch(0.16 0 0);
  --primary-foreground:oklch(0.99 0 0);
  --secondary:oklch(0.96 0 0);
  --secondary-foreground:oklch(0.22 0 0);
  --muted:oklch(0.96 0 0);
  --muted-foreground:oklch(0.5 0 0);
  --accent:oklch(0.42 0.06 215);
  --accent-foreground:oklch(0.99 0 0);
  --destructive:oklch(0.55 0.18 25);
  --destructive-foreground:oklch(0.99 0 0);
  --border:oklch(0.92 0 0);
  --input:oklch(0.92 0 0);
  --ring:oklch(0.42 0.06 215);
  --chart-1:oklch(0.16 0 0);--chart-2:oklch(0.42 0.06 215);--chart-3:oklch(0.55 0 0);
  --chart-4:oklch(0.75 0 0);--chart-5:oklch(0.88 0 0);
  /* ── Extensões do protótipo (prefixo -x-): estados que o shadcn não cobre ── */
  --x-accent-bg:oklch(0.965 0.012 215);
  --x-accent-border:oklch(0.89 0.025 215);
  --x-success:oklch(0.45 0.12 150);--x-success-bg:oklch(0.96 0.03 150);
  --x-warning:oklch(0.48 0.10 75);--x-warning-bg:oklch(0.96 0.04 85);
  --x-danger:oklch(0.50 0.16 25);--x-danger-bg:oklch(0.96 0.03 25);
  --x-tag-violet:oklch(0.45 0.14 300);--x-tag-violet-bg:oklch(0.96 0.03 300);
  --x-tag-blue:oklch(0.45 0.13 250);--x-tag-blue-bg:oklch(0.96 0.03 250);
  --x-tag-teal:oklch(0.45 0.09 190);--x-tag-teal-bg:oklch(0.95 0.03 190);
}
html[data-dark]{
  /* ── Tema escuro CORRIGIDO: mesma identidade monocromática + petróleo do claro.
       O projeto hoje tem roxo aqui (resto do template padrão) — ver dark-theme-corrigido.css ── */
  --background:oklch(0.14 0 0);
  --foreground:oklch(0.97 0 0);
  --card:oklch(0.18 0 0);
  --card-foreground:oklch(0.97 0 0);
  --popover:oklch(0.18 0 0);
  --popover-foreground:oklch(0.97 0 0);
  --primary:oklch(0.97 0 0);
  --primary-foreground:oklch(0.14 0 0);
  --secondary:oklch(0.24 0 0);
  --secondary-foreground:oklch(0.95 0 0);
  --muted:oklch(0.24 0 0);
  --muted-foreground:oklch(0.68 0 0);
  --accent:oklch(0.72 0.07 215);
  --accent-foreground:oklch(0.14 0 0);
  --destructive:oklch(0.62 0.19 25);
  --destructive-foreground:oklch(0.99 0 0);
  --border:oklch(0.27 0 0);
  --input:oklch(0.27 0 0);
  --ring:oklch(0.72 0.07 215);
  --chart-1:oklch(0.97 0 0);--chart-2:oklch(0.72 0.07 215);--chart-3:oklch(0.68 0 0);
  --chart-4:oklch(0.48 0 0);--chart-5:oklch(0.34 0 0);
  --x-accent-bg:oklch(0.26 0.030 215);
  --x-accent-border:oklch(0.35 0.045 215);
  --x-success:oklch(0.78 0.14 150);--x-success-bg:oklch(0.25 0.05 150);
  --x-warning:oklch(0.82 0.12 85);--x-warning-bg:oklch(0.27 0.05 85);
  --x-danger:oklch(0.75 0.15 25);--x-danger-bg:oklch(0.27 0.06 25);
  --x-tag-violet:oklch(0.78 0.12 300);--x-tag-violet-bg:oklch(0.26 0.05 300);
  --x-tag-blue:oklch(0.78 0.11 250);--x-tag-blue-bg:oklch(0.25 0.05 250);
  --x-tag-teal:oklch(0.78 0.09 190);--x-tag-teal-bg:oklch(0.24 0.04 190);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--background);color:var(--foreground);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit;color:inherit;background:var(--card)}
a{color:inherit;text-decoration:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px}
.hide{display:none!important}
.ico{width:1em;height:1em;display:inline-block;vertical-align:-.14em;flex-shrink:0}
.iconbtn .ico{width:19px;height:19px;vertical-align:0}
.stars{display:inline-flex;gap:1px;vertical-align:-.14em}
/* Faixa de preço em cifrões. O valor exato depende do desenho, então
   número solto no perfil vira promessa que o orçamento não cumpre. */
.cifra{font-weight:700;letter-spacing:.06em;color:color-mix(in oklab, var(--muted-foreground) 42%, transparent)}
.cifra b{color:var(--foreground);font-weight:700}
.cifra.g{font-size:19px;letter-spacing:.08em}
.stars .ico{width:.92em;height:.92em;vertical-align:0}
.pcard .im .ico{width:40px;height:40px;stroke-width:1.2;color:var(--muted-foreground)}
.thumb .ico,.datebox .ico{width:19px;height:19px}
.stat .lbl .ico{width:13px;height:13px;vertical-align:-.16em}

header.top{position:sticky;top:0;z-index:40;background:var(--background);border-bottom:1px solid var(--border)}
.top-in{display:flex;align-items:center;gap:14px;height:60px}
.logo{display:flex;align-items:center;gap:9px;cursor:pointer}
/* A marca é op-art de alto contraste: no tema escuro precisa inverter,
   senão o preto do padrão desaparece no fundo. Duas imagens, uma por tema. */
.logo .marca{width:34px;height:34px;flex-shrink:0;object-fit:contain;display:block}
html[data-dark] .logo .marca{content:url("marca/logo-branco.png")}
.logo .txt{display:flex;flex-direction:column;line-height:1;font-size:11.5px;font-weight:900;text-transform:uppercase;letter-spacing:-.01em}
.search{flex:1;max-width:400px;position:relative}
.search input{width:100%;height:35px;border:1px solid var(--border);border-radius:999px;padding:0 14px 0 32px;outline:none}
.search .ic{position:absolute;left:11px;top:9px;color:var(--muted-foreground);line-height:0}
.search .ic .ico{width:16px;height:16px}
.protobar .ico{width:13px;height:13px;vertical-align:-.15em}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:5px}
.iconbtn{width:35px;height:35px;border-radius:9px;display:flex;align-items:center;justify-content:center;position:relative}
.iconbtn:hover{background:var(--muted)}
/* Convite: pill com rótulo, em cor de acento. Tem texto porque é espaço
   de conversão — ícone sozinho não anuncia o que oferece. */
.pill.convite{color:var(--accent);border-color:var(--accent-bd)}
.pill.convite:hover{background:var(--x-accent-bg);border-color:var(--accent)}
.pill.convite.ativo{background:var(--accent);color:var(--accent-foreground);border-color:var(--accent)}
.pill.convite .ico{width:15px;height:15px}
/* Só o rótulo some no celular; o botão continua lá, em cor de acento. */
@media(max-width:560px){.pill.convite .rot{display:none}.pill.convite{padding:6px 10px}}
.dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
/* O número era centrado por line-height, que não considera a borda de
   2px nem a altura real do dígito — ficava fora do eixo. Flexbox centra
   nos dois eixos independente de fonte, borda ou tamanho do número. */
.count{position:absolute;top:2px;right:1px;
  display:flex;align-items:center;justify-content:center;
  box-sizing:border-box;min-width:17px;height:17px;padding:0 4px;
  border-radius:999px;border:2px solid var(--background);
  background:var(--primary);color:var(--primary-foreground);
  font-size:9.5px;font-weight:700;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:0}
.pill.accent-solid{background:var(--accent);color:var(--accent-foreground);border-color:var(--accent)}
.menu{position:absolute;right:0;top:40px;min-width:210px;background:var(--card);border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:5px;z-index:60}
.menu a{display:block;padding:8px 10px;border-radius:7px;font-size:13px;cursor:pointer}
.menu a:hover{background:var(--muted)}
.menu .mlabel{padding:7px 10px;font-size:11.5px;color:var(--muted-foreground);overflow:hidden;text-overflow:ellipsis}
.menu .msep{height:1px;background:var(--border);margin:4px 0}
.pill{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--border);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--card)}
.pill:hover{border-color:var(--muted-foreground)}
.pill.solid{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.pill.accent{background:var(--x-accent-bg);color:var(--accent);border-color:var(--x-accent-border)}
.marcagrande{width:64px;height:64px;object-fit:contain;display:block}
html[data-dark] .marcagrande{content:url("marca/logo-branco.png")}
.avatarbtn{width:33px;height:33px;border-radius:50%;background:var(--muted);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;border:1px solid var(--border)}

main{padding:24px 0 60px}
h1.page{font-size:25px;font-weight:600;letter-spacing:-.02em}
p.sub{color:var(--muted-foreground);margin-top:4px;font-size:13.5px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}
.pad{padding:15px 17px}
.grid{display:grid;gap:14px}
.cols2{grid-template-columns:2fr 1fr}
.cols16{grid-template-columns:1.6fr 1fr}
.muted{color:var(--muted-foreground)}
.small{font-size:12.5px}.tiny{font-size:11.5px}.b{font-weight:600}
.row{display:flex;align-items:center;gap:9px}
.sp{margin-left:auto}
.wrapf{flex-wrap:wrap}
.badge{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;background:var(--muted);color:var(--muted-foreground)}
.badge.ok{background:var(--x-success-bg);color:var(--x-success)}
.badge.warn{background:var(--x-warning-bg);color:var(--x-warning)}
.badge.bad{background:var(--x-danger-bg);color:var(--x-danger)}
.badge.acc{background:var(--x-accent-bg);color:var(--accent)}
.badge.vio{background:var(--x-tag-violet-bg);color:var(--x-tag-violet)}
.badge.blu{background:var(--x-tag-blue-bg);color:var(--x-tag-blue)}
.badge.tea{background:var(--x-tag-teal-bg);color:var(--x-tag-teal)}
.sep{height:1px;background:var(--border);margin:13px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--border);background:var(--card);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:600}
.btn:hover{border-color:var(--muted-foreground)}
.btn.primary{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn.blk{width:100%}
.fld{width:100%;text-align:left;font-weight:400;border:1px solid var(--border);border-radius:10px;padding:9px 12px;outline:none}
.fld:focus{border-color:var(--muted-foreground)}
label.lb{font-size:11.5px;color:var(--muted-foreground);display:block;margin-bottom:4px}

/* Abas: faixa com sublinhado, rolável. Ações ficam fora para não rolarem junto. */
.linhaabas{display:flex;align-items:flex-end;gap:14px;margin-top:16px;border-bottom:1px solid var(--border);flex-wrap:nowrap}
.abas{display:flex;gap:2px;flex:1 1 0;min-width:0;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.abas::-webkit-scrollbar{display:none}
.aba{display:inline-flex;align-items:center;gap:7px;padding:11px 14px;border-bottom:2px solid transparent;font-size:13.5px;font-weight:600;color:var(--muted-foreground);white-space:nowrap;flex-shrink:0;background:none}
.aba:hover{color:var(--foreground)}
.aba.on{color:var(--foreground);border-bottom-color:var(--foreground)}
.aba .ico{width:17px;height:17px}
.abas-acoes{display:flex;gap:7px;flex:0 0 auto;padding-bottom:7px}
.btn.sm.destaque{background:var(--accent);color:var(--accent-foreground);border-color:var(--accent)}
/* Controle segmentado — recorte dentro da aba.
   Peças unidas num trilho translúcido; a ativa sobe como uma lente.
   O desfoque de fundo faz o conteúdo que rola por baixo aparecer
   levemente, dando profundidade sem competir com o conteúdo. */
.segmento{display:flex;margin-top:16px;padding:3px;border-radius:999px;position:relative;
  background:color-mix(in oklab, var(--muted) 75%, transparent);
  backdrop-filter:blur(18px) saturate(170%);
  -webkit-backdrop-filter:blur(18px) saturate(170%);
  border:1px solid color-mix(in oklab, var(--foreground) 7%, transparent);
  box-shadow:inset 0 1px 0 color-mix(in oklab, #fff 55%, transparent), 0 1px 2px rgba(0,0,0,.05);
  overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.segmento::-webkit-scrollbar{display:none}
.seg{flex:1 1 0;min-width:0;white-space:nowrap;padding:7px 11px;border-radius:999px;
  font-size:12.5px;font-weight:600;color:var(--muted-foreground);background:none;
  transition:color .18s ease, background .18s ease}
.seg:hover{color:var(--foreground)}
.seg.on{color:var(--foreground);
  background:color-mix(in oklab, var(--card) 92%, transparent);
  box-shadow:0 1px 3px rgba(0,0,0,.11), 0 0 0 .5px color-mix(in oklab, var(--foreground) 6%, transparent),
    inset 0 1px 0 color-mix(in oklab, #fff 70%, transparent)}
html[data-dark] .segmento{
  background:color-mix(in oklab, var(--muted) 60%, transparent);
  box-shadow:inset 0 1px 0 color-mix(in oklab, #fff 8%, transparent), 0 1px 2px rgba(0,0,0,.3)}
html[data-dark] .seg.on{
  background:color-mix(in oklab, var(--card) 96%, transparent);
  box-shadow:0 1px 4px rgba(0,0,0,.45), inset 0 1px 0 color-mix(in oklab, #fff 10%, transparent)}

/* Barra de localização + mapa pequeno + lista compacta.
   Padrão de app de mobilidade: contexto no topo, decisão na lista. */
.avisoerro{margin-top:12px;padding:9px 12px;border-radius:9px;background:var(--x-warning-bg);color:var(--x-warning);font-size:12.5px}
.avisook{padding:9px 12px;border-radius:9px;background:var(--x-success-bg);color:var(--x-success);font-size:12.5px}

/* Marcos do passaporte. Cartão pequeno, sem barra de progresso e sem
   estado "bloqueado": um marco ou aconteceu, ou não está aqui. Mostrar
   o que falta transformaria decisão permanente em tarefa. */
.marcos{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.marco{display:flex;gap:9px;align-items:flex-start;padding:10px 11px;border:1px solid var(--border);
  border-radius:11px;background:var(--card)}
.marco .mic{font-size:16px;line-height:1.2;flex-shrink:0}
.marco .mic svg{width:16px;height:16px}

/* Check-in. O QR fica em fundo branco sempre, inclusive no tema
   escuro: câmera lê contraste, e um QR invertido não lê. */
.qrcx{display:inline-block;padding:12px;border-radius:14px;background:#fff;margin:15px auto 9px;
  box-shadow:0 2px 14px rgba(0,0,0,.14)}
.qrcx svg{display:block}
.codigo{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:27px;font-weight:700;
  letter-spacing:.28em;padding-left:.28em;margin-top:3px}
.relogio{font-size:34px;font-weight:700;letter-spacing:-.03em;margin:16px 0 4px}
.btnlocal{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted-foreground);background:none}
.btnlocal:hover{background:var(--muted);color:var(--foreground)}
.btnlocal.on{color:var(--accent)}
.btnlocal .ico{width:17px;height:17px}
.barrabusca .campo input{padding-right:42px}

.mapa{position:relative;margin-top:13px;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:var(--muted);
  background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:30px 30px}
.mapa .pin{position:absolute;transform:translate(-50%,-100%);cursor:pointer}
.mapa .pin b{display:block;width:22px;height:22px;border-radius:50%;background:var(--primary);color:var(--primary-foreground);font-size:11px;line-height:22px;text-align:center;border:2px solid var(--card)}
.mapa .pin.on b{background:var(--accent);transform:scale(1.2)}
.mapa .pin.voce b{background:var(--accent);width:15px;height:15px;line-height:15px;font-size:9px}
.mapaselo{position:absolute;bottom:7px;left:8px;font-size:10.5px;color:var(--muted-foreground);background:var(--card);border-radius:5px;padding:2px 7px;opacity:.9}

.lista{margin-top:12px;border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--card)}
.item{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:12px 13px;border-bottom:1px solid var(--border);background:none}
.item:last-child{border-bottom:none}
.item:hover{background:var(--muted)}
.item.on{background:var(--x-accent-bg)}
.item.compacto{padding:10px 13px}
.itemtxt{min-width:0;flex:1}
.itemfim{text-align:right;flex-shrink:0;display:flex;flex-direction:column;gap:2px}
.itemfoto{width:46px;height:46px;border-radius:9px;background:var(--muted);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.itemfoto .ico{width:24px;height:24px;color:var(--muted-foreground)}
.chip{border:1px solid var(--border);background:var(--card);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.chip.acc.on{background:var(--accent);border-color:var(--accent);color:var(--accent-foreground)}
.fbar{margin-top:16px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card)}
.fgroup{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:9px}
.fgroup .gl{font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted-foreground);min-width:78px}

/* Barra: busca, filtros e ordenar lado a lado */
.barrabusca{display:flex;gap:8px;margin-top:16px}
.barrabusca .campo{flex:1;position:relative;min-width:0}
.barrabusca .campo input{width:100%;height:40px;border:1px solid var(--border);border-radius:10px;padding:0 12px 0 34px;background:var(--card);outline:none}
.barrabusca .campo input:focus{border-color:var(--muted-foreground)}
.barrabusca .lupa{position:absolute;left:11px;top:11px;color:var(--muted-foreground);line-height:0}
.barrabusca .lupa .ico{width:16px;height:16px}
.btnbarra{position:relative;height:40px;padding:0 14px;border:1px solid var(--border);border-radius:10px;background:var(--card);display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;white-space:nowrap}
.btnbarra:hover{border-color:var(--muted-foreground)}
.btnbarra.on{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.btnbarra.temfiltro{border-color:var(--accent)}
.btnbarra .ico{width:17px;height:17px}
.btnbarra .pontinho{background:var(--accent);color:var(--accent-foreground);border-radius:999px;min-width:16px;height:16px;font-size:10px;line-height:16px;padding:0 4px}
.painel{margin-top:9px;padding:13px 15px;border:1px solid var(--border);border-radius:12px;background:var(--card)}

/* Feed em publicações, uma por vez */
.feedposts{max-width:440px;margin:14px auto 0}
.post{border:1px solid var(--border);border-radius:12px;background:var(--card);overflow:hidden;margin-bottom:14px}
.postinfo{padding:10px 12px 11px}
.btnseguir{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border:1px solid var(--border);border-radius:7px;background:var(--card);font-size:12px;font-weight:600;flex-shrink:0;white-space:nowrap}
.btnicone{width:32px;height:32px;border:1px solid var(--border);border-radius:8px;background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.btnicone:hover{border-color:var(--muted-foreground)}
.btnicone .ico{width:17px;height:17px}
.btnseguir:hover{border-color:var(--muted-foreground)}
.btnseguir.on{background:var(--primary);color:var(--primary-foreground);border-color:var(--primary)}
.btnseguir .ico{width:13px;height:13px}
.postimg{position:relative;aspect-ratio:4/3;background:var(--muted)}
.postimg .sl{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .25s}
.postimg .sl.on{opacity:1}
.postimg .vazio{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted-foreground)}
.postimg .nav{position:absolute;top:50%;transform:translateY(-50%);width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:flex;align-items:center;justify-content:center}
.postimg .nav.l{left:9px}.postimg .nav.r{right:9px}
.postimg .nav .ico{width:17px;height:17px}
.postimg .pips{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:4px}
.postimg .pips i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.5)}
.postimg .pips i.on{background:#fff}
.postimg .tagtl{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;padding:3px 9px;font-size:10.5px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.coracao{position:absolute;bottom:9px;right:9px;width:38px;height:38px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;line-height:1;backdrop-filter:blur(3px);transition:transform .15s}
.coracao:hover{transform:scale(1.08)}
.coracao.on{background:#fff;color:#e2474a}
.coracao .ico{width:20px;height:20px}
.coracao{width:34px;height:34px;font-size:17px}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:15px;margin-top:16px}
.acard{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--card)}
.acard:hover{border-color:var(--muted-foreground)}
.caro{position:relative;height:190px;background:var(--border)}
.caro .sl{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .25s}
.caro .sl.on{opacity:1}
.caro .nav{position:absolute;top:50%;transform:translateY(-50%);width:27px;height:27px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
.caro .nav.l{left:8px}.caro .nav.r{right:8px}
.caro .pips{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:4px}
.caro .pips i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.5)}
.caro .pips i.on{background:#fff}
.caro .tagtl{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);color:#fff;border-radius:999px;padding:2px 8px;font-size:10.5px;font-weight:600}
.qa{position:absolute;bottom:8px;right:8px;display:flex;gap:5px}
.qa button{background:rgba(255,255,255,.94);color:#111;border-radius:8px;padding:5px 9px;font-size:11.5px;font-weight:700}
.tat{background-size:cover;background-position:center}

.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(195px,1fr));gap:13px;margin-top:14px}
.pcard{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:var(--card)}
.pcard .im{height:125px;background:var(--muted);display:flex;align-items:center;justify-content:center;font-size:36px;position:relative}
.pcard .im .nv{position:absolute;top:50%;transform:translateY(-50%);width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.45);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:11px}
.stat{background:var(--muted);border-radius:var(--radius);padding:13px 15px}
.stat .lbl{font-size:11.5px;color:var(--muted-foreground)}
.stat .val{font-size:22px;font-weight:600;margin-top:4px;letter-spacing:-.02em}
.stat .hint{font-size:11px;color:var(--muted-foreground);margin-top:2px}

.envhead{border-bottom:1px solid var(--border);background:var(--card)}
.kicker{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-foreground)}
.subnav{display:flex;gap:2px;overflow-x:auto;margin-top:13px}
.subnav a{display:inline-flex;align-items:center;gap:5px;padding:10px 12px;font-size:12.5px;font-weight:600;color:var(--muted-foreground);border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer}
.subnav a.on{color:var(--foreground);border-bottom-color:var(--foreground)}
.subnav.client a.on{color:var(--accent);border-bottom-color:var(--accent)}

.lrow{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--border)}
.lrow:last-child{border-bottom:none}
.thumb{width:44px;height:44px;border-radius:9px;background:var(--muted);flex-shrink:0;background-size:cover;background-position:center}
.av{width:36px;height:36px;border-radius:50%;background:var(--muted);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:var(--muted-foreground)}
.datebox{width:44px;height:44px;border-radius:9px;background:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.datebox .m{font-size:9px;font-weight:700;text-transform:uppercase;color:var(--muted-foreground)}
.datebox .d{font-size:15px;font-weight:700;line-height:1}

.authwrap{max-width:400px;margin:36px auto;padding:0 18px}
.opt{flex:1;border:1px solid var(--border);border-radius:10px;padding:11px;cursor:pointer;text-align:left}
.opt:hover{border-color:var(--muted-foreground)}
.opt.on{border-color:var(--accent);background:var(--x-accent-bg)}
/* Campo com prefixo fixo — o @ pertence ao endereço, não ao que a
   pessoa digita, então ele fica desenhado dentro do campo. */
.campoprefixo{display:flex;align-items:center;border:1px solid var(--border);border-radius:10px;background:var(--card);overflow:hidden}
.campoprefixo>span{padding:0 2px 0 11px;color:var(--muted-foreground);font-weight:600;font-size:13.5px}
.campoprefixo input{border:none;background:none;border-radius:0;flex:1;min-width:0}
.campoprefixo:focus-within{border-color:var(--muted-foreground)}
.req{color:var(--x-danger);font-size:11.5px;font-weight:600}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--background);z-index:51;display:flex;flex-direction:column;border-left:1px solid var(--border)}
.drawer .dh{padding:14px 17px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:9px}
.drawer .db{flex:1;overflow-y:auto;padding:15px 17px}
.drawer .df{border-top:1px solid var(--border);padding:11px 15px}

.banner{display:flex;align-items:center;gap:11px;background:var(--x-accent-bg);border:1px solid var(--x-accent-border);border-radius:var(--radius);padding:12px 15px}
.protobar{background:#141414;color:#fff;font-size:11.5px;padding:6px 0}
.protobar .wrap{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.protobar select{background:#2c2c2c;color:#fff;border:1px solid #444;border-radius:6px;height:25px;padding:0 5px;font-size:11.5px}
.tag{background:#333;border-radius:5px;padding:1px 6px;font-size:10.5px}
.tag.real{background:#1b6e3c}.tag.mock{background:#9c2b2b}.tag.new{background:#2b5c70}
footer.note{border-top:1px solid var(--border);padding:20px 0;color:var(--muted-foreground);font-size:12px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-weight:600;color:var(--muted-foreground);font-size:11.5px;padding:7px 0;border-bottom:1px solid var(--border)}
table.t td{padding:10px 0;border-bottom:1px solid var(--border)}
.bar{height:6px;background:var(--muted);border-radius:3px;overflow:hidden}
.bar i{display:block;height:6px;background:var(--primary)}
/* ── Escolha de perfil no cadastro ─────────────────────────────────
   Mesma história do rodapé: .perfis, .perfilopt, .nome e .ou eram
   usadas no HTML e nunca tinham regra nenhuma. Sem isso os três viravam
   texto corrido, com o ícone colado na palavra e a etiqueta solta.

   Três cartões lado a lado, com respiro entre eles. Cartão em vez de
   lista porque a escolha é excludente e curta — ver as três de uma vez
   custa menos que ler três linhas. */
.perfis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:12px}
.perfilopt{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  gap:7px;padding:14px 8px;border:1px solid var(--border);border-radius:12px;
  background:var(--card);cursor:pointer;text-align:center;
  transition:border-color .15s ease,box-shadow .15s ease,background .15s ease}
.perfilopt:hover{border-color:var(--muted-foreground)}
.perfilopt .ic{display:flex;align-items:center;justify-content:center;
  width:36px;height:36px;border-radius:50%;background:var(--muted);
  color:var(--foreground);font-size:16px;flex-shrink:0}
.perfilopt .ic svg{width:18px;height:18px}
.perfilopt .nome{font-size:13px;font-weight:600;line-height:1.15}
.perfilopt .badge{font-size:9.5px;padding:2px 6px;line-height:1.3}
/* Selecionado: contorno mais forte e o ícone invertido. Cor de fundo
   sozinha não basta — quem enxerga pouco contraste perderia a escolha. */
.perfilopt.on{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.perfilopt.on .ic{background:var(--primary);color:var(--primary-foreground)}
@media(max-width:400px){
  .perfis{gap:7px}
  .perfilopt{padding:12px 5px;gap:6px}
  .perfilopt .nome{font-size:12px}
  .perfilopt .ic{width:32px;height:32px}
}

/* Ação que existe mas ainda não funciona. Não é desabilitada: botão
   apagado não explica nada, e a pessoa fica sem saber o que fazer.
   Clicável, com cara de espera, e o clique abre a explicação. */
.pendente{border-style:dashed !important;border-color:var(--x-warning) !important;
  background:var(--x-warning-bg) !important;color:var(--x-warning) !important;
  box-shadow:none !important}
.pendente:hover{border-color:var(--x-warning) !important;opacity:.85}
.pendente .ico,.pendente svg{opacity:.9}

/* Painel da visão geral. Rótulo primeiro, número logo abaixo: o rótulo
   é curto e diz do que se trata, e o número é o que a pessoa varre.

   Cartão pequeno de propósito. São dez, e dez cartões grandes viram
   três rolagens no celular — que é o oposto de um resumo. Aqui os dez
   cabem em duas telas no iPhone e numa só no iPad. */
.grandes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:560px){.grandes{grid-template-columns:repeat(3,1fr)}}
@media(min-width:700px){.grandes{grid-template-columns:repeat(4,1fr);gap:9px}}
@media(min-width:1100px){.grandes{grid-template-columns:repeat(5,1fr)}}
.grande{display:flex;flex-direction:column;align-items:flex-start;gap:0;
  padding:10px 11px 11px;border:1px solid var(--border);border-radius:11px;
  background:var(--card);cursor:pointer;text-align:left;
  transition:border-color .15s ease,transform .12s ease}
.grande:hover{border-color:var(--muted-foreground)}
.grande:active{transform:scale(.985)}
.grande .gtopo{display:flex;align-items:center;gap:5px;min-width:0;width:100%}
.grande .gic{color:var(--muted-foreground);font-size:12.5px;line-height:1;flex-shrink:0}
.grande .gic svg{width:13px;height:13px;display:block}
.grande .grot{font-size:11.5px;font-weight:600;line-height:1.2;min-width:0}
.grande .gval{font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin-top:5px}
.grande .gnota{font-size:10.5px;color:var(--muted-foreground);line-height:1.25;margin-top:1px}
/* Só quem tem pendência muda de cor. Se tudo destaca, nada destaca. */
.grande.alerta{border-color:var(--accent)}
.grande.alerta .gval,.grande.alerta .gic{color:var(--accent)}
@media(max-width:400px){
  .grande{padding:9px 10px 10px}
  .grande .gval{font-size:20px}
}

/* Contador dentro da sub-aba: diz quanto tem do outro lado sem obrigar
   a pessoa a ir ver. */
.seg .selo{display:inline-flex;align-items:center;justify-content:center;
  min-width:17px;height:17px;padding:0 5px;margin-left:6px;border-radius:999px;
  background:var(--muted-foreground);color:var(--card);
  font-size:10px;font-weight:700;line-height:1;vertical-align:1px}
.seg.on .selo{background:var(--primary);color:var(--primary-foreground)}

/* Galeria do artista. Foto quadrada e informação embaixo: quem compra
   arte decide pelo olho, e o preço só confirma. */
.gradeobras{grid-template-columns:repeat(2,1fr);gap:11px}
@media(min-width:560px){.gradeobras{grid-template-columns:repeat(3,1fr)}}
.obra{display:flex;flex-direction:column;text-align:left;border:1px solid var(--border);
  border-radius:12px;overflow:hidden;background:var(--card);cursor:pointer;
  transition:border-color .15s ease}
.obra:hover{border-color:var(--muted-foreground)}
.obrafoto{position:relative;aspect-ratio:1;background-size:cover;background-position:center}
.obraetiq{position:absolute;top:7px;left:7px;background:var(--primary);color:var(--primary-foreground);
  font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
  padding:3px 7px;border-radius:999px}
.obrainfo{padding:9px 10px 11px}

/* Convite do teste. Faixa embaixo: acompanha a rolagem sem cobrir o
   conteúdo, e no celular respeita a área segura do aparelho. */
.convitebarra{position:fixed;left:0;right:0;bottom:0;z-index:900;
  background:var(--card);border-top:1px solid var(--border);
  box-shadow:0 -6px 24px rgba(0,0,0,.08);
  padding:11px 0 calc(11px + env(safe-area-inset-bottom))}
.convitebarra .wrap{display:flex;align-items:center;gap:12px}
@media(max-width:560px){
  .convitebarra .wrap{flex-wrap:wrap}
  .convitebarra .row{width:100%;justify-content:flex-end}
}
/* Espaço para a faixa não tapar o fim da página. */
body:has(.convitebarra) main{padding-bottom:96px}

.convitecx{position:fixed;inset:0;z-index:901;overflow:auto;
  display:flex;align-items:flex-start;justify-content:center;padding:20px;
  pointer-events:none}
.convitecx main{pointer-events:auto;background:var(--background);
  border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.28);
  max-width:560px;width:100%;padding:6px 0 18px}

/* Aviso que fica até deixar de ser verdade. Amarelo e não vermelho: é
   pendência, não erro — o perfil continua no ar. */
.avisopendente{border-color:var(--x-warning);background:var(--x-warning-bg)}
.pendicone{display:flex;align-items:center;justify-content:center;width:26px;height:26px;
  border-radius:50%;background:var(--x-warning);color:#fff;font-size:14px;flex-shrink:0}
.avisopendente .tiny.muted{color:color-mix(in oklab, var(--x-warning) 70%, var(--foreground))}

/* Marcador de sim ou não, no formato de cartão. Área de clique inteira,
   não só o quadradinho — no celular acertar 16px é loteria. */
.marcador{display:flex;align-items:flex-start;gap:10px;padding:12px 13px;
  border:1px solid var(--border);border-radius:12px;background:var(--card);
  cursor:pointer;transition:border-color .15s ease,background .15s ease}
.marcador:hover{border-color:var(--muted-foreground)}
.marcador.on{border-color:var(--primary);background:var(--x-accent-bg)}
.marcador input{width:17px;height:17px;margin-top:1px;flex-shrink:0;accent-color:var(--primary);cursor:pointer}
@media(pointer:coarse){.marcador{padding:14px 13px}.marcador input{width:20px;height:20px}}

/* Separador "ou", com um fio de cada lado. */
.ou{display:flex;align-items:center;gap:11px;margin:15px 0;
  color:var(--muted-foreground);font-size:12px}
.ou::before,.ou::after{content:"";flex:1;height:1px;background:var(--border)}

/* Rodapé do cadastro. As regras não existiam — a classe era usada e o
   CSS nunca tinha sido escrito, então os três blocos empilhavam.

   Voltar cola na margem esquerda, Continuar na direita, e o "já tem
   conta?" fica no centro. No celular o texto do meio desce sozinho:
   espremer três coisas em 393px faria os botões encolherem, e botão de
   avançar encolhido é o pior lugar para economizar espaço. */
.rodapepassos{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
.rodapepassos .lado{display:flex;align-items:center;gap:8px;flex:1 1 0;min-width:0}
.rodapepassos .lado:last-child{justify-content:flex-end}
.rodapepassos .meio{flex:0 1 auto;text-align:center;font-size:12.5px;
  color:var(--muted-foreground);white-space:nowrap}
.rodapepassos .meio a{color:var(--accent);cursor:pointer;font-weight:600}
.rodapepassos .btn{white-space:nowrap}
@media(max-width:560px){
  /* O texto do meio passa para uma linha só dele, abaixo dos botões. */
  .rodapepassos .meio{order:3;flex:1 1 100%;margin-top:4px}
}
.steps{display:flex;gap:5px;margin-top:12px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--border)}
.steps i.on{background:var(--primary)}
.map{position:relative;height:230px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);
  background:var(--muted);
  background-image:linear-gradient(var(--border) 1px,transparent 1px),linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:34px 34px}
.pin{position:absolute;transform:translate(-50%,-100%);cursor:pointer;text-align:center}
.pin b{display:block;width:19px;height:19px;border-radius:50%;background:var(--primary);color:var(--primary-foreground);font-size:10px;line-height:19px;margin:0 auto;border:2px solid var(--background)}
.pin.on b{background:var(--accent);transform:scale(1.25)}
.pin span{font-size:9.5px;background:var(--background);border:1px solid var(--border);border-radius:4px;padding:0 4px;white-space:nowrap}
.bub{max-width:78%;padding:8px 11px;border-radius:13px;font-size:13px;margin-bottom:7px}
.bub.them{background:var(--muted);border-bottom-left-radius:4px}
.bub.me{background:var(--primary);color:var(--primary-foreground);margin-left:auto;border-bottom-right-radius:4px}
/* Vantagens: margens da página vêm do .wrap, iguais às demais telas.
   O ritmo vertical tem três degraus, para o olho separar os níveis:
     14px  entre coisas do mesmo bloco
     26px  entre bloco e bloco
     40px  entre seções
   No celular cada degrau encolhe, senão a página vira rolagem vazia. */
.resumobusca{margin-top:10px}
.acoescentro{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.segmento.centrado{max-width:420px;margin:26px auto 0}
.blococentro{max-width:620px;margin:26px auto 0;text-align:center}
.blococentro.banner{text-align:left;margin-top:16px}
.gradeconteudo{display:grid;gap:14px;margin:26px auto 0;max-width:900px;
  grid-template-columns:repeat(3,1fr)}
.secao{margin-top:40px}
.secao + .gradeconteudo{margin-top:14px}
@media(max-width:1100px){.gradeconteudo{grid-template-columns:repeat(2,1fr)}}
@media(max-width:699px){
  .gradeconteudo{grid-template-columns:1fr;gap:11px;margin-top:20px}
  .segmento.centrado{margin-top:20px}
  .blococentro{margin-top:20px}
  .secao{margin-top:30px}
}
/* Trio de ações: mesma escala do botão Seguir, em linha. Rolam na
   horizontal se um rótulo crescer, em vez de quebrar linha. */
/* Quatro ações do perfil: mesma largura, sem rótulo. O nome vive no
   title e no aria-label — quem usa leitor de tela continua ouvindo. */
.acoestrio{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.acaoic{display:flex;align-items:center;justify-content:center;height:38px;
  border:1px solid var(--border);background:var(--card);border-radius:10px;
  color:var(--foreground);transition:background .15s ease,border-color .15s ease}
.acaoic svg{width:17px;height:17px}
.acaoic:hover{border-color:var(--muted-foreground)}
.acaoic.principal{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}
.acaoic.ativa{background:var(--accent);border-color:var(--accent);color:var(--primary-foreground)}
@media(pointer:coarse){.acaoic{height:44px}}

/* Perfil em coluna única, largura de leitura. Dimensionado pelo celular:
   o que cabe em 393px cabe em qualquer lugar. */
.perfilcol{max-width:640px;margin:0 auto}
.gradeport{grid-template-columns:repeat(3,1fr);gap:7px}
@media(max-width:460px){.gradeport{gap:5px}}
.vantagem{display:flex;flex-direction:column}
.vantagem .small.muted{flex:1}
.plan{border:1px solid var(--border);border-radius:var(--radius);padding:18px;background:var(--card);position:relative}
.plan.hl{border:2px solid var(--primary)}

/* ═══════════════════════════════════════════════════════════════════
   RESPONSIVIDADE — desenhada para os aparelhos que de fato acessam

   Tatuador trabalha no iPad; cliente navega no iPhone. Os pontos de
   quebra estão nos vãos entre essas larguras, nunca em cima delas.

     iPhone 16          393px   (Plus 430 · Pro Max 440)
     iPad mini          744px
     iPad 10.9 / Air    820px   ← retrato
     iPad Pro 11        834px
     iPad Pro 13       1024px
     iPad paisagem     1024–1366px

   O corte antigo em 820px caía exatamente no iPad retrato: o mesmo
   aparelho ganhava layouts diferentes conforme o modelo, e o tatuador
   perdia a busca justo onde mais trabalha.

   Os cortes atuais ficam nos vãos entre famílias de aparelho:
     460px   entre iPhone Pro Max (440) e iPad mini (744)
     700px   idem, separando telefone de tablet
    1100px   entre iPad retrato (1024) e iPad paisagem (1180)
   Nenhum aparelho cai a menos de 20px de um corte.
   ═══════════════════════════════════════════════════════════════════ */

/* ── iPad retrato e abaixo: uma coluna ───────────────────────────── */
@media(max-width:1100px){
  .cols2,.cols16{grid-template-columns:1fr}
  .feed{grid-template-columns:1fr}
}

/* ── iPad retrato (744–1023): mantém busca e atalhos, encurta rótulos
      Nada é escondido aqui — é a tela de trabalho do tatuador. ───── */
@media(max-width:1100px) and (min-width:700px){
  .aba{padding:10px 12px;font-size:13px}
  .search{max-width:280px}
  .feedposts{max-width:460px}
}

/* ── Telefones (até 699px) ───────────────────────────────────────── */
@media(max-width:699px){
  /* Feed precisa começar cedo: o primeiro card tem de caber inteiro e
     ainda deixar ver o começo do segundo. Cada pixel aqui é pixel de foto. */
  main{padding:14px 0 60px}
  h1.page{font-size:19px}
  p.sub{font-size:12.5px;margin-top:2px}
  .feedposts{margin-top:10px}
  .resumobusca{margin-top:6px;font-size:11px}
  .postinfo{padding:9px 12px 10px}
  /* No telefone o subtítulo da home cede lugar à foto: o título já diz. */
  .subhome{display:none}
  /* 7:5 em vez de 4:3 — devolve 13px por card sem achatar o trabalho. */
  .postimg{aspect-ratio:7/5}
  .aba{padding:9px 13px}
  .btnbarra,.barrabusca .campo input{height:42px}
  .search{display:none}
  h1.page{font-size:21px}
  /* Ações ficam SEMPRE na mesma linha das abas. Quem cede espaço são as
     abas, que rolam na horizontal — nunca os botões, que são a ação. */
  .linhaabas{gap:8px}
  .abas{margin-left:-18px;padding-left:18px}
  .aba span{display:none}
  .aba{padding:11px 14px}
  .abas-acoes .btn.sm{padding:7px 11px;font-size:12.5px;gap:5px}
  .abas-acoes{gap:6px}
  .feedposts{max-width:none}
  .btnbarra .rot{display:none}
  .btnbarra{padding:0 13px}
  .drawer{width:100%;border-left:none}
  .subnav{margin:0 -18px;padding:0 18px}
  /* Rodapé do drawer e da página respeitam a faixa do indicador do iPhone */
  .drawer .df{padding-bottom:calc(11px + env(safe-area-inset-bottom,0px))}
  footer.note{padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
}

/* ── iPhone 16 e menores (até 440px) ─────────────────────────────── */
@media(max-width:460px){
  .seg{padding:7px 8px;font-size:12px}
  .wrap{padding:0 14px}
  .abas,.subnav{margin:0 -14px;padding:0 14px}
  .abas{margin-right:0;padding-right:0}
  .aba{padding:11px 12px}
  .abas-acoes .btn.sm{padding:7px 9px;font-size:12px}
  .linhaabas{gap:6px}
  .top-in{gap:8px;height:56px}
  .pad{padding:13px 14px}
  .postinfo{padding:11px 12px}
  h1.page{font-size:20px}
  .grid{gap:11px}
  /* Botões de ação lado a lado não cabem em 393px sem apertar */
  .postinfo .row .btn.sm{padding:7px 10px;font-size:12px}
}

/* ── Toque: alvo mínimo confortável ──────────────────────────────
   Apple recomenda 44pt. Vale para iPad e iPhone igualmente — o que
   muda o alvo é o dedo, não o tamanho da tela. ─────────────────── */
@media(pointer:coarse){
  .iconbtn{width:42px;height:42px}
  /* Botão maior no toque: o contador acompanha para não flutuar solto */
  .count{top:5px;right:4px;min-width:18px;height:18px;font-size:10px}

  .btnbarra{height:44px}
  .barrabusca .campo input{height:44px}
  .avatarbtn{width:38px;height:38px}
}

<script>
/* Os três arquivos ao lado, com um carimbo de tempo colado no nome.

   Sem o carimbo, o navegador reaproveita a cópia que ele já tem: o
   index.html mudava e os três continuavam na versão anterior — e a tela
   ficava com metade do ajuste. Era essa a origem de "não atualizou
   nada", e ela sobrevive a qualquer servidor, porque é do navegador.

   document.write, e não createElement, porque estes três precisam
   executar em ordem e antes do 'load'. É o único jeito de manter isso
   sem reescrever a inicialização. */
(function(){
 /* Aberto do Finder (file:), o carimbo fica de fora: alguns navegadores
    tratam a interrogação como parte do nome do arquivo e não acham
    nada. Nesse caso ele também não faz falta — lendo do disco, cada
    abertura já é a versão de agora. O carimbo existe para o endereço
    publicado, onde o cache é de verdade. */
 var v = location.protocol==="file:" ? "" : "?v="+Date.now();
 ["dados.js","teste.js","verificar.js"].forEach(function(f){
  document.write('<scr'+'ipt src="'+f+v+'"><\/scr'+'ipt>');
 });
})();
</script>

/* Distância em linha reta entre duas coordenadas (fórmula de haversine).
   É cálculo de verdade — o que ainda é simulado são as coordenadas dos
   eventos, não a conta. */
function distanciaKm(a,b){
 var R=6371, r=Math.PI/180;
 var dLat=(b.lat-a.lat)*r, dLng=(b.lng-a.lng)*r;
 var x=Math.sin(dLat/2)*Math.sin(dLat/2)+
   Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)*Math.sin(dLng/2);
 return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function kmDe(e){
 var d=distanciaKm(S.local,e);
 return d<10 ? d.toFixed(1) : Math.round(d);
}

/* ═══ CHECK-IN POR QR ══════════════════════════════════════════════
   O tatuador abre o check-in na hora em que a pessoa senta. A tela
   dele mostra um QR; a pessoa aponta a câmera e confirma. Pronto: a
   sessão fica registrada dos dois lados, no mesmo instante, por duas
   pessoas que estavam no mesmo lugar.

   Por que isso vale mais que um formulário depois:
   · para o cliente, vira carimbo verificado no passaporte — a diferença
     entre dizer que tatuou com alguém e ter isso confirmado;
   · para o tatuador, vira reputação que não dá para inventar, e um
     relógio honesto: quanto tempo levou, em que estilo, em que cidade;
   · para a plataforma, é o único dado de sessão que nasce confiável,
     porque exige as duas partes presentes.

   O código de seis caracteres existe porque câmera falha: luz ruim,
   lente suja, celular velho. Um fluxo que só funciona com QR trava a
   sessão por causa de uma câmera. */
function novoCodigoCheckin(){
 var abc="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // sem I, O, 0 e 1: viram engano ao ditar
 var c="";
 for(var i=0;i<6;i++)c+=abc[Math.floor(Math.random()*abc.length)];
 return c;
}

/* Um QR de mentira, mas estável: o mesmo código desenha sempre o mesmo
   padrão. Se fosse aleatório a cada repintura, o quadrado piscaria a
   cada clique e pareceria defeito. */
function qrFalso(codigo,lado){
 lado=lado||160;
 var n=21, cel=lado/n, semente=0, i;
 for(i=0;i<codigo.length;i++)semente=(semente*31+codigo.charCodeAt(i))>>>0;
 function proximo(){ semente=(semente*1103515245+12345)>>>0; return (semente>>>16)&1 }
 var h='<svg viewBox="0 0 '+lado+' '+lado+'" width="'+lado+'" height="'+lado+'" role="img" aria-label="Código do check-in">';
 h+='<rect width="'+lado+'" height="'+lado+'" fill="#fff"/>';
 function ancora(cx,cy){
  var r='<rect x="'+(cx*cel)+'" y="'+(cy*cel)+'" width="'+(7*cel)+'" height="'+(7*cel)+'" fill="#111"/>';
  r+='<rect x="'+((cx+1)*cel)+'" y="'+((cy+1)*cel)+'" width="'+(5*cel)+'" height="'+(5*cel)+'" fill="#fff"/>';
  r+='<rect x="'+((cx+2)*cel)+'" y="'+((cy+2)*cel)+'" width="'+(3*cel)+'" height="'+(3*cel)+'" fill="#111"/>';
  return r;
 }
 for(var y=0;y<n;y++)for(var x=0;x<n;x++){
  var naAncora=(x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9);
  if(naAncora){proximo();continue}
  if(proximo())h+='<rect x="'+(x*cel)+'" y="'+(y*cel)+'" width="'+cel+'" height="'+cel+'" fill="#111"/>';
 }
 h+=ancora(0,0)+ancora(n-7,0)+ancora(0,n-7);
 return h+'</svg>';
}

/* O cliente digita o código, ou toca em escanear — que aqui faz o que a
   câmera faria: entrega o código que está na tela do tatuador. */
function escanearCheckin(){
 if(!S.checkin.aberto){S.checkin.erro="Nenhum check-in aberto. Peça ao tatuador para abrir o dele.";render();return}
 S.checkinCod=S.checkin.codigo;
 confirmarCheckin();
}
function confirmarCheckin(){
 var digitado=(S.checkinCod||"").trim().toUpperCase();
 if(!S.checkin.aberto){S.checkin.erro="Nenhum check-in aberto agora.";render();return}
 if(digitado!==S.checkin.codigo){S.checkin.erro="Esse código não confere com nenhum check-in aberto.";render();return}
 S.checkin.erro=null;
 S.checkin.confirmado=true;
 S.checkin.quando=agoraHm();
 render();
}
function iniciarSessaoCheckin(){ S.checkin.inicio=Date.now(); render() }

 S.checkin.fim=Date.now();
 /* A sessão encerrada vira linha no passaporte do cliente, privada
    como todas. Guardá-la pública por padrão seria decidir por ele
    justamente no momento em que ele está menos disponível para
    decidir — acabou de levar quatro horas de agulha. */
 var b=S.checkin.sessao||BOOK[0];
 PASS.unshift({id:"pa"+Date.now(),quando:"hoje",ordem:PASS.length+1,artista:"Marina Vieira",arh:"@marinavtattoo",
  destaque:false,estudio:"Studio Marina",cidade:"São Paulo",uf:"SP",pais:"Brasil",continente:"América do Sul",
  estilo:"fineline",parte:b.area,horas:duracaoCheckin(),seed:31,verificado:true,publico:false});
 render();
}
function duracaoCheckin(){
 if(!S.checkin.inicio||!S.checkin.fim)return 0;
 return Math.max(0.1,(S.checkin.fim-S.checkin.inicio)/3600000);
}
function agoraHm(){
 var d=new Date();
 return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);
}
function horasBonitas(h){
 if(!h)return "—";
 var m=Math.round(h*60);
 return m<60 ? m+" min" : Math.floor(m/60)+"h"+(m%60?("0"+(m%60)).slice(-2):"");
}

/* ═══ MARCOS DO PASSAPORTE ═════════════════════════════════════════
   Derivados dos fatos, sempre no passado. Nenhuma regra aqui olha para
   frente: não existe "faltam", não existe "próximo nível", não existe
   contagem regressiva. Um marco só nasce depois de acontecer, e a data
   dele é a data da sessão que o produziu.

   É a diferença entre um álbum e uma cartela de bingo. */
function marcosDo(l){
 var m=[], vistos={}, paises={}, estilos={};
 var ordenado=l.slice().sort(function(a,b){return a.ordem-b.ordem});
 ordenado.forEach(function(t,i){
  if(i===0)m.push({ic:"✨",t:"A primeira",d:t.quando,p:"com "+t.artista+", em "+t.cidade});
  if(!estilos[t.estilo]){estilos[t.estilo]=1;
   if(i>0)m.push({ic:"🎨",t:"Primeira em "+(SL[t.estilo]||t.estilo),d:t.quando,p:"com "+t.artista});}
  if(!paises[t.pais]){paises[t.pais]=1;
   if(i>0)m.push({ic:"🌐",t:"Primeira vez em "+t.pais,d:t.quando,p:t.cidade+" · "+t.estudio});}
  if(t.destaque)m.push({ic:"⭐",t:"Tatuou com "+t.artista,d:t.quando,p:"perfil em destaque no catálogo"});
 });
 var n=ordenado.length;
 [5,10,25].forEach(function(marca){
  if(n>=marca)m.push({ic:"🕘",t:marca+" sessões",d:ordenado[marca-1].quando,p:"desde "+ordenado[0].quando});
 });
 var continentes={}; ordenado.forEach(function(t){continentes[t.continente]=1});
 var nc=Object.keys(continentes).length;
 if(nc>1)m.push({ic:"🌐",t:nc+" continentes",d:"",p:Object.keys(continentes).join(" · ")});
 return m.reverse();
}

/* ═══ REPUTAÇÃO VERIFICADA ═════════════════════════════════════════
   Quantas sessões daquele tatuador foram confirmadas por check-in.
   Diferente de avaliação: avaliação diz o que acharam, isto diz que
   aconteceu. Um perfil pode comprar elogio; não pode comprar duas
   pessoas presentes no mesmo lugar. */
function sessoesVerificadas(a){
 var base=(a.reviews||0);

/* ═══ PERSISTÊNCIA ═══════════════════════════════════════════════
   Até aqui um F5 apagava tudo: sessão, carrinho, seguidos, curtidas,
   progresso de cadastro e a própria tela. Num teste com gente de
   verdade isso não é incômodo, é perda de dado — a pessoa some do
   funil por um recarregamento e a leitura fica errada.

   Guardamos uma lista fechada de chaves, não o S inteiro: o estado
   também carrega o que veio do banco (artistas, preços, portfólio),
   que precisa ser buscado de novo e não sobreviver em cache velho. */
/* v2: o formato do estado mudou quando o cadastro virou três passos.
   Trocar a chave descarta o estado antigo em vez de restaurá-lo por
   cima do novo — um S.cad da versão anterior levaria a pessoa para um
   passo que não existe mais. */
var CHAVE_ESTADO="ink.estado.v2";
var GUARDA=["session","route","artist","tab","modo","seguindo","curtidas","cart",
 "cad","perfilLanding","abaPerfil","shopAud","shopCat","shopQ","evAba","q",
 "destaqueAtivo","roleSource","voltarPara","voltarArtista","abaModelo","histAba","sub","agendaGoogle","emailConfirmado","emailPendente","onbStep","onbName","onbStyles","onbEstudio","onbCidade","onbUf","onbInsta","usuario","fazCobertura","ehFornecedor",
 "notifFilter","pfTab","ue","f","feedLote","caro","cep","sqSel","orcPasso","passPub","checkin"];
// orcEnviado fica de fora de propósito: é a confirmação de uma ação que
// acabou de acontecer. Sobreviver à recarga faria a tela comemorar de
// novo um envio de ontem.
function salvarEstado(){
 try{var o={};GUARDA.forEach(function(k){if(S[k]!==undefined)o[k]=S[k]});
  // Senha em disco não. Ela sobrevive à recarga só enquanto a aba
  // estiver viva, e some junto com ela.
  if(o.cad)o.cad=Object.assign({},o.cad,{senha:""});
  localStorage.setItem(CHAVE_ESTADO,JSON.stringify(o))}catch(e){}
}
function restaurarEstado(){
 try{var o=JSON.parse(localStorage.getItem(CHAVE_ESTADO)||"{}");
  GUARDA.forEach(function(k){if(o[k]!==undefined)S[k]=o[k]})}catch(e){}
}
function limparEstado(){try{localStorage.removeItem(CHAVE_ESTADO)}catch(e){}}

/* A rota também mora na URL. Assim o botão voltar do navegador funciona,
   e um link colado leva a pessoa exatamente para onde você quer. */
function urlDaRota(){return "#/"+S.route+(S.route==="artist"?"/"+S.artist:"")}
function rotaDaURL(){
 try{
  var h=(location.hash||"").replace(/^#\/?/,"");
  if(!h)return null;
  var pe=h.split("/");
  return {rota:pe[0],artista:pe[1]||null};
 }catch(e){return null}
}
function aplicarURL(){
 var u=rotaDaURL();
 if(!u||!u.rota)return false;
 S.route=u.rota;
 if(u.artista)S.artist=u.artista;
 return true;
}

/* ── Barra de busca, filtros e ordenar ─────────────────────────────
   Um componente só, usado pelas três abas. O padrão foi definido em
   "encontrar tatuadores" e vale igual em lojas e eventos: campo de

var ORDENACOES=[["relevance","Relevância"],["price_asc","Menor preço"],["price_desc","Maior preço"],["rating","Melhor avaliação"],["distance","Mais próximos"]];

function barraBusca(cfg){

 }

  cfg.ordenacoes.forEach(function(o){

/* Geolocalização REAL do navegador. Não precisa de chave nem de conta —
   o navegador pede permissão e devolve as coordenadas.
   O que ainda falta para fechar a integração com o Google Maps:
     · transformar coordenada em endereço legível (geocodificação reversa)
     · buscar por endereço digitado
     · desenhar o mapa de verdade em vez da grade simulada
   Os três exigem chave da API e passam por servidor, para a chave não
   ficar exposta no navegador. Está anotado em decisoes/pendencias.md. */
function usarMinhaLocalizacao(){
 if(!navigator.geolocation){
  S.localErro="Este navegador não oferece geolocalização.";render();return;
 }
 S.buscandoLocal=true;S.localErro="";render();
 navigator.geolocation.getCurrentPosition(function(pos){
  S.local={lat:pos.coords.latitude,lng:pos.coords.longitude};
  S.localReal=true;
  S.localNome="Sua localização atual";
  S.precisao=Math.round(pos.coords.accuracy);
  S.buscandoLocal=false;S.feedLote=1;render();
 },function(err){
  S.buscandoLocal=false;
  S.localErro = err.code===1
   ? "Permissão negada. Você pode digitar a cidade no campo de busca."
   : "Não foi possível obter sua localização agora.";
  render();
 },{enableHighAccuracy:false,timeout:8000,maximumAge:300000});
}

 filtros+='</div>';

 var h=barraBusca({
  aba:"discover", q:f.q, placeholder:"Buscar tatuador, estúdio, cidade ou estilo…",
  onBusca:"S.f.q=this.value;renderFeedOnly()",

 });

function filteredArtists(){
 var f=S.f;
 var l=ARTISTS.filter(function(a){
  if(f.styles.length&&!a.styles.some(function(s){return f.styles.indexOf(s)>=0}))return false;
  if(f.q.trim()){var q=f.q.trim().toLowerCase();
   if((a.name+" "+a.studio+" "+a.city+" "+a.styles.map(function(s){return SL[s]}).join(" ")).toLowerCase().indexOf(q)<0)return false}
  return true});
 if(f.sort==="price_asc")l.sort(function(a,b){return a.min-b.min});
 if(f.sort==="price_desc")l.sort(function(a,b){return b.min-a.min});
 if(f.sort==="rating")l.sort(function(a,b){return b.rating-a.rating});
 if(f.sort==="distance")l.sort(function(a,b){return a.seed-b.seed});
 return l;
}
function feedList(){
 // Em modo real, o catálogo vem do banco. Se estiver vazio, dizer isso
 // com clareza é mais honesto do que preencher com gente que não existe.
 if(S.modo==="real"){
  if(S.reaisArtistas===null){
   carregarArtistasReais();
   return '<div class="card pad muted" style="margin-top:16px">Carregando do banco…</div>';
  }
  if(S.reaisArtistas.length===0){
   return '<div class="card pad" style="margin-top:16px"><div class="b">Nenhum tatuador cadastrado ainda.</div>'+
    '<div class="small muted" style="margin-top:5px">O banco está vazio — o que é esperado, ele foi criado hoje. Para ver o catálogo funcionando com dado real, crie uma conta de tatuador, preencha o perfil e publique.</div>'+
    '<div class="row" style="gap:8px;margin-top:11px"><button class="btn" onclick="go(\'conexao\')">Criar conta de teste</button>'+
    '<button class="btn" onclick="setModo(\'demo\')">Voltar para demonstração</button></div></div>';
  }
  var h='<div class="feedposts">';
  S.reaisArtistas.forEach(function(a){h+=publicacao(a)});
  return h+'</div>';
 }
 var l=filteredArtists();
 if(!l.length)return '<div class="card pad muted" style="margin-top:16px">Nenhum tatuador com esses filtros. Tente ampliar a faixa de preço ou remover algum estilo.</div>';

 // Destaque contratado sobe, e só. Não filtra ninguém e não esconde quem
 // não paga — por isso a etiqueta é obrigatória: sem ela o cliente lê a
 // ordem como mérito.
 l=l.slice().sort(function(x,y){return (y.destaque?1:0)-(x.destaque?1:0)});

 // Scroll infinito: mostra um lote por vez e cresce ao chegar no fim.
 // Uma publicação por vez cabe melhor na tela do celular que uma grade.
 var ate=Math.min(l.length,S.feedLote*3);
 var h='<div class="feedposts">';
 l.slice(0,ate).forEach(function(a){h+=publicacao(a)});
 h+='</div>';
 if(ate<l.length){
  h+='<div id="sentinela" class="row" style="justify-content:center;padding:22px 0"><span class="tiny muted">carregando mais…</span></div>';
 }else{
  h+='<div class="row" style="justify-content:center;padding:22px 0"><span class="tiny muted">Você viu tudo que combina com esses filtros.</span></div>';
 }
 return h;
}

/* Publicação: um tatuador por vez, com o portfólio como carrossel.
   Curtir foto e seguir tatuador alimentam o que a plataforma entende
   sobre o gosto da pessoa — e é isso que faz o orçamento chegar em quem
   realmente combina, em vez de em quem só bate o filtro. */
function publicacao(a){
 var i=S.caro[a.id]||0;
 var fotos=a.empty?[]:a.port.slice(0,6);
 var total=fotos.length;
 var segue=S.seguindo.indexOf(a.id)>=0;
 var chaveFoto=a.id+":"+i;
 var curtiu=S.curtidas.indexOf(chaveFoto)>=0;
 var nCurtidas=S.curtidas.filter(function(c){return c.indexOf(a.id+":")===0}).length;

 var h='<article class="post">';

 // Cabeçalho e detalhes juntos: quem é, quanto cobra e as ações. Assim a
 // decisão de clicar acontece antes da foto, e o card fica mais curto.
 h+='<div class="postinfo">';
 h+='<div class="row" style="gap:9px">';
 h+='<div class="av" style="width:34px;height:34px">'+ini(a.name)+'</div>';
 h+='<div style="min-width:0;flex:1"><div class="row" style="gap:5px"><span class="b small">'+a.name+(a.verified?' <span style="color:var(--accent)">✔</span>':'')+'</span>'+
   (a.destaque?'<span class="badge acc" title="Posição contratada. A plataforma cobra por destaque no catálogo.">Destaque</span>':'')+'</div>';
 h+='<div class="tiny muted">'+(a.studio?a.studio+' · ':'')+a.city+'/'+a.state+'</div></div>';
 h+='<button class="btn sm" onclick="go(\'artist\',\''+a.id+'\')">Perfil</button>';
 h+='<button class="btnseguir '+(segue?"on":"")+'" title="'+(segue?"Deixar de seguir":"Seguir este tatuador")+'" onclick="alternarSeguir(\''+a.id+'\')">'+
    (segue?'✓<span>Seguindo</span>':'👤<span>Seguir</span>')+'</button>';
 h+='</div>';

 h+='<div class="row wrapf" style="gap:5px;margin-top:9px">';
 h+=a.styles.map(function(s){return '<span class="badge">'+SL[s]+'</span>'}).join("");
 h+='<span class="tiny muted sp">★ '+a.rating+' ('+a.reviews+')</span></div>';
 /* Reputação antes do orçamento, e não depois. Avaliação diz o que
    acharam; sessão verificada diz que aconteceu — duas pessoas
    confirmaram uma à outra, no mesmo lugar, na hora. É o número que
    não dá para comprar, e por isso ele fica ao lado da estrela. */
 h+='<div class="tiny muted" style="margin-top:4px">'+
    '<span title="Sessões confirmadas por check-in das duas partes">✓ '+sessoesVerificadas(a)+' sessões verificadas</span>'+
    ' · '+kmDe(a)+' km de você</div>';

 h+='<div class="row" style="margin-top:7px">'+cifroes(a)+'<span class="tiny muted">por hora</span>';
 h+='<div class="row sp" style="gap:6px">';
 h+='<button class="btnicone'+(contaPendente()?" pendente":"")+'" title="Pedir orçamento" aria-label="Pedir orçamento" onclick="'+(contaPendente()?"explicarTrava(\'pedir orçamento\')":"quoteFor('"+a.id+"')")+'">👛</button>';
 h+='<button class="btnicone" title="Ver agenda" aria-label="Ver agenda" onclick="verAgenda(\''+a.id+'\')">🗓</button></div></div>';

 if(nCurtidas||segue){
  h+='<div class="tiny" style="margin-top:7px;color:var(--accent)">';
  var partes=[];
  if(segue)partes.push("seguindo");
  if(nCurtidas)partes.push(nCurtidas+" foto"+(nCurtidas>1?"s":"")+" salva"+(nCurtidas>1?"s":""));
  h+=partes.join(" · ")+' — deixa a recomendação mais precisa nos próximos orçamentos</div>';
 }
 h+='</div>';

 // Foto por último
 h+='<div class="postimg">';
 if(!total){
  h+='<div class="vazio"><span class="small b">Portfólio em construção</span><span class="tiny">O tatuador ainda não publicou fotos</span></div>';
 }else{
  fotos.forEach(function(p,k){h+='<div class="sl '+(k===i?"on":"")+'" style="background-image:'+tex(p)+'"></div>'});
  if(a.insta)h+='<span class="tagtl">Instagram</span>';
  if(i>0)h+='<button class="nav l" onclick="caro(\''+a.id+'\',-1,'+total+')">‹</button>';
  if(i<total-1)h+='<button class="nav r" onclick="caro(\''+a.id+'\',1,'+total+')">›</button>';
  h+='<button class="coracao '+(curtiu?"on":"")+'" title="'+(curtiu?"Salva":"Salvar esta foto")+'" onclick="alternarCurtida(\''+a.id+'\','+i+')">'+(curtiu?"♥":"♡")+'</button>';
  h+='<div class="pips">';for(var k=0;k<total;k++)h+='<i class="'+(k===i?"on":"")+'"></i>';h+='</div>';
 }
 h+='</div></article>';
 return h;
}

/* Converte a linha do banco para o formato que os cards já entendem.

function doBanco(a){
 var p=a.profiles||{};
 var estilos=(a.artist_styles||[]).map(function(s){return s.style_slug});
 var port=(a.portfolio_items||[]).map(function(x,i){return x.image_url||(i*7+3)});
 var cx=estilos.reduce(function(m,s){
  var e=STYLES.filter(function(x){return x.s===s})[0];
  return e&&e.c>m?e.c:m},2);
 return {id:a.profile_id,name:p.display_name||"Tatuador(a)",studio:a.studio_name||"",
  city:p.city||"",state:p.state||"",styles:estilos.length?estilos:["minimalista"],cx:cx,
  bio:p.bio||"",years:a.years_experience||0,
  rating:+(a.rating_avg||0)||5,reviews:a.rating_count||0,
  min:a.min_hourly_cents||(9000+cx*3500),max:a.max_hourly_cents||(9000+cx*3500+8000+cx*3000),
  verified:false,insta:!!a.instagram_handle,seed:(a.id||"").charCodeAt(0)||1,
  months:1,empty:port.length===0,port:port.length?port:[1,2,3,4,5,6,7,8,9]};
}

function verAgenda(id){S.agArtist=id;S.agDia=null;S.agHora=null;S.agFeito=false;openDrawer("agenda")}
function diasDaAgenda(a){
 var hoje=new Date(2026,6,26),r=[];
 for(var k=1;k<=24&&r.length<8;k++){
  var d=new Date(hoje.getTime()+k*86400000);
  if(d.getDay()===0)continue;                              // domingo fechado
  var q=(a.seed*7+k*13)%5;                                 // 0 a 4 horarios livres
  if(!q)continue;
  r.push({rot:d.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short"}).replace(/\./g,""),
          horas:["10:00","11:30","14:00","15:30","17:00"].slice(0,q)});
 }
 return r;
}

 h+='</div>';

 }
 h+='<button class="btn primary blk" style="margin-top:16px"'+(S.agHora?'':' disabled')+

/* Altura única para todo mapa da plataforma. Quando eventos tinha 170
   e cursos 210, trocar de aba mexia o chão sob a lista — e a pessoa
   perdia a referência de onde estava olhando. */
var ALT_MAPA=190;
/* O mesmo mapa serve eventos, cursos e pedidos de orçamento. O que
   muda entre eles é só quem está selecionado e o que o pino faz — por
   isso os dois entram como parâmetro em vez de virarem três mapas. */
function mapinha(pontos,alt,sel,acao){
 sel = sel!==undefined ? sel : S.evSel;
 acao = acao || "S.evSel='$id';render()";
 var h='<div class="mapa" style="height:'+(alt||ALT_MAPA)+'px">';
 pontos.slice(0,8).forEach(function(e,k){
  h+='<div class="pin '+(sel===e.id?"on":"")+'" style="left:'+e.x+'%;top:'+e.y+'%" onclick="'+acao.replace("$id",e.id)+'"><b>'+(k+1)+'</b></div>';
 });
 h+='<div class="pin voce" style="left:50%;top:50%"><b>◉</b></div>';
 h+='<div class="mapaselo">'+(S.localReal?"sua posição":"mapa simulado")+'</div>';
 h+='</div>';
 return h;
}

function listaCursos(){
 var c=COURSES.filter(function(x){
  if(S.coT!=="all"&&x.t!==S.coT)return false;
  if(S.coL!=="all"&&x.lv!==S.coL)return false;
  if(S.coP==="free"&&x.cost>0)return false;
  if(S.coP==="lt500"&&(x.cost===0||x.cost>=500))return false;
  if(S.coP==="gte500"&&x.cost<500)return false;
  if(S.coQ&&S.coQ.trim()&&(x.n+" "+x.who).toLowerCase().indexOf(S.coQ.trim().toLowerCase())<0)return false;
  return true});
 if(S.coSort==="price-asc")c.sort(function(a,b){return a.cost-b.cost});
 if(S.coSort==="price-desc")c.sort(function(a,b){return b.cost-a.cost});
 if(S.coSort==="spots")c.sort(function(a,b){return b.spots-a.spots});
 if(S.coSort==="name")c.sort(function(a,b){return a.n.localeCompare(b.n)});

 // Só os presenciais e híbridos têm lugar no mapa; os online aparecem
 // na lista, sem pino.
 var comLugar=c.filter(function(x){return x.t!=="Online"})
   .map(function(x,i){return {id:x.id,x:20+(i*17)%64,y:24+(i*23)%52}});

 });
 h+='</div>';

/* ═══ CADASTRO UNIFICADO ═══════════════════════════════════════════
   Um fluxo só para os três perfis. O primeiro passo cria a conta e
   pergunta quem é a pessoa; os passos seguintes mudam conforme a
   resposta. Antes havia dois fluxos separados — conta e onboarding de
   tatuador — e cliente não tinha nenhum. */

var PERFIS_CADASTRO=[
 {id:"cliente",icone:"👤",nome:"Cliente",desc:"Quero me tatuar, comprar e ir a eventos"},
 {id:"tatuador",icone:"🎨",nome:"Tatuador",desc:"Quero atender clientes e mostrar meu trabalho"},
 {id:"fornecedor",icone:"🏪",nome:"Fornecedor",desc:"Quero vender material para tatuadores",estado:"hipotese"}
];

/* Três passos, sempre. Antes o tatuador atravessava seis, e a maior
   parte da desistência acontecia no meio — passo que existe é passo que
   dá para abandonar.

   Passo 1 captura o mínimo para haver um lead: nome e e-mail. Mesmo
   quem some ali já deixou um contato.
   Passo 2 decide quem a pessoa é, e o resto do fluxo decorre disso.
   Passo 3 é um só, por perfil, e termina criando a conta. */
function roteiroCadastro(){
 var p=S.cad.perfil;
 var terceiro = p==="tatuador" ? {id:"tatuador",t:"Seu trabalho"}
              : p==="fornecedor" ? {id:"fornecedor",t:"Sua empresa"}
              : {id:"cliente",t:"O que você procura"};
 return [{id:"conta",t:"Seus dados"},{id:"perfil",t:"Quem é você aqui"},terceiro];
}

/* Nome de usuário: o que vira @ na plataforma e endereço do perfil.
   A lista de ocupados é fictícia — serve para a pessoa encontrar o
   atrito de verdade, que é descobrir que o nome que ela quer já foi. */
/* Espelha public.handles_reservados no banco (migração 21) mais alguns
   nomes "já usados" fictícios, para a pessoa esbarrar no atrito real de
   descobrir que o nome que ela queria já foi. Em modo real quem responde
   é o banco: Dados.usuarioDisponivel consulta a tabela e o índice único
   dá a palavra final. */
var USUARIOS_OCUPADOS=["admin","suporte","contato","ajuda","inkcreators","ink","oficial",
 "root","api","teste","tattoo","sobre","conta",
 "marina","bruno","ana"];
function usuarioValido(u){return /^[a-z0-9._]{3,20}$/.test(u||"")}
function usuarioLivre(u){return USUARIOS_OCUPADOS.indexOf((u||"").toLowerCase())<0}
function sugerirUsuario(nome){
 return (nome||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
   .replace(/[^a-z0-9]+/g,".").replace(/^\.+|\.+$/g,"").slice(0,20);
}
/* Entrar e criar conta são a mesma porta desde que o cadastro virou
   fluxo único. 'auth' continua respondendo só para não quebrar link
   antigo; nenhum botão aponta mais para lá.

   voltarPara guarda de onde a pessoa veio. Quem clicou em Conversar e
   foi mandada para o cadastro volta ao perfil do tatuador, não para a
   home — perder o contexto no meio do caminho é o que faz gente
   desistir. */
function irCadastro(perfil,voltar){
 S.cad={passo:0,perfil:perfil||null,nome:"",email:"",senha:"",usuario:"",msg:"",erro:false,viaGoogle:false};
 S.onbStep=1;

 /* Começar de novo começa limpo. Sem isto, quem desiste no passo 3 e
    recomeça encontra os estilos que já tinha marcado, a cidade que já
    tinha digitado — rascunho de uma tentativa que ela abandonou de
    propósito. Foi um teste do roteiro que encontrou: o segundo cadastro
    de tatuador já nascia com estilo escolhido. */
 S.onbStyles=[];S.onbEstudio="";S.onbCidade="";S.onbUf="";S.onbInsta="";
 S.fazCobertura=false;
 S.cli={estilos:[],cidade:"",uf:""};
 S.forn={nome:"",cnpj:"",site:"",cidade:"",cats:[],qtd:"",tambemTatuador:false};
 // Volta para onde a pessoa estava — menos quando ela estava na página
 // de venda. Devolver alguém que acabou de converter para o discurso de
 // conversão é o único caso em que retomar o contexto atrapalha.
 var origem = S.route;
 var naoVoltar = ["cadastro","auth","plataforma","gate"];
 S.voltarPara = voltar || (naoVoltar.indexOf(origem)<0 ? origem : null);
 S.voltarArtista = S.artist;
 go("cadastro");
}
function passoCad(){
 var r=roteiroCadastro();
 return r[Math.min(S.cad.passo,r.length-1)];
}
function podeAvancar(){
 var id=passoCad().id, c=S.cad;
 if(id==="conta")   return c.nome.trim().length>1 && /.+@.+\..+/.test(c.email) &&
                           (c.viaGoogle || (c.senha||"").length>=6);
 if(id==="perfil")  return !!c.perfil && usuarioValido(c.usuario) && usuarioLivre(c.usuario);
 if(id==="tatuador")return S.onbStyles.length>0;
 if(id==="fornecedor") return (S.forn.nome||"").trim().length>1;
 if(id==="cliente")    return (S.cli.cidade||"").trim().length>1 && /^[A-Z]{2}$/.test(S.cli.uf||"");
 return true;
}
function avancarCad(){
 var r=roteiroCadastro();
 if(S.cad.passo < r.length-1){S.cad.passo++;render()}
 else concluirCadastro();
}
function voltarCad(){
 if(S.cad.passo===1&&S.cad.viaGoogle){ trocarContaGoogle(); return }
 if(S.cad.passo>0){S.cad.passo--;render()}
}

function concluirCadastro(){
 var p=S.cad.perfil;

 /* Fornecedor que também tatua não fica na lista de espera: o lado
    tatuador existe de verdade, e é ele que dá à pessoa um lugar para
    onde ir. O papel de fornecedor fica marcado na mesma conta, e passa
    a valer quando o módulo existir. Duas contas para a mesma pessoa
    seria o pior dos dois mundos — nenhuma com o histórico inteiro. */
 if(p==="fornecedor"&&S.forn.tambemTatuador){
  S.ehFornecedor=true;
  p="tatuador";
  S.cad.perfil="tatuador";
 } else if(p==="fornecedor"){
  S.ehFornecedor=true;
  S.cad.msg="Fornecedor ainda não tem cadastro de verdade — não existe tabela nem cobrança. Você entrou numa lista de espera fictícia.";
  S.cad.erro=false;S.cad.passo=roteiroCadastro().length-1;render();return;
 }
 S.session = p==="tatuador" ? "artist" : "client";
 // Quem entrou pelo Google já tem origem registrada. Sobrescrever
 // apagaria a única pista de como a conta nasceu, que é o que a área de
 // gestão mostra em "origem".
 if(S.roleSource!=="google_oauth")S.roleSource="signup_trigger";
 S.usuario=S.cad.usuario;
 // Conta recém-criada nasce pendente: o e-mail acabou de sair e ninguém
 // clicou em nada ainda. É o estado real, e é o que a área de gestão
 // precisa mostrar.
 S.emailConfirmado=false;
 S.emailPendente=S.cad.email;
 S.reenvioMsg="";
 if(p==="tatuador"){
  // O nome de exibição é o nome da conta: perguntar duas vezes a mesma
  // coisa foi o que engordava o fluxo antigo.
  S.onbName=S.cad.nome;
  // Quem veio pelo lado fornecedor já disse empresa e cidade. Repetir a
  // pergunta seria o mesmo que pedir dois cadastros com outro nome.
  if(S.ehFornecedor){
   if(!S.onbEstudio)S.onbEstudio=S.forn.nome||"";
   if(!S.onbCidade)S.onbCidade=S.forn.cidade||"";
  }
  // Cobertura vira estilo só na hora de publicar: para o cliente que
  // busca, é um filtro como outro qualquer; para o tatuador, foi uma
  // pergunta separada.
  var estilosPublicados=S.onbStyles.slice();
  if(S.fazCobertura&&estilosPublicados.indexOf("cobertura")<0)estilosPublicados.push("cobertura");
  S.pf={nome:S.cad.nome,usuario:S.cad.usuario,estudio:S.onbEstudio,cidade:S.onbCidade,uf:S.onbUf,estilos:estilosPublicados,publicado:true};
  go("studio");
 }else if(S.voltarPara){
  var v=S.voltarPara,va=S.voltarArtista;S.voltarPara=null;
  go(v,va);
 }else{
  go("me");
 }
}

/* ── SUB-ABAS ──────────────────────────────────────────────────────
   O menu de cima tinha oito entradas e cada tela empilhava tudo num
   scroll só. Em vez de acrescentar uma nona, cada tela ganha um par de
   sub-abas: duas perguntas diferentes, dois conteúdos.

   Um mecanismo para todas, e não seis variações — assim a pessoa
   aprende o gesto uma vez. O componente é o mesmo do perfil público e
   já rola na horizontal quando não cabe; com dois itens, cabe sempre.

   O padrão de cada par é o mesmo: à esquerda o que exige ação agora, à
   direita o que é consulta. */
/* Um número grande, o que ele quer dizer, e para onde ir ver o detalhe.
   Todo cartão leva a algum lugar: número que não leva a lugar nenhum é
   enfeite, e enfeite em painel de gestão é ruído. */
function cartaoGrande(x){
 var ic=x[0], rot=x[1], val=x[2], nota=x[3], rota=x[4], chave=x[5], sub=x[6], alerta=x[7];
 /* Orçamentos tem passos dentro dele. Sem voltar para a lista, quem
    clicasse no número cairia na proposta que deixou pela metade —
    resposta errada para "quantos pedidos novos eu tenho?". */
 var zerar = chave==="orc" ? "S.orcPasso='lista';" : "";
 var acao=chave
   ? zerar+'S.sub=S.sub||{};S.sub.'+chave+'=\''+sub+'\';go(\''+rota+'\')'
   : 'go(\''+rota+'\')';
 var h='<button class="grande'+(alerta?" alerta":"")+'" onclick="'+acao+'">';
 /* Ícone e rótulo dividem a primeira linha. Empilhados, cada cartão
    ganhava uma linha inteira só de ícone — dez cartões, dez linhas
    desperdiçadas, e no iPad isso é uma rolagem a mais. */
 h+='<span class="gtopo"><span class="gic">'+ic+'</span><span class="grot">'+rot+'</span></span>';
 h+='<span class="gval">'+val+'</span>';
 h+='<span class="gnota">'+nota+'</span>';
 return h+'</button>';
}

/* O roteiro do onboarding é montado na hora. O passo 4 — modelo de
   orçamento — só entra se a pessoa tiver sinalizado interesse no passo 3.
   Assim quem só quer aparecer no catálogo faz 4 passos, não 5. */
function passosDoOnboarding(){
 var r=[{n:1,t:"Sobre você e seu estúdio"},{n:2,t:"Seus estilos"},{n:3,t:"Portfólio e redes"}];
 if(S.onbQuerOrcamento) r.push({n:4,t:"Modelo de orçamento"});
 r.push({n:5,t:"Revisar e publicar"});
 return r;
}
function passoSeguinte(st){
 var ns=passosDoOnboarding().map(function(p){return p.n});
 var i=ns.indexOf(st);
 return i>=0&&i<ns.length-1 ? ns[i+1] : st;
}
function passoAnterior(st){
 var ns=passosDoOnboarding().map(function(p){return p.n});
 var i=ns.indexOf(st);
 return i>0 ? ns[i-1] : st;
}
function irPasso(destino){
 S.onbStep=destino;
 render();
}

function subirModeloOrcamento(arquivos){
 if(!arquivos||!arquivos.length)return;
 var a=arquivos[0];
 if(!/\.xlsx?$/i.test(a.name)){
  S.onbErro=true;S.onbMsg="Só planilhas .xls ou .xlsx.";render();return;
 }
 if(a.size>2*1024*1024){
  S.onbErro=true;S.onbMsg="Planilha acima de 2 MB.";render();return;
 }
 // No protótipo só registramos o nome. Ler a planilha e extrair as faixas
 // de preço exige backend — está anotado como pendência.
 S.onbModeloArquivo=a.name;
 S.onbModelo="proprio";
 S.onbErro=false;S.onbMsg="";
 render();
}

   anos:S.onbAnos||null, instagram:S.onbInsta||null,

  });
  S.reaisArtistas=null;

  S.pf={nome:S.onbName,estudio:S.onbEstudio,cidade:S.onbCidade,uf:S.onbUf,estilos:S.onbStyles.slice(),publicado:true};
  go("studio");
 }catch(e){

 }
}

/* As médias saem das sessões com check-in, e só delas. Misturar sessão
   medida com sessão lembrada estragaria justamente o número que faz o
   check-in valer a pena. */
function desempenhoPorEstilo(){
 var m={};
 PASS.filter(function(t){return t.verificado}).forEach(function(t){
  var k=t.estilo;
  if(!m[k])m[k]={rotulo:SL[k]||k,n:0,soma:0,max:0};
  m[k].n++; m[k].soma+=t.horas; if(t.horas>m[k].max)m[k].max=t.horas;
 });
 return Object.keys(m).map(function(k){
  return {rotulo:m[k].rotulo,n:m[k].n,media:m[k].soma/m[k].n,max:m[k].max};
 }).sort(function(a,b){return b.media-a.media});
}
function lugaresDoCheckin(){
 var m={};
 PASS.filter(function(t){return t.verificado}).forEach(function(t){
  var k=t.estudio;
  if(!m[k])m[k]={lugar:k,cidade:t.cidade,pais:t.pais,n:0};
  m[k].n++;
 });
 return Object.keys(m).map(function(k){return m[k]}).sort(function(a,b){return b.n-a.n});
}

/* ── ORÇAMENTOS RECEBIDOS ───────────────────────────────────────────
   Três momentos, um de cada vez.

   1. Onde estão. Mapa e lista, o mesmo par de eventos e cursos. Não é
      enfeite: o tatuador decide diferente por quem está a 2 km e por
      quem está a 12, e essa informação chegava aqui como uma linha de
      texto que ninguém lia.
   2. O pedido. Lido como um card do feed — fotos em carrossel e o que
      a pessoa escreveu — porque é assim que ele já olha tatuagem o dia
      inteiro. Aqui não existe campo de valor: precificar antes de ver
      as referências é o erro que esta tela deveria impedir.
   3. A proposta. Valor e mensagem, e mais nada na tela. */
function recebidos(){
 var passo=S.orcPasso||"lista";
 if(passo==="proposta")return telaProposta(pedidoSel());
