function contarTrilho(el){
 var id=el.getAttribute("data-trilho");
 var alvo=document.getElementById("conta-"+id);
 if(!alvo)return;
 var card=el.firstElementChild;
 if(!card)return;
 var passo=card.offsetWidth+12;
 var i=Math.min(el.children.length,Math.round(el.scrollLeft/passo)+1);
 alvo.innerHTML='<b>'+String(i).padStart(2,"0")+'</b> / '+String(el.children.length).padStart(2,"0");
}

/* ═══ CADASTRO UNIFICADO ═══════════════════════════════════════════
   Um fluxo só para os três perfis. O primeiro passo cria a conta e
   pergunta quem é a pessoa; os passos seguintes mudam conforme a
   resposta. Antes havia dois fluxos separados — conta e onboarding de
   tatuador — e cliente não tinha nenhum. */

var PERFIS_CADASTRO=[
 {id:"cliente",icone:"👤",nome:"Cliente",desc:"Quero me tatuar, comprar e ir a eventos"},
 {id:"tatuador",icone:"🎨",nome:"Tatuador",desc:"Quero atender clientes e mostrar meu trabalho"},
 {id:"fornecedor",icone:"🏪",nome:"Fornecedor",desc:"Quero vender material para tatuadores",estado:"hipotese"}
];

/* Três passos, sempre. Antes o tatuador atravessava seis, e a maior
   parte da desistência acontecia no meio — passo que existe é passo que
   dá para abandonar.

   Passo 1 captura o mínimo para haver um lead: nome e e-mail. Mesmo
   quem some ali já deixou um contato.
   Passo 2 decide quem a pessoa é, e o resto do fluxo decorre disso.
   Passo 3 é um só, por perfil, e termina criando a conta. */
function roteiroCadastro(){
 var p=S.cad.perfil;
 var terceiro = p==="tatuador" ? {id:"tatuador",t:"Seu trabalho"}
              : p==="fornecedor" ? {id:"fornecedor",t:"Sua empresa"}
              : {id:"cliente",t:"O que você procura"};
 return [{id:"conta",t:"Seus dados"},{id:"perfil",t:"Quem é você aqui"},terceiro];
}

/* Nome de usuário: o que vira @ na plataforma e endereço do perfil.
   A lista de ocupados é fictícia — serve para a pessoa encontrar o
   atrito de verdade, que é descobrir que o nome que ela quer já foi. */
/* Espelha public.handles_reservados no banco (migração 21) mais alguns
   nomes "já usados" fictícios, para a pessoa esbarrar no atrito real de
   descobrir que o nome que ela queria já foi. Em modo real quem responde
   é o banco: Dados.usuarioDisponivel consulta a tabela e o índice único
   dá a palavra final. */
var USUARIOS_OCUPADOS=["admin","suporte","contato","ajuda","inkcreators","ink","oficial",
 "root","api","teste","tattoo","sobre","conta",
 "marina","bruno","ana"];
function usuarioValido(u){return /^[a-z0-9._]{3,20}$/.test(u||"")}
function usuarioLivre(u){return USUARIOS_OCUPADOS.indexOf((u||"").toLowerCase())<0}
function sugerirUsuario(nome){
 return (nome||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
   .replace(/[^a-z0-9]+/g,".").replace(/^\.+|\.+$/g,"").slice(0,20);
}
/* Entrar e criar conta são a mesma porta desde que o cadastro virou
   fluxo único. 'auth' continua respondendo só para não quebrar link
   antigo; nenhum botão aponta mais para lá.

   voltarPara guarda de onde a pessoa veio. Quem clicou em Conversar e
   foi mandada para o cadastro volta ao perfil do tatuador, não para a
   home — perder o contexto no meio do caminho é o que faz gente
   desistir. */
function irCadastro(perfil,voltar){
 S.cad={passo:0,perfil:perfil||null,nome:"",email:"",senha:"",usuario:"",msg:"",erro:false,viaGoogle:false};
 S.onbStep=1;

 /* Começar de novo começa limpo. Sem isto, quem desiste no passo 3 e
    recomeça encontra os estilos que já tinha marcado, a cidade que já
    tinha digitado — rascunho de uma tentativa que ela abandonou de
    propósito. Foi um teste do roteiro que encontrou: o segundo cadastro
    de tatuador já nascia com estilo escolhido. */
 S.onbStyles=[];S.onbEstudio="";S.onbCidade="";S.onbUf="";S.onbInsta="";
 S.fazCobertura=false;S.administraEstudio=false;
 S.cli={estilos:[],cidade:"",uf:""};
 S.forn={nome:"",cnpj:"",site:"",cidade:"",cats:[],qtd:"",tambemTatuador:false};
 // Volta para onde a pessoa estava — menos quando ela estava na página
 // de venda. Devolver alguém que acabou de converter para o discurso de
 // conversão é o único caso em que retomar o contexto atrapalha.
 var origem = S.route;
 var naoVoltar = ["cadastro","auth","plataforma","gate"];
 S.voltarPara = voltar || (naoVoltar.indexOf(origem)<0 ? origem : null);
 S.voltarArtista = S.artist;
 go("cadastro");
}
function passoCad(){
 var r=roteiroCadastro();
 return r[Math.min(S.cad.passo,r.length-1)];
}
/* ═══ REGRA DE SENHA ════════════════════════════════════════════════
   Espelho do que está configurado no painel do Supabase, em
   Authentication → Sign In / Providers → Email.

   ELA VIVE AQUI, NUMA CONSTANTE SÓ, POR UM MOTIVO
   O banco é quem recusa a senha fraca — a tela só antecipa a recusa. Se
   os dois discordarem, o pior caso não é a tela ser rígida demais: é
   ela ser frouxa demais. A pessoa digita, lê "✓ Senha válida", clica em
   criar conta, e o servidor recusa no fim. Erro que aparece depois de
   tudo preenchido, sem dizer o que fazer.

   Estava assim até 16/08/2026: a tela pedia 6 e o painel também. O
   painel subiu para 8 e a tela ficou para trás por alguns minutos —
   este bloco existe para que da próxima vez a correção seja uma linha.

   SE VOCÊ MUDAR O PAINEL, MUDE AQUI
   O Supabase oferece três níveis de "required characters":
     · letras e números                       → precisaLetra + precisaNumero
     · minúscula, maiúscula e números         → + precisaMaiuscula
     · minúscula, maiúscula, números, símbolo → + precisaSimbolo
   Ligue o que estiver marcado lá. O diagnóstico confere a coerência
   interna, mas não consegue ler o painel por você. */
var REGRA_SENHA = {
 min: 8,
 precisaLetra: true,
 precisaNumero: true,
 precisaMaiuscula: false,
 precisaSimbolo: false
};

/* Devolve a lista do que ainda falta, em ordem de leitura. Lista vazia
   quer dizer senha aceita. Devolver o que falta — e não um sim/não —
   é o que permite a dica ser específica em vez de dizer "senha fraca". */
function faltaNaSenha(v){
 v = v || "";
 var falta = [];
 if (v.length < REGRA_SENHA.min) falta.push((REGRA_SENHA.min - v.length) + " caractere" + (REGRA_SENHA.min - v.length > 1 ? "s" : ""));
 if (REGRA_SENHA.precisaLetra    && !/[a-zA-Z]/.test(v)) falta.push("uma letra");
 if (REGRA_SENHA.precisaNumero   && !/[0-9]/.test(v))    falta.push("um número");
 if (REGRA_SENHA.precisaMaiuscula&& !/[A-Z]/.test(v))    falta.push("uma maiúscula");
 if (REGRA_SENHA.precisaSimbolo  && !/[^a-zA-Z0-9]/.test(v)) falta.push("um símbolo");
 return falta;
}
function senhaValida(v){ return faltaNaSenha(v).length === 0 }

/* O texto do campo, montado da mesma constante. Escrever "mínimo 8" à
   mão criaria um terceiro lugar para esquecer de atualizar. */
function textoRegraSenha(){
 var p = ["mínimo " + REGRA_SENHA.min + " caracteres"];
 if (REGRA_SENHA.precisaLetra && REGRA_SENHA.precisaNumero) p.push("com letra e número");
 if (REGRA_SENHA.precisaMaiuscula) p.push("e maiúscula");
 if (REGRA_SENHA.precisaSimbolo) p.push("e símbolo");
 return p.join(", ");
}

function podeAvancar(){
 var id=passoCad().id, c=S.cad;
 if(id==="conta")   return c.nome.trim().length>1 && /.+@.+\..+/.test(c.email) &&
                           (c.viaGoogle || senhaValida(c.senha));
 if(id==="perfil")  return !!c.perfil && usuarioValido(c.usuario) && usuarioLivre(c.usuario);
 if(id==="tatuador")return S.onbStyles.length>0;
 if(id==="fornecedor") return (S.forn.nome||"").trim().length>1;
 if(id==="cliente")    return (S.cli.cidade||"").trim().length>1 && /^[A-Z]{2}$/.test(S.cli.uf||"");
 return true;
}
function avancarCad(){
 var r=roteiroCadastro();
 if(S.cad.passo < r.length-1){S.cad.passo++;render()}
 else concluirCadastro();
}
function voltarCad(){
 if(S.cad.passo===1&&S.cad.viaGoogle){ trocarContaGoogle(); return }
 if(S.cad.passo>0){S.cad.passo--;render()}
}

function concluirCadastro(){
 var p=S.cad.perfil;

 /* Fornecedor que também tatua não fica na lista de espera: o lado
    tatuador existe de verdade, e é ele que dá à pessoa um lugar para
    onde ir. O papel de fornecedor fica marcado na mesma conta, e passa
    a valer quando o módulo existir. Duas contas para a mesma pessoa
    seria o pior dos dois mundos — nenhuma com o histórico inteiro. */
 if(p==="fornecedor"&&S.forn.tambemTatuador){
  S.ehFornecedor=true;
  p="tatuador";
  S.cad.perfil="tatuador";
 } else if(p==="fornecedor"){
  S.ehFornecedor=true;
  S.cad.msg="Fornecedor ainda não tem cadastro de verdade — não existe tabela nem cobrança. Você entrou numa lista de espera fictícia.";
  S.cad.erro=false;S.cad.passo=roteiroCadastro().length-1;render();return;
 }
 S.session = p==="tatuador" ? "artist" : "client";
 // Quem entrou pelo Google já tem origem registrada. Sobrescrever
 // apagaria a única pista de como a conta nasceu, que é o que a área de
 // gestão mostra em "origem".
 if(S.roleSource!=="google_oauth")S.roleSource="signup_trigger";
 S.usuario=S.cad.usuario;
 // Conta recém-criada nasce pendente: o e-mail acabou de sair e ninguém
 // clicou em nada ainda. É o estado real, e é o que a área de gestão
 // precisa mostrar.
 S.emailConfirmado=false;
 S.emailPendente=S.cad.email;
 S.reenvioMsg="";
 if(p==="tatuador"){
  // O nome de exibição é o nome da conta: perguntar duas vezes a mesma
  // coisa foi o que engordava o fluxo antigo.
  S.onbName=S.cad.nome;
  // Quem veio pelo lado fornecedor já disse empresa e cidade. Repetir a
  // pergunta seria o mesmo que pedir dois cadastros com outro nome.
  if(S.ehFornecedor){
   if(!S.onbEstudio)S.onbEstudio=S.forn.nome||"";
   if(!S.onbCidade)S.onbCidade=S.forn.cidade||"";
  }
  // Cobertura vira estilo só na hora de publicar: para o cliente que
  // busca, é um filtro como outro qualquer; para o tatuador, foi uma
  // pergunta separada.
  var estilosPublicados=S.onbStyles.slice();
  if(S.fazCobertura&&estilosPublicados.indexOf("cobertura")<0)estilosPublicados.push("cobertura");
  S.pf={nome:S.cad.nome,usuario:S.cad.usuario,estudio:S.onbEstudio,cidade:S.onbCidade,uf:S.onbUf,estilos:estilosPublicados,publicado:true};
  go("studio");
 }else if(S.voltarPara){
  var v=S.voltarPara,va=S.voltarArtista;S.voltarPara=null;
  go(v,va);
 }else{
  go("me");
 }
}

 var r=roteiroCadastro(), passo=passoCad(), i=S.cad.passo, c=S.cad;
 var h='<main><div class="wrap" style="max-width:620px">';

/* ── Aviso ao vivo, sem redesenhar ────────────────────────────────

   id próprio e só eles são reescritos.

   As funções servem aos dois momentos — o desenho inicial e a
   atualização — para o texto não existir em duas versões. */
function contaEstilos(){
 var n=S.onbStyles.length;
 if(!n)return "Nenhum estilo selecionado ainda.";
 return n===1 ? "1 estilo selecionado" : n+" estilos selecionados";
}
function dicaSenha(){
 var v=S.cad.senha||"";
 if(!v)return "";
 var falta=faltaNaSenha(v);
 if(!falta.length)return '<span style="color:var(--x-success)">✓ Senha válida</span>';
 /* Diz exatamente o que falta. "Senha fraca" manda a pessoa adivinhar,
    e adivinhar num campo mascarado é pior ainda. */
 var t = falta.length===1 ? falta[0]
       : falta.slice(0,-1).join(", ") + " e " + falta[falta.length-1];
 return '<span class="muted">Falta '+t+'</span>';
}
function dicaUsuario(){
 var u=S.cad.usuario||"", sug=sugerirUsuario(S.cad.nome);
 if(!u) return sug ? '<span class="muted">Sugestão: <a style="color:var(--accent);cursor:pointer" onclick="S.cad.usuario=\''+sug+'\';render()">@'+sug+'</a></span>' : "";
 if(!usuarioValido(u)) return '<span style="color:var(--x-danger)">Use de 3 a 20 caracteres, só letras, números, ponto e traço baixo.</span>';
 if(!usuarioLivre(u))  return '<span style="color:var(--x-danger)">Esse nome já está em uso. Tente outro.</span>';
 return '<span style="color:var(--x-success)">✓ Disponível — seu perfil fica em ink.creators/@'+u+'</span>';
}

 if(S.modo!=="real"){
  S.reenvioMsg="Em demonstração nada é enviado de verdade. No modo real, o link sai para o seu e-mail.";
  render();return;
 }
 S.reenviando=true;S.reenvioMsg="";render();
 window.Dados.reenviarConfirmacao(S.emailPendente).then(function(alvo){
  S.reenviando=false;S.reenvioMsg="Enviado de novo para "+alvo+". Olhe também o lixo eletrônico.";render();
 }).catch(function(e){
  S.reenviando=false;S.reenvioMsg=e.message||String(e);render();
 });
}

function conferirConfirmacao(){
 if(S.modo!=="real"){
  S.emailConfirmado=true;S.reenvioMsg="";render();return;
 }
 window.Dados.emailConfirmado().then(function(c){
  if(c){S.emailConfirmado=true;S.reenvioMsg="";}
  else S.reenvioMsg="Ainda consta como não confirmado. Se você acabou de clicar, espere alguns segundos e tente de novo.";
  render();
 }).catch(function(e){S.reenvioMsg=e.message||String(e);render()});
}

/* ── ENTRADA PELO GOOGLE ───────────────────────────────────────────
   Antes o Google levava para uma tela própria, com lista vertical, só
   para perguntar o perfil — e depois jogava a pessoa no passo 2, que
   perguntava a mesma coisa com outro componente. Duas telas, dois
   desenhos, uma pergunta.

   Agora o Google preenche o que ele sabe (nome e e-mail) e entrega a
   pessoa no passo 2, o mesmo do caminho por e-mail: mesmos cartões,
   mesmo campo de usuário, mesmo rodapé. */
function entrarComGoogle(){
 // No produto real isto seria o retorno do OAuth. Aqui, o que ele
 // devolveria: nome e e-mail verificados, e nada mais.
 S.cad.viaGoogle=true;
 S.cad.nome=S.cad.nome||"Amanda Noronha";
 S.cad.email=S.cad.email||"amanda.noronha@gmail.com";
 S.cad.senha="";                 // não existe senha nesse caminho
 S.cad.passo=1;
 S.roleSource="google_oauth";
 go("cadastro");
}
function trocarContaGoogle(){
 S.cad.viaGoogle=false;
 S.cad.nome="";S.cad.email="";S.cad.senha="";S.cad.usuario="";
 S.cad.passo=0;
 render();
}

/* ============ SHELL me/studio ============ */
/* Cinco abas viram três. Orçamentos e pagamentos são o que a pessoa
   faz e o que ela pagou por isso — as duas pontas de uma coisa só, e
   ambas curtas. Empilhadas na visão geral, deixam de exigir que se
   escolha entre elas antes de saber o que se procura.

   Passaporte e Formação continuam abas: um é acervo de corpo, o outro
   é trilha de aprendizado. Nenhum dos dois se lê de passagem. */
var ME_NAV=[["me","Visão geral","▦"],["me-passaporte","Passaporte","🌐"],["me-formacao","Formação","📋"]];
/* ── SUB-ABAS ──────────────────────────────────────────────────────
   O menu de cima tinha oito entradas e cada tela empilhava tudo num
   scroll só. Em vez de acrescentar uma nona, cada tela ganha um par de
   sub-abas: duas perguntas diferentes, dois conteúdos.

   Um mecanismo para todas, e não seis variações — assim a pessoa
   aprende o gesto uma vez. O componente é o mesmo do perfil público e
   já rola na horizontal quando não cabe; com dois itens, cabe sempre.

   O padrão de cada par é o mesmo: à esquerda o que exige ação agora, à
   direita o que é consulta. */
/* Um número grande, o que ele quer dizer, e para onde ir ver o detalhe.
   Todo cartão leva a algum lugar: número que não leva a lugar nenhum é
   enfeite, e enfeite em painel de gestão é ruído. */
function cartaoGrande(x){
 var ic=x[0], rot=x[1], val=x[2], nota=x[3], rota=x[4], chave=x[5], sub=x[6], alerta=x[7];
 /* Orçamentos tem passos dentro dele. Sem voltar para a lista, quem
    clicasse no número cairia na proposta que deixou pela metade —
    resposta errada para "quantos pedidos novos eu tenho?". */
 var zerar = chave==="orc" ? "S.orcPasso='lista';" : "";
 /* Se o destino é uma página empilhada, o cartão rola até a seção. */
 var empilhada = typeof SECOES_DA_GESTAO!=="undefined" && SECOES_DA_GESTAO[rota] &&
                 SECOES_DA_GESTAO[rota].some(function(x){return x[0]===chave&&x[1]===sub});
 var acao=chave
   ? (empilhada
       ? zerar+'irSecao(\''+rota+'\',\''+chave+'\',\''+sub+'\')'
       : zerar+'S.sub=S.sub||{};S.sub.'+chave+'=\''+sub+'\';go(\''+rota+'\')')
   : 'go(\''+rota+'\')';
 var h='<button class="grande'+(alerta?" alerta":"")+'" onclick="'+acao+'">';
 /* Ícone e rótulo dividem a primeira linha. Empilhados, cada cartão
    ganhava uma linha inteira só de ícone — dez cartões, dez linhas
    desperdiçadas, e no iPad isso é uma rolagem a mais. */
 h+='<span class="gtopo"><span class="gic">'+ic+'</span><span class="grot">'+rot+'</span></span>';
 h+='<span class="gval">'+val+'</span>';
 h+='<span class="gnota">'+nota+'</span>';
 return h+'</button>';
}

function subAba(chave, padrao){
 return (S.sub&&S.sub[chave])||padrao;
}
/* Recorte da MESMA lista, e por isso pastilha e não aba. Aba promete
   outro destino; pastilha promete a mesma coisa vista de outro jeito.
   Usar aba para as duas é o que faz uma aba grande virar depósito. */
function chipsInternos(chave, opcoes, padrao){
 /* A pastilha de eventos filtra a mesma lista que agora virou duas
    seções: ela repetiria o que a seção já diz. A de avaliações fica,
    porque ali é filtro de verdade dentro de uma seção só. */
 if(montandoSecoes&&chave==="ev")return "";
 var atual=subAba(chave,padrao||opcoes[0][0]);
 var h='<div class="row wrapf" style="gap:var(--e2);margin-top:var(--e3)">';
 opcoes.forEach(function(o){
  var marca=o[2]?' <span class="selo">'+o[2]+'</span>':'';
  h+='<button class="chip '+(atual===o[0]?"on":"")+'" onclick="S.sub=S.sub||{};S.sub[\''+chave+'\']=\''+o[0]+'\';render()">'+o[1]+marca+'</button>';
 });
 return h+'</div>';
}
function abasInternas(chave, opcoes, padrao){
 if(montandoSecoes)return "";
 var atual=subAba(chave,padrao||opcoes[0][0]);
 var h='<div class="segmento">';
 opcoes.forEach(function(o){
  var marca=o[2]?'<span class="selo">'+o[2]+'</span>':'';
  var zerar = chave==="orc" ? "S.orcPasso='lista';" : "";
  h+='<button class="seg '+(atual===o[0]?"on":"")+'" onclick="'+zerar+'S.sub=S.sub||{};S.sub[\''+chave+'\']=\''+o[0]+'\';render()">'+o[1]+marca+'</button>';
 });
 return h+'</div>';
}

/* ═══ A BARRA DO TATUADOR ══════════════════════════════════════════
   Eram nove abas, e nove abas diziam que o ofício tem nove assuntos.
   Não tem. Quatro pares mostravam a mesma coisa duas vezes:

     check-in/agora  ≈  agenda/mês        as mesmas sessões
     caixa/lançam.   ≈  histórico/pessoas as mesmas pessoas e o mesmo dinheiro
     check-in/desemp.≈  histórico/estúdios os mesmos lugares
     eventos/participo ≈ histórico/estúdios a mesma convenção

   Cinco abas agora, agrupadas por momento do dia de quem tatua:
   o que é hoje, quem está pedindo, quando vai ser, quanto entrou, e
   por que confiar em mim. Nenhuma tela sumiu — todas viraram sub-aba
   de uma dessas cinco.

   "Meu perfil" saiu da barra: configuração não é superfície de
   trabalho, e ocupava um dos nove lugares como se fosse. Foi para o
   menu da conta, que é onde as pessoas já procuram. */
/* "Hoje" virou "Visão geral" pelo mesmo motivo que o cliente tem uma:
   duas áreas com a mesma função e nomes diferentes obrigam a
   reaprender a ler ao trocar de papel — e a mesma pessoa troca, porque
   quem tatua também é cliente.

   Ela absorveu Orçamentos e Dinheiro. O painel de números grandes no
   topo deixa de ser um resumo que aponta para outras abas e passa a
   ser o índice desta página: cada cartão rola até a sua seção. */
/* Seis abas. Financeiro nasceu a pedido dela: Dinheiro e Lançamentos
   eram seções da Visão geral, e a Visão geral ficava com quatro
   assuntos — o painel, o caixa, o extrato e as pessoas. Dinheiro é
   uma pergunta inteira, não um pedaço da primeira tela.

   E "Quem eu tatuei" foi para a Agenda pela mesma lógica: quem já
   sentou na sua cadeira e quem vai sentar são a mesma matéria, lida
   em duas direções. */
var ST_NAV=[["studio","Visão geral","▦"],["studio-quotes","Orçamentos","📥"],["studio-schedule","Agenda","🗓"],["studio-financeiro","Financeiro","👛"],["studio-reputacao","Reputação","★"],["studio-eventos","Cursos e eventos","🎟"]];

/* ═══ UMA FAIXA DE NAVEGAÇÃO, NÃO DUAS ════════════════════════════
   Eram cinco abas em cima e até quatro sub-abas embaixo: dezoito
   lugares para clicar, e metade do conteúdo escondido atrás do
   segundo clique.

   Agora cada aba é uma página que rola, com as partes em sequência.
   Num painel de gestão rolar é mais barato que esconder — e comparar
   duas coisas exige vê-las juntas, o que sub-aba impede por
   construção.

   A tabela abaixo é a única definição de quais partes tem cada aba, e
   em que ordem. Os blocos de código não mudaram: continuam sendo
   escritos como se cada parte fosse uma sub-aba, e esta montagem os
   empilha. */
/* O quarto item é o contador que vivia no selo da sub-aba. Ele não
   podia sumir junto com a barra: era o que dizia onde olhar antes de
   olhar. Agora fica ao lado do título da seção, que é ainda mais
   perto do que ele conta. */
var SECOES_DA_GESTAO={
 "me":               [["mev","resumo","Visão geral"],
                      ["mev","sessoes","Minhas sessões",function(){return minhasSessoes().length}],
                      ["mev","quotes","Meus orçamentos",function(){return CQ.filter(function(q){return q.status==="respondido"}).length}],
                      ["mev","payments","Pagamentos",function(){return PAYS.length}]],
 /* Uma chave só para a página inteira. Com chaves separadas por bloco,
    a seção de orçamentos herdaria o valor de "hoje" da seção anterior e
    o check-in sairia duas vezes. */
 /* Orçamentos voltou a ser aba: é o único lugar da gestão com um
    fluxo de três passos dentro — mapa, pedido, proposta — e fluxo com
    passos não convive com página que rola, porque a pessoa perde de
    vista em que passo está. Dinheiro fica, porque é leitura. */
 /* A Visão geral ficou sem seções: é uma tela só, o painel. Sem
    entrada aqui, paginaDeGestao devolve a página direto e nenhum
    trilho é emitido — que é o certo, porque trilho de uma peça só é
    um botão que não leva a lugar nenhum. */
 "studio-financeiro":[["fin","dinheiro","Dinheiro"],
                      ["fin","lancamentos","Lançamentos",function(){return LANC.length}]],
 /* O check-in mora na agenda porque é a mesma matéria: sessão marcada.
    Estava na visão geral, e ali obrigava a pessoa a sair da agenda —
    onde ela acabou de ver a sessão — para abrir o QR daquela sessão. */
 /* Orçamentos NÃO entra aqui de propósito. Recebidos tem um fluxo de
    três passos dentro — mapa, pedido, proposta — e empilhar a lista de
    enviados embaixo dele deixa a pessoa rolando por um segundo assunto
    no meio de uma decisão que ainda não terminou. Aqui o alternador é o
    componente certo: são dois destinos, não duas partes de um. */
 /* A ordem é dela, e inverte a de antes: agendado primeiro. A chave
    "mes" virou "agendado" porque o conteúdo deixou de ser sobre o mês
    e passou a ser sobre o que está marcado — chave que descreve outra
    coisa que o rótulo é onde nasce o próximo engano. */
 "studio-schedule":  [["ag","agendado","Agendado"],
                      ["ag","pessoas","Quem eu tatuei",function(){return HIST_PESSOAS.length}],
                      ["ag","sessoes","Próximas sessões",function(){return BOOK.length}]],
 /* "Desempenho por estilo" saiu a pedido dela. Ver a decisão 032:
    das duas coisas que moravam ali, uma era cópia de "Onde eu tatuei"
    com outra fonte de dados, e a outra — a tabela de duração medida —
    era o único lugar do produto onde o relógio do check-in virava
    número. */
 "studio-reputacao": [["rep","avaliacoes","Avaliações",function(){return REVS.filter(function(r){return !r.resp}).length}],
                      ["rep","estudios","Onde eu tatuei"]],
 "studio-eventos":   [["ev","meus","Que eu criei"],["ev","participo","Que eu participo"]],
 "forn-recomendacoes":[["fr","recebidas","Recebidas"],["fr","pedir","Pedir"]],
 "forn-embaixadores": [["fe","convites","Convites"],["fe","ativos","Ativos"]],
 "forn-loja":         [["fl","produtos","Produtos"],["fl","pedidos","Pedidos"]]
};

/* Enquanto a página empilhada é montada, as barras de sub-aba se
   calam: elas seriam desenhadas uma vez por seção. */
var montandoSecoes=false;

var G_ABRE='<main><div class="wrap">', G_FECHA='</div></main>';

/* Recorte por marcador é frouxo por natureza. Por isso ele avisa em
   vez de devolver lixo — e existe um diagnóstico que sabota o
   marcador para provar que o aviso aparece. */
function corpoDaGestao(pagina){
 var i=pagina.indexOf(G_ABRE);
 if(i<0)return null;
 var corpo=pagina.slice(i+G_ABRE.length);
 if(corpo.slice(-G_FECHA.length)===G_FECHA)corpo=corpo.slice(0,-G_FECHA.length);
 return corpo;
}

function idDaSecao(chave,valor){ return "sec-"+chave+"-"+valor }

/* Alguns blocos são da PÁGINA, não da seção: banner de convite, aviso
   de que a área é proposta, cabeçalho. Como a montagem renderiza a
   página inteira uma vez por seção, sem esta pergunta eles saem
   repetidos — três convites idênticos empilhados.

   Use assim:  if(naPrimeiraSecao(sub)) h+= ...o preâmbulo... */
/* Com seções empilhadas, a página era renderizada uma vez por seção e
   o preâmbulo saía repetido — daí esta função. Com o toggle existe uma
   renderização por visita, e o preâmbulo pertence à aba inteira: ele
   tem de aparecer em qualquer recorte.

   A função fica, e as chamadas ficam: se as seções voltarem a
   empilhar, o problema volta junto e é aqui que se resolve. */
function naPrimeiraSecao(rota){ return true }

function tituloDeSecao(txt,primeira,conta,id){
 var selo=(conta||conta===0)&&conta!==""&&conta!==0 ? '<span class="selo">'+conta+'</span>' : '';
 return '<div class="secg'+(primeira?' pri':'')+'"'+(id?' id="'+id+'"':'')+'><h2 class="secgt">'+txt+'</h2>'+selo+'</div>';
}

/* Antes o cartão do painel trocava de aba. Agora a aba é a mesma e o
   que muda é onde a página está — então ele rola até a seção em vez de
   parecer que não fez nada. */
function irSecao(rota,chave,valor){
 S.sub=S.sub||{}; S.sub[chave]=valor;
 go(rota);
 try{
  var el=document.getElementById(idDaSecao(chave,valor));
  if(el&&el.scrollIntoView)el.scrollIntoView({behavior:"smooth",block:"start"});
 }catch(e){}
}

/* ── UMA SEÇÃO POR VEZ, COM TOGGLE ────────────────────────────────
   Antes as seções vinham empilhadas: uma página que rola. O argumento
   era bom — "num painel de gestão rolar é mais barato que esconder" —
   e ele se sustenta com duas ou três seções. Com sete, a Visão geral
   virava uma parede de dois metros, e o custo de rolar passou a ser
   maior que o de um clique.

   O toggle resolve as duas coisas de uma vez: mostra QUANTAS partes a
   aba tem (que é o que a rolagem escondia — você só descobria o fim
   chegando nele) e leva a qualquer uma delas sem percorrer as outras.

   O componente é o mesmo que a Amanda pediu de volta na decisão 020, e
   pela mesma razão: ele diz "você continua aqui, vendo de outro jeito",
   que é exatamente o que uma seção é. */
function paginaDeGestao(rota,render1){
 var secoes=SECOES_DA_GESTAO[rota];
 if(!secoes)return render1(rota);
 var chave=secoes[0][0];
 var ativa=subAba(chave,secoes[0][1]);
 /* Valor guardado que não é mais seção — porque a arquitetura mudou —
    volta para a primeira em vez de mostrar tela vazia. */
 if(!secoes.some(function(x){return x[1]===ativa}))ativa=secoes[0][1];

 var guardado=JSON.stringify(S.sub||{});
 S.sub=S.sub||{}; S.sub[chave]=ativa;
 var pg;
 montandoSecoes=true;
 try{ pg=render1(rota) } finally{ montandoSecoes=false }

 var i=pg.indexOf(G_ABRE);
 if(i<0){ S.sub=JSON.parse(guardado); return render1(rota) }

 var trilho='<div class="segmento">';
 secoes.forEach(function(sc){
  var conta="";
  if(typeof sc[3]==="function"){ try{ conta=sc[3]() }catch(e){ conta="" } }
  var marca=(conta||conta===0)&&conta!==""&&conta!==0 ? '<span class="selo">'+conta+'</span>' : '';
  trilho+='<button class="seg '+(ativa===sc[1]?"on":"")+'" onclick="S.sub=S.sub||{};S.sub[\''+chave+'\']=\''+sc[1]+'\';render()">'+sc[2]+marca+'</button>';
 });
 trilho+='</div>';

 return pg.slice(0,i+G_ABRE.length) + trilho + pg.slice(i+G_ABRE.length);
}


/* Rotas antigas continuam válidas. S.route é gravado no localStorage e
   no endereço: quem tinha "studio-events" guardado cairia numa tela em
   branco, e tela em branco parece produto quebrado. */
var ST_ROTA_ANTIGA={
 /* Apontava para ["studio","vg","checkin"], e as duas metades do
    destino morreram: a chave vg sumiu quando a Visão geral deixou de
    ter seções, e "checkin" já não era seção desde que o QR passou a
    abrir dentro da linha da sessão.

    Resultado: quem entrasse pela rota antiga caía na Visão geral com
    o corpo VAZIO — só o cabeçalho. A tradução existia, apontava para
    lugar nenhum, e nada acusava porque tradução de rota não é texto
    nem componente: é ligação. O check-in mora na agenda, com as
    sessões. */
 "studio-checkin":  ["studio-schedule",  "ag","sessoes"],
 "studio-caixa":    ["studio-financeiro","fin","dinheiro"],
 "studio-historico":["studio-reputacao", "rep", "estudios"],
 "studio-events":   ["studio-eventos",   "ev",  "meus"],
 "studio-reviews":  ["studio-reputacao", "rep", "avaliacoes"]
};
function traduzirRotaAntiga(r){
 var t=ST_ROTA_ANTIGA[r];
 if(!t)return r;
 /* Histórico tinha duas metades que foram para abas diferentes: quem
    eu tatuei virou Dinheiro, onde eu tatuei virou Reputação. */
 if(r==="studio-historico"&&subAba("hist","pessoas")==="pessoas"){
  S.sub=S.sub||{};S.sub.ag="pessoas";return "studio-schedule";
 }
 S.sub=S.sub||{};S.sub[t[1]]=t[2];
 return t[0];
}

/* ═══ CAIXA E HISTÓRICO ════════════════════════════════════════════
   As duas telas que sustentam "tudo num lugar só". Uma responde
   "quanto entrou este mês"; a outra, "quem eu já tatuei e onde eu
   estive". Nenhuma das duas existe em caderno de agenda, e é isso que
   as torna a aposta de retenção do modelo.

   Dados fictícios, deterministas: o mesmo mês sempre mostra os mesmos
   números, senão testar vira loteria. */
var LANC=(function(){
 var f=[["Sessão","sessao","Helena Duarte","Fineline no antebraço"],
        ["Sessão","sessao","Rafael Costa","Blackwork nas costas — 2ª de 3"],
        ["Arte","arte","Venda de print","Estudo de folhagem, 2 unidades"],

        ["Curso","curso","Turma de fineline","4 inscrições"],
        ["Sessão","sessao","Igor Menezes","Lettering no antebraço"],
        ["Arte","arte","Venda de original","Serpente e lua"],
        ["Sessão","sessao","Clara Vaz","Pontilhismo na panturrilha"]];
 var g=[["Aluguel da cadeira","estudio","Studio Marina — julho"],
        ["Material","material","Cartuchos, tinta e descartáveis"],
        ["Destaque no catálogo","plataforma","Julho"]];
 var l=[];
 f.forEach(function(x,i){
  l.push({dia:2+i*3,tipo:"entrada",cat:x[1],catL:x[0],quem:x[2],obs:x[3],
          cents:x[1]==="sessao"?(45000+(i*7%5)*22000):x[1]==="arte"?(9000+(i%3)*12000):68000});
 });
 g.forEach(function(x,i){
  l.push({dia:5+i*9,tipo:"saida",cat:x[1],catL:x[0],quem:x[0],obs:x[2],
          cents:x[1]==="estudio"?120000:x[1]==="material"?43500:12000});
 });
 return l.sort(function(a,b){return a.dia-b.dia});
})();

 {nome:"Helena Duarte",sessoes:4,desde:"mar/2025",ultima:"12 jul",trabalhos:"Fineline, folhagem no antebraço e ombro",gasto:186000,seed:3},

function somaCaixa(){
 var e=0,sa=0,porCat={};
 LANC.forEach(function(x){
  if(x.tipo==="entrada"){e+=x.cents;porCat[x.cat]=(porCat[x.cat]||0)+x.cents}
  else sa+=x.cents;
 });
 return {entrou:e,saiu:sa,sobrou:e-sa,porCat:porCat};
}

/* O roteiro do onboarding é montado na hora. O passo 4 — modelo de
   orçamento — só entra se a pessoa tiver sinalizado interesse no passo 3.
   Assim quem só quer aparecer no catálogo faz 4 passos, não 5. */
function passosDoOnboarding(){
 var r=[{n:1,t:"Sobre você e seu estúdio"},{n:2,t:"Seus estilos"},{n:3,t:"Portfólio e redes"}];
 if(S.onbQuerOrcamento) r.push({n:4,t:"Modelo de orçamento"});
 r.push({n:5,t:"Revisar e publicar"});
 return r;
}
function passoSeguinte(st){
 var ns=passosDoOnboarding().map(function(p){return p.n});
 var i=ns.indexOf(st);
 return i>=0&&i<ns.length-1 ? ns[i+1] : st;
}
function passoAnterior(st){
 var ns=passosDoOnboarding().map(function(p){return p.n});
 var i=ns.indexOf(st);
 return i>0 ? ns[i-1] : st;
}
function irPasso(destino){
 S.onbStep=destino;
 render();
}

function subirModeloOrcamento(arquivos){
 if(!arquivos||!arquivos.length)return;
 var a=arquivos[0];
 if(!/\.xlsx?$/i.test(a.name)){
  S.onbErro=true;S.onbMsg="Só planilhas .xls ou .xlsx.";render();return;
 }
 if(a.size>2*1024*1024){
  S.onbErro=true;S.onbMsg="Planilha acima de 2 MB.";render();return;
 }
 // No protótipo só registramos o nome. Ler a planilha e extrair as faixas
 // de preço exige backend — está anotado como pendência.
 S.onbModeloArquivo=a.name;
 S.onbModelo="proprio";
 S.onbErro=false;S.onbMsg="";
 render();
}

/* ============ PERFIL DO ESTÚDIO ============
   Uma página de lugar, não de pessoa. Ela responde três perguntas que
   ninguém conseguia responder antes de entrar no estúdio: está limpo,
   é legal, e quem trabalha aqui.

   A terceira pergunta é a que costuma faltar nas plataformas: o cliente
   escolhe o tatuador e descobre o lugar só quando chega. */
function vEstudio(){
 var e=estudioAtual();
 var selos=selosDoEstudio(e);
 var h='<main><div class="wrap" style="max-width:640px">';
 h+='<button class="btn sm" style="margin-top:var(--e4)" onclick="go(\'home\')">← Voltar</button>';

 /* Mesmo cabeçalho do perfil de quem tatua, sem caixa: os dois são
    "quem é este, aqui está o essencial, aqui está o que fazer". Formas
    diferentes para a mesma coisa fariam a pessoa reaprender a ler. */
 h+='<div class="perfilcab">';
 h+='<div class="row" style="gap:var(--e3);align-items:flex-start">';
 h+='<div class="av" style="width:56px;height:56px;font-size:17px;flex-shrink:0">'+ini(e.nome)+'</div>';
 h+='<div style="min-width:0;flex:1"><h1 class="perfilnome">'+e.nome+'</h1>';
 h+='<div class="perfilloc">'+(e.handle?'@'+e.handle+' · ':'')+e.cidade+(e.uf?'/'+e.uf:'')+'</div>';
 h+='<div class="perfilnum">'+e.sessoes+' sessões verificadas aqui'+(e.desde?' · desde '+e.desde:'')+'</div>';
 h+='</div></div>';

 if(selos.length)h+='<div class="selos" style="margin-top:var(--e3)">'+selos.map(function(x){return selo(x,true)}).join("")+'</div>';

 /* ── O estúdio que ninguém reivindicou ─────────────────────────
    Aqui está a decisão de negócio inteira, num bloco. O lugar aparece
    porque tatuadores fizeram check-in nele — esse dado é dos
    tatuadores e dos clientes. A nota de higiene, não: ela é uma
    afirmação sobre um estabelecimento que nunca aceitou estar aqui e
    não tem canal para responder.

    Publicar sem o direito de resposta é o que transforma medição em
    acusação. */
 if(!e.reivindicado){
  h+='<div class="banner" style="margin-top:var(--e3)"><div>';
  h+='<div class="b small">Este estúdio ainda não está na plataforma</div>';
  h+='<div class="tiny muted" style="margin-top:var(--e1)">Ele aparece aqui porque '+e.sessoes+' sessões tiveram check-in neste endereço, feitos por tatuadores e clientes. Ninguém do estúdio se cadastrou ainda.</div>';
  h+='<div class="tiny muted" style="margin-top:var(--e1)"><b>Por isso não mostramos nota de higiene.</b> '+e.checkouts+' clientes já responderam sobre este lugar, mas o estúdio não tem como ver nem responder — e número sem direito de resposta vira acusação, não medição.</div>';
  h+='</div></div>';
  h+='<div class="row" style="gap:var(--e2);margin-top:var(--e3)">';
  h+='<button class="btn primary" style="flex:1" onclick="go(\'estudio-reivindicar\')">Sou deste estúdio</button>';
  h+='<button class="btn" onclick="alert(\'convidarEstudio(studio_name, city)\')">Convidar o estúdio</button></div>';
  h+='<div class="tiny muted" style="margin-top:var(--e2)">Se você tatua aqui, o convite feito por você chega melhor que o nosso.</div>';
  h+='</div>';
 } else {
  h+='</div>';

  h+='<div class="card pad" style="margin-top:var(--e4)"><div class="row"><span class="b small">O que os clientes responderam</span>'+tg("novo")+'</div>';
  if(estudioTemNota(e)){
   h+='<div class="tiny muted" style="margin-top:var(--e1)">'+e.checkouts+' checkouts avaliados, no fim da sessão, aqui dentro.</div>';
   [["Estúdio limpo e organizado",e.higiene,90],
    ["Saiu sabendo cuidar",e.orientaPos,90],
    ["Se sentiu acolhido",e.acolhimento,0]].forEach(function(x){
    var passou=x[1]>=x[2];
    h+='<div style="margin-top:var(--e3)"><div class="row"><span class="small">'+x[0]+'</span>';
    h+='<span class="sp b small" style="color:var(--'+(passou?"x-success":"x-warning")+')">'+x[1]+'%</span></div>';
    h+='<div class="bar" style="margin-top:var(--e1)"><i style="width:'+x[1]+'%'+(passou?'':';background:var(--x-warning)')+'"></i></div>';
    if(x[2])h+='<div class="tiny muted" style="margin-top:var(--e1)">mínimo para o selo: '+x[2]+'%</div>';
    h+='</div>';
   });
   if(e.higiene<90)h+='<div class="avisoerro" style="margin-top:var(--e3)">Sem o selo de higiene: '+(100-e.higiene)+'% dos clientes não confirmaram o estúdio limpo. Isso fica no estúdio e não entra no perfil de quem tatua aqui.</div>';
  } else {
   h+='<div class="tiny muted" style="margin-top:var(--e1)">'+e.checkouts+' checkouts avaliados. A nota aparece a partir de 30 — abaixo disso o número é sobre alguns clientes específicos, não sobre o lugar.</div>';
  }
  h+='</div>';

  if(e.verificado){
   h+='<div class="card pad" style="margin-top:var(--e4)"><div class="row"><span class="b small">Documentos conferidos</span>'+tg("novo")+'</div>';
   h+='<table class="t" style="margin-top:var(--e2)">';
   h+='<tr><td class="muted small">CNPJ</td><td style="text-align:right" class="small">'+e.cnpj+'</td></tr>';
   h+='<tr><td class="muted small">Endereço</td><td style="text-align:right" class="small">'+e.endereco+'</td></tr>';
   h+='<tr><td class="muted small">Licença sanitária</td><td style="text-align:right" class="small">'+e.licenca+'</td></tr>';
   h+='</table>';
   h+='<div class="tiny muted" style="margin-top:var(--e2)">Conferidos com o registro oficial. É o que a vigilância sanitária exige de um estúdio, e o que nenhum perfil de rede social prova.</div></div>';
  } else {
   h+='<div class="card pad" style="margin-top:var(--e4)"><div class="row"><span class="b small">Documentos</span>'+tg("novo")+'</div>';
   h+='<div class="tiny muted" style="margin-top:var(--e1)">Este estúdio ainda não enviou licença sanitária, então não tem o selo <b>Estúdio verificado</b>. A ausência do selo não afirma nada contra ele — só quer dizer que a plataforma não conferiu.</div></div>';
  }

  h+='<div class="card pad" style="margin-top:var(--e4)"><div class="row"><span class="b small">Quem tatua aqui</span>'+tg("novo")+'</div>';
  h+='<div class="lista" style="margin-top:var(--e2)">';
  e.residentes.forEach(function(n,i){
   var art=ARTISTS.filter(function(x){return x.name===n})[0]||ARTISTS[i%ARTISTS.length];
   h+='<button class="lrow clicavel" onclick="go(\'artist\',\''+art.id+'\')"><div class="av">'+ini(n)+'</div>';
   h+='<div class="itemtxt"><div class="b small">'+n+'</div>';
   h+='<div class="selos" style="margin-top:var(--e1)">'+selosNoFeed(art).map(function(x){return selo(x,true)}).join("")+'</div></div>';
   h+='<div class="itemfim"><span class="tiny muted">ver perfil ›</span></div></button>';
  });
  h+='</div>';
  h+='<div class="tiny muted" style="margin-top:var(--e2)">Os selos acima são de cada pessoa. Os do estúdio são do lugar. Um não empresta reputação ao outro — nem para o bem, nem para o mal.</div></div>';

  /* ── Para tatuadores ──────────────────────────────────────────
     O mesmo dado, virado do avesso: quem vai passar uma temporada
     aqui precisa saber se o lugar é limpo tanto quanto o cliente. Isso
     transforma o selo em ferramenta para o tatuador, e não só em
     julgamento sobre ele. */
  if(isArt()){
   h+='<div class="card pad" style="margin-top:var(--e4)"><div class="row"><span class="b small">Pensando em fazer guest aqui?</span>'+tg("novo")+'</div>';
   h+='<div class="tiny muted" style="margin-top:var(--e1)">'+(e.cadeiras?e.cadeiras+' cadeiras · ':'')+e.guests+' tatuadores visitantes já passaram por aqui'+(estudioTemNota(e)?' · higiene '+e.higiene+'%':'')+'.</div>';
   h+='<div class="tiny muted" style="margin-top:var(--e1)">Você vê a higiene do lugar antes de aceitar a temporada — que é a mesma informação que o cliente vê antes de marcar com você.</div>';
   h+='<button class="btn" style="margin-top:var(--e3)" onclick="alert(\'proporGuest(studio_id, artist_id, periodo)\')">Propor uma temporada</button></div>';
  }
 }

 return h+'</div></main>';
}

 h+='<div class="lista" style="margin-top:var(--e3)">';

 });
 h+='</div>';
 h+='<div class="tiny muted" style="margin-top:var(--e2)">Reivindicar pede CNPJ, endereço e licença sanitária. Sem os três não há selo de estúdio verificado — e sem reivindicação não há nota de higiene visível.</div>';

/* ============ FORNECEDOR ============
   Quatro frentes que formam uma cadeia, e a ordem importa:

   recomendação → embaixador → loja → cliente

   Uma marca compra alcance quando começa por embaixador. Começando por
   recomendação espontânea, ela descobre quem já usa o produto de
   verdade — e é essa a pessoa que vale convidar. A tela reflete isso:
   recomendações vêm antes de embaixadores na navegação, e a lista de
   candidatos a embaixador sai de quem já recomendou.

   Nada disto tem backend. É proposta, e a etiqueta em cada tela diz. */
var FORN_NAV=[["forn","Visão geral","▦"],["forn-recomendacoes","Recomendações","★"],
 ["forn-embaixadores","Embaixadores","👥"],["forn-loja","Minha loja","🛍"]];

function vForn(sub){
 if(!isForn())return '<main><div class="wrap"><div class="card pad" style="max-width:500px;margin:36px auto;text-align:center"><div style="font-size:25px">🔒</div><div class="b" style="margin-top:var(--e2)">Ambiente do fornecedor</div><p class="small muted" style="margin-top:var(--e1)">Esta conta não tem o papel <code>supplier</code>. Troque o papel na barra de desenvolvimento para navegar por aqui.</p><button class="btn blk" style="margin-top:var(--e3)" onclick="go(\'home\')">Voltar</button></div></div></main>';

 var h=envHead("forn","Nordeste Ink Care",FORN_NAV,sub)+'<main><div class="wrap">';
 if(naPrimeiraSecao(sub))h+='<div class="banner" style="margin-top:var(--e4)"><div class="tiny"><b>Perfil em estudo.</b> Nenhuma destas telas grava no banco — não existe cadastro de fornecedor ainda. O que está aqui é a proposta, para o teste com usuários dizer se ela faz sentido antes de virar tabela.</div></div>';

 /* ── VISÃO GERAL ─────────────────────────────────────────────── */
 if(sub==="forn"){
  var aEnviar=FORN_PEDIDOS.filter(function(x){return x.estado==="a enviar"}).length;
  var convidados=EMBAIXADORES.filter(function(x){return x.estado==="convidado"}).length;
  var ativos=EMBAIXADORES.filter(function(x){return x.estado==="ativo"}).length;
  var semEstoque=FORN_PRODUTOS.filter(function(x){return x.estoque===0}).length;
  var posSessao=FORN_PEDIDOS.filter(function(x){return x.origem==="pós-sessão"}).length;
  var alcance=EMBAIXADORES.filter(function(x){return x.estado==="ativo"}).reduce(function(t,x){return t+x.alcance},0);

  h+='<div class="row" style="margin-top:var(--e4)"><span class="b" style="font-size:var(--t-card)">Precisa de você</span></div>';
  h+='<div class="grandes" style="margin-top:var(--e2)">';
  [["📦","Pedidos a enviar",aEnviar,"clientes esperando","forn-loja","fl","pedidos",aEnviar>0],
   ["👥","Convites sem resposta",convidados,"tatuadores convidados","forn-embaixadores","fe","convites",convidados>0],
   ["🏷","Produtos sem estoque",semEstoque,"saíram da vitrine","forn-loja","fl","produtos",semEstoque>0]
  ].forEach(function(x){h+=cartaoGrande(x)});
  h+='</div>';

  h+='<div class="row" style="margin-top:var(--e4)"><span class="b" style="font-size:var(--t-card)">Confiança que você tem</span>';
  h+='<span class="sp tiny muted">o que sustenta a marca</span></div>';
  h+='<div class="grandes" style="margin-top:var(--e2)">';
  [["★","Recomendações",RECOMENDACOES.length,"de tatuadores atuantes","forn-recomendacoes","fr","recebidas",false],
   ["👥","Embaixadores ativos",ativos,"com contrato aberto","forn-embaixadores","fe","ativos",false],
   ["🌐","Alcance na plataforma",alcance.toLocaleString("pt-BR"),"seguidores dos embaixadores","forn-embaixadores","fe","ativos",false]
  ].forEach(function(x){h+=cartaoGrande(x)});
  h+='</div>';

  h+='<div class="row" style="margin-top:var(--e4)"><span class="b" style="font-size:var(--t-card)">Como vai o mês</span>';
  h+='<span class="sp tiny muted">julho</span></div>';
  h+='<div class="grandes" style="margin-top:var(--e2)">';
  [["👛","Vendido",brl(FORN_PEDIDOS.reduce(function(t,x){return t+x.valor},0)),FORN_PEDIDOS.length+" pedidos","forn-loja","fl","pedidos",false],
   ["✨","Vindos do pós-sessão",posSessao,"de "+FORN_PEDIDOS.length+" pedidos","forn-loja","fl","pedidos",false],
   ["🛍","Produtos na vitrine",FORN_PRODUTOS.length,"catálogo publicado","forn-loja","fl","produtos",false],
   ["📈","Vendas por embaixador",EMBAIXADORES.reduce(function(t,x){return t+x.vendas},0),"atribuídas ao link deles","forn-embaixadores","fe","ativos",false]
  ].forEach(function(x){h+=cartaoGrande(x)});

 }

 /* ── RECOMENDAÇÕES ───────────────────────────────────────────────

 if(sub==="forn-recomendacoes"){

function vStudio(sub){
 if(!isArt())return '<main><div class="wrap"><div class="card pad" style="max-width:500px;margin:36px auto;text-align:center"><div style="font-size:25px">🔒</div><div class="b" style="margin-top:var(--e2)">Ambiente exclusivo de tatuadores</div><p class="small muted" style="margin-top:var(--e1)">Esta conta não tem o papel <code>artist</code>. Na proposta nova, o acesso é bloqueado aqui em vez de empurrar a pessoa para o onboarding.</p><button class="btn primary" style="margin-top:var(--e3)" onclick="becomeArtist()">Tornar-se tatuador</button><button class="btn blk" style="margin-top:var(--e2)" onclick="go(\'me\')">Voltar para minha área</button></div></div></main>';

 var h=envHead("studio","Seu estúdio",ST_NAV,sub)+'<main><div class="wrap">';

 /* ── VISÃO GERAL ───────────────────────────────────────────────

    segundos e depois sai da frente.

    Sub-abas aqui seriam um erro: dividir o resumo obrigaria a pessoa a
    escolher entre duas metades antes de saber o que ela procura. É o
    oposto de resumir. */
 /* Os blocos abaixo continuam escritos em torno das chaves antigas —
    orc para orçamentos, cx para caixa. Em vez de reescrever cada um,

 if(sub==="studio-financeiro"){
  var fin=subAba("fin","dinheiro");
  S.sub=S.sub||{};
  S.sub.cx = fin==="lancamentos" ? "lancamentos" : "resumo";
 }
 if(sub==="studio-schedule"&&subAba("ag","agendado")==="pessoas"){
  S.sub=S.sub||{};S.sub.cx="pessoas";
 }

 /* ── VISÃO GERAL ─────────────────────────────────────────────
    A visão geral e o check-in de agora respondem à mesma pergunta:
    o que acontece hoje. Eram duas abas listando as mesmas sessões. */

 if(sub==="studio-reputacao"){
  var semResp=REVS.filter(function(r){return !r.resp}).length;
  h+=abasInternas("rep",[["avaliacoes","Avaliações",semResp||""],
                          ["estudios","Onde eu tatuei"]]);

 }
 /* Era sub==="studio" && subAba("vg","visao")==="visao".

 if(sub==="studio"){

  h+='<div class="row" style="margin-top:var(--e4)"><span class="b" style="font-size:var(--t-card)">Como vai o mês</span>';
  h+='<span class="sp tiny muted">julho</span></div>';
  h+='<div class="grandes" style="margin-top:var(--e2)">';
  /* ── O DINHEIRO VOLTOU ────────────────────────────────────────
     "Entrou", "Saiu" e "Sobrou" tinham saído daqui com um motivo que
     era bom na época: a seção Dinheiro estava NESTA página, uma
     rolagem abaixo, dizendo o mesmo número com as mesmas palavras.

     Dinheiro virou a aba Financeiro na decisão 033, e a justificativa
     morreu junto — mas o cartão não voltou sozinho. O painel ficou com
     nove números e nenhum deles era dinheiro, que é a primeira coisa
     que alguém que trabalha por conta própria quer ver de manhã.

     É a armadilha das justificativas com prazo de validade: "isto sai

  [["👛","Sobrou em julho",brl(cx.sobrou),"depois das saídas","studio-financeiro","fin","dinheiro",false],

  h+='<div class="tiny muted" style="margin-top:var(--e4)">Toque em qualquer número para ver o detalhe na aba correspondente.</div>';
 }

 if(sub==="studio-quotes"){

/* As médias saem das sessões com check-in, e só delas. Misturar sessão
   medida com sessão lembrada estragaria justamente o número que faz o
   check-in valer a pena. */
function desempenhoPorEstilo(){
 var m={};
 /* Só duração medida. Sessão fechada por distância ou por tempo é
    estimativa, e estimativa misturada à média destrói justamente o
    número que justifica o check-in. */
 PASS.filter(function(t){return t.verificado && t.medida!==false}).forEach(function(t){
  var k=t.estilo;
  if(!m[k])m[k]={rotulo:SL[k]||k,n:0,soma:0,max:0};
  m[k].n++; m[k].soma+=t.horas; if(t.horas>m[k].max)m[k].max=t.horas;
 });
 return Object.keys(m).map(function(k){
  return {rotulo:m[k].rotulo,n:m[k].n,media:m[k].soma/m[k].n,max:m[k].max};
 }).sort(function(a,b){return b.media-a.media});
}

/* Sugestão, não imposição: 5% acima do piso que o cliente informou. É

function centavosDigitados(txt){
 var d=String(txt||"").replace(/[^0-9]/g,"");
 return d ? parseInt(d,10)*100 : 0;
}
function dicaProposta(q,cents){
 if(!cents)return '<span class="muted">Escreva quanto você vai cobrar.</span>';
 if(cents<q.min)return '<span class="muted">Abaixo do que o cliente já esperava pagar. Se foi de propósito, tudo bem — só confira.</span>';
 if(cents<=q.max)return '<span style="color:var(--x-success)">Dentro da faixa que o cliente informou.</span>';
 var acima=Math.round((cents-q.max)/q.max*100);
 return '<span style="color:var(--x-warning)">'+acima+'% acima do teto que ele informou. Vale explicar o porquê na mensagem.</span>';
}
/* Só a dica é repintada. Chamar render() aqui destruiria o campo em
   foco e o cursor voltaria para o começo a cada tecla. */

 if(!el||!d)return;
 d.innerHTML=icons(dicaProposta(pedidoSel(),centavosDigitados(el.value)));
}

 var q=pedidoSel();
 var el=document.getElementById("propValor");
 q.status="respondido";

   com um token. Aqui mostra o tempo de espera, que é o que a pessoa

/* ═══ A AGENDA, COM TRÊS ORIGENS ═══════════════════════════════════
   O calendário é o centro, e nele convivem três procedências:

     ink     sessão marcada aqui, com cliente e valor
     google  compromisso trazido da agenda de fora
     manual  bloqueio que o tatuador escreveu à mão

   Conectar o Google é UMA OPÇÃO, não um pré-requisito. Quem não
   conecta monta a agenda à mão e ela funciona igual — só não sabe do
   que acontece fora daqui. É por isso que a origem precisa aparecer em
   cada item: sem ela, desconectar faria sumir coisas sem explicação.

   O título do compromisso do Google fica só para ele. Para quem tenta
   marcar, o horário aparece ocupado e ponto. */
var GCAL=[
 {id:"g1",dia:21,titulo:"Consulta — dermatologista",hora:"14h–15h",agenda:"Pessoal",bloqueia:true},
 {id:"g2",dia:23,titulo:"Aula de desenho",hora:"19h–21h",agenda:"Pessoal",bloqueia:true},
 {id:"g3",dia:26,titulo:"Aniversário da Rita",hora:"dia inteiro",agenda:"Família",bloqueia:false},
 {id:"g4",dia:28,titulo:"Voo para Porto Alegre",hora:"06h–09h",agenda:"Viagens",bloqueia:true},
 {id:"g5",dia:1, titulo:"Reunião do prédio",hora:"20h–21h",agenda:"Pessoal",bloqueia:false}
];

/* Bloqueios escritos à mão. Existem sem Google nenhum. */
var MANUAL=[
 {id:"m1",dia:25,titulo:"Almoço com fornecedor",hora:"12h–14h"}
];

/* Tudo o que ocupa um dia, venha de onde vier. É esta função que faz
   o calendário ser um só em vez de três listas paralelas. */
function itensDoDia(dia){
 var itens=[];
 BOOK.forEach(function(b,i){
  if(Number(b.d)===dia)itens.push({origem:"ink",titulo:b.c,hora:b.h+"h previstas",extra:b.area,idx:i});
 });
 if(S.agendaGoogle)GCAL.forEach(function(c){
  if(c.dia===dia)itens.push({origem:"google",titulo:c.titulo,hora:c.hora,extra:c.agenda,id:c.id,bloqueia:c.bloqueia});
 });
 MANUAL.forEach(function(m){
  if(m.dia===dia)itens.push({origem:"manual",titulo:m.titulo,hora:m.hora,id:m.id});
 });
 return itens;
}

/* ═══ GOOGLE AGENDA ════════════════════════════════════════════════
   Isto é uma simulação, e ela existe para o teste com usuários medir a
   decisão — "eu daria acesso à minha agenda?" — sem depender de nada
   pronto no backend.

   Duas coisas que a simulação anterior fazia mal e que davam um teste
   otimista de graça:

   1. Ela nunca falhava. Conexão com serviço de terceiro falha: a
      pessoa fecha a janela do Google, nega o escopo, perde a rede. Um
      protótipo que só acerta não mostra como é o produto no dia ruim.
   2. Ela conectava sem perguntar QUAL calendário. Essa pergunta é a
      parte que dá medo de verdade — ninguém quer sessão de tatuagem
      caindo no calendário da família.

   O que fica registrado em GOOGLE-AGENDA.md é o que falta para valer:
   OAuth de verdade precisa de segredo de cliente, e segredo de cliente
   não pode viver no navegador. */
function conectarGoogleAgenda(){
 if(S.googleConectando)return;
 S.googleErroGoogle=null;
 S.googleConectando=true;render();
 setTimeout(function(){
  S.googleConectando=false;
  /* Uma em cada quatro falha, de propósito: é a proporção que faz a
     pessoa do teste encontrar o caminho ruim sem que ele domine. */
  if(S.googleSimularErro){
   S.googleErroGoogle="Você fechou a janela do Google antes de autorizar. Nada foi conectado.";
  } else {
   S.googleEscolhendo=true;
  }
  render();
 },900);
}

   trabalho com o resto da vida. */

 S.googleCalendario=qual;

 S.agendaGoogle=true;
 render();
}

/* Os cinco tamanhos, e por que são cinco e não um campo livre.

   aproximado" dentro de Observações. Ali cada pessoa escreve numa
   unidade: "médio", "palma da mão", "uns 3 dedos", "grande".

   Nenhuma delas se compara com a outra, e comparar é justamente o que
   o cliente vai fazer quando as respostas chegarem.

   Centímetro compara. As faixas são largas de propósito: ninguém sabe
   se quer 12 ou 14 cm, e fingir essa precisão só produz número
   inventado. O último degrau sai da régua porque fechamento não se
   mede em centímetros — se mede em sessões. */
var TAMANHOS=[
 ["p","até 5 cm","moeda, dedo"],
 ["m","5 a 10 cm","palma da mão"],
 ["g","10 a 20 cm","antebraço"],
 ["gg","20 a 30 cm","panturrilha, costela"],
 ["fech","fechamento","braço, perna ou costas inteiros"]
];
function rotuloTamanho(c){
 var t=TAMANHOS.filter(function(x){return x[0]===c})[0];
 return t?t[1]:"";
}

/* Quem faz o que a pessoa pediu. Se ela marcou cobertura, só quem
   cobre. Nada de pontuação: ou o tatuador trabalha com aquilo, ou não. */
function tatuadoresCompativeis(){
 /* O atalho "se veio de um perfil, só ele" saiu: o passo 2 mostra as
    recomendações SEMPRE, e quem veio de um perfil chega com o nome na
    busca — vê a pessoa que escolheu em cima e as alternativas
    embaixo, em vez de um beco de opção única. */
 var quer=S.arrependido?ESTILOS_CORRECAO:S.aiEstilos;
 var cid=(S.aiCidade||"").toLowerCase();
 var l=ARTISTS.filter(function(x){
  var faz=quer.length===0||x.styles.some(function(s){return quer.indexOf(s)>=0});
  return faz;
 });
 // Mesma cidade primeiro. Quem está longe continua na lista, porque
 // tatuador viaja e o cliente pode querer.
 l.sort(function(x,y){
  var mx=cid&&x.city.toLowerCase().indexOf(cid)>=0?0:1;
  var my=cid&&y.city.toLowerCase().indexOf(cid)>=0?0:1;
  return mx-my||y.rating-x.rating;
 });
 return l.slice(0,6);
}

/* ═══ PAINEL DO TESTE ═════════════════════════════════════════════
   Lê teste_sessoes e teste_eventos. Só admin: a RLS recusa qualquer
   outro, então a tela pede login antes de tentar.

   Os números aqui não são de produção — são de quantas pessoas
   passaram pelo link e do que elas fizeram. É pouco dado de propósito:
   um teste de usabilidade com dez pessoas responde mais do que um
   painel com cem indicadores e nenhuma pessoa. */

var ROTAS_CONHECIDAS=[
 ["home","Descobrir tatuadores"],["artist","Perfil do tatuador"],
 ["plataforma","Conhecer"],["cadastro","Criar conta"],
 ["me","Minha área"],["me-quotes","Meus orçamentos"],["me-saved","Salvos"],
 ["studio","Gestão do estúdio"],["studio-quotes","Orçamentos recebidos"],
 ["studio-schedule","Agenda do estúdio"],["studio-profile","Perfil profissional"],
 ["modelo","Modelo de negócio"],["conexao","Conexão com o banco"]
];
function rotuloDaRota(r){
 var m=ROTAS_CONHECIDAS.filter(function(x){return x[0]===r})[0];
 return m?m[1]:r;
}
function mediana(v){
 if(!v.length)return 0;
 var o=v.slice().sort(function(a,b){return a-b}),i=Math.floor(o.length/2);
 return o.length%2?o[i]:Math.round((o[i-1]+o[i])/2);
}
function dur(ms){
 if(ms==null)return "—";
 var s=Math.round(ms/1000);
 return s<60?s+"s":Math.floor(s/60)+"m"+(s%60?" "+(s%60)+"s":"");
}

/* Toda a agregação num lugar só. Recebe as duas listas cruas e devolve
   o que a tela desenha — assim dá para testar a conta sem navegador. */
function apurarPainel(sessoes,eventos){
 var porSessao={};
 sessoes.forEach(function(x){porSessao[x.id]={s:x,ev:[]}});
 eventos.forEach(function(e){if(porSessao[e.sessao_id])porSessao[e.sessao_id].ev.push(e)});
 var ids=Object.keys(porSessao);

 var perfis={cliente:0,tatuador:0,fornecedor:0};
 sessoes.forEach(function(x){if(perfis[x.perfil_declarado]!=null)perfis[x.perfil_declarado]++});

 var visitou={}, tempos={}, abandono={}, gavetas={}, acoes={}, duracoes=[], retomadas=0;
 ids.forEach(function(id){
  var b=porSessao[id], vistas={}, ultima=null;
  b.ev.forEach(function(e){
   if(e.tipo==="entrada"&&e.detalhe&&e.detalhe.retomada)retomadas++;
   if(e.tipo==="rota"||e.tipo==="saida"){
    if(e.rota){
     vistas[e.rota]=1; ultima=e.rota;
     (tempos[e.rota]=tempos[e.rota]||[]).push(e.ms_na_tela||0);
    }
   }
   if(e.tipo==="gaveta"&&e.alvo)gavetas[e.alvo]=(gavetas[e.alvo]||0)+1;
   if(e.tipo==="acao"&&e.alvo)acoes[e.alvo]=(acoes[e.alvo]||0)+1;
  });
  Object.keys(vistas).forEach(function(r){visitou[r]=(visitou[r]||0)+1});
  if(ultima)abandono[ultima]=(abandono[ultima]||0)+1;
  if(b.ev.length>1){
   var t0=new Date(b.ev[0].criado_em).getTime(), t1=new Date(b.ev[b.ev.length-1].criado_em).getTime();
   if(t1>t0)duracoes.push(t1-t0);
  }
 });

 function chegou(rota){return visitou[rota]||0}
 var funil=[
  ["Entrou no teste",ids.length],
  ["Viu o catálogo",chegou("home")],
  ["Abriu um perfil",chegou("artist")],
  ["Leu a proposta em Conhecer",chegou("plataforma")],
  ["Começou a criar conta",chegou("cadastro")],
  ["Concluiu o cadastro",chegou("studio")+chegou("me")]
 ];

 var naoVisitadas=ROTAS_CONHECIDAS.filter(function(x){return !visitou[x[0]]}).map(function(x){return x[1]});
 var toque=sessoes.filter(function(x){return x.ponteiro==="toque"}).length;

 function topo(o,n){
  return Object.keys(o).sort(function(a,b){return o[b]-o[a]}).slice(0,n).map(function(k){return [k,o[k]]});
 }
 return {
  n:ids.length, perfis:perfis, funil:funil, retomadas:retomadas,
  telas:Object.keys(visitou).sort(function(a,b){return visitou[b]-visitou[a]}).map(function(r){
    return {rota:r, rotulo:rotuloDaRota(r), sessoes:visitou[r], mediana:mediana(tempos[r]||[])}}),
  naoVisitadas:naoVisitadas,
  abandono:topo(abandono,5).map(function(x){return [rotuloDaRota(x[0]),x[1]]}),
  gavetas:topo(gavetas,6), acoes:topo(acoes,10),
  toque:toque, mouse:sessoes.length-toque,
  larguraMediana:mediana(sessoes.map(function(x){return x.largura||0}).filter(Boolean)),
  duracaoMediana:mediana(duracoes),
  participantes:ids.map(function(id){
   var b=porSessao[id], vistas={};
   b.ev.forEach(function(e){if(e.rota)vistas[e.rota]=1});
   var t0=b.ev.length?new Date(b.ev[0].criado_em).getTime():0;
   var t1=b.ev.length?new Date(b.ev[b.ev.length-1].criado_em).getTime():0;
   return {nome:b.s.nome, email:b.s.email, perfil:b.s.perfil_declarado,
     telas:Object.keys(vistas).length, acoes:b.ev.filter(function(e){return e.tipo==="acao"}).length,
     duracao:t1>t0?t1-t0:null, quando:b.s.criado_em};
  })
 };
}

   qualquer lugar — no arquivo local, no GitHub Pages, onde for — e não

function linkDoTeste(){
 try{
  var o=location.origin, c=location.pathname.replace(/\/prototipo\/index\.html$/,"/").replace(/index\.html$/,"");
  if(o==="null"||!o)return null;                 // aberto como file://
  return o+c+"?teste=1";

}
function copiarLink(){

}

/* Por tatuador no catálogo, não por pagante: como a maioria nunca paga,
   a média é a única leitura honesta. Enterprise fica de fora porque tem
   venda consultiva e ticket próprio — misturar esconderia o buraco. */
function calcUE(){
 var u=S.ue;
 var custoMes=u.custo*u.qtd;
 var recDestaque=u.destaque*(u.adesao/100);
 var recComissao=u.gmv*(u.take/100);
 var receita=recDestaque+recComissao;
 var margem=receita-custoMes;
 var el=document.getElementById("ueOut");
 if(!el)return;
 var h='<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">';
 h+='<div class="stat"><div class="lbl">Custo por tatuador/mês</div><div class="val">R$ '+custoMes.toFixed(2)+'</div><div class="hint">imagem e banda</div></div>';
 h+='<div class="stat"><div class="lbl">Receita de destaque</div><div class="val">R$ '+recDestaque.toFixed(2)+'</div><div class="hint">média por tatuador</div></div>';
 h+='<div class="stat"><div class="lbl">Receita de comissão</div><div class="val">R$ '+recComissao.toFixed(2)+'</div><div class="hint">loja, cursos e eventos</div></div>';
 h+='<div class="stat"><div class="lbl">Margem por tatuador/mês</div><div class="val" style="color:'+(margem<0?'var(--x-danger)':'var(--x-success)')+'">R$ '+margem.toFixed(2)+'</div>';
 h+='<div class="hint">'+(margem<0?'prejuízo':'lucro')+' antes de estrutura</div></div>';
 h+='</div>';
 if(margem<0){
  var falta=u.adesao>0?Math.ceil((custoMes-recComissao)/(u.destaque/100)):null;
  h+='<div class="banner" style="margin-top:var(--e3);background:var(--x-danger-bg);border-color:var(--x-danger)"><div class="small" style="color:var(--x-danger)"><b>No vermelho.</b> Cada tatuador no catálogo custa mais do que devolve. '+
   (falta&&falta<=100?'Precisaria de '+falta+'% de adesão ao destaque para empatar sem mexer no resto.':'Nem 100% de adesão ao destaque cobriria. Com custo de infraestrutura tão baixo, isso só acontece se a receita for perto de zero — ou seja, ninguém contratando e ninguém vendendo.')+'</div></div>';
 } else {
  h+='<div class="banner" style="margin-top:var(--e3)"><div class="small"><b>No azul.</b> Sobram R$ '+margem.toFixed(2)+' por tatuador antes de time e infraestrutura. Enterprise não entra nesta conta — tem ticket e custo de venda próprios.</div></div>';
 }
 el.innerHTML=icons(h);
}

function setModo(m){
 S.modo=m;S.conn=null;
 var p=document.getElementById("pilhaStatus");if(p)p.textContent=m==="real"?"real":"demo";
 render();
 if(m==="real")checarConexao();
}
async function checarConexao(){
 try{
  S.conn=await window.Dados.testarConexao();
  if(S.conn.ok&&S.conn.sessao){try{S.papeis=await window.Dados.meusPapeis()}catch(e){S.papeis=[]}}
  else S.papeis=null;
 }catch(e){S.conn={ok:false,etapa:"iniciar",detalhe:String(e)}}
 if(S.route==="conexao")render();
}
async function registrarReal(){
 S.regMsg="Criando…";S.regErro=false;render();
 try{
  await window.Dados.criarConta(S.reg.email,S.reg.senha,S.reg.nome,S.reg.artista);
  S.regMsg="Conta criada. Se a confirmação por email estiver ligada no Supabase, confirme antes de entrar.";
  await checarConexao();
 }catch(e){S.regErro=true;S.regMsg=e.message||String(e)}
 render();
}
async function entrarReal(){
 S.regMsg="Entrando…";S.regErro=false;render();
 try{
  await window.Dados.entrar(S.reg.email,S.reg.senha);
  await checarConexao();
  S.papeis=await window.Dados.meusPapeis();
  var tem=S.papeis.map(function(p){return p.role});
  S.session=tem.indexOf("artist")>=0?"artist":"client";
  S.regMsg="Entrou. Papéis: "+tem.join(", ")+". A sessão do protótipo passou a refletir a conta real.";
 }catch(e){S.regErro=true;S.regMsg=e.message||String(e)}
 render();
}
async function salvarPerfilReal(){
 S.pfMsg="Salvando…";S.pfErro=false;render();
 try{
  await window.Dados.salvarPerfilDeArtista({
   nome:S.pf.nome,estudio:S.pf.estudio,cidade:S.pf.cidade,uf:S.pf.uf,
   estilos:S.pf.estilos,publicado:S.pf.publicado
  });
  S.reaisArtistas=null; // força recarga do catálogo
  S.pfMsg=S.pf.publicado
   ? "Salvo e publicado. Vá para o catálogo público e veja seu perfil aparecer — inclusive deslogada."
   : "Salvo. Como não está publicado, ninguém além de você consegue ver.";
 }catch(e){S.pfErro=true;S.pfMsg=e.message||String(e)}
 render();
}
async function sairReal(){
 await window.Dados.sair();S.session="anon";S.papeis=null;S.regMsg="Sessão encerrada.";S.regErro=false;
 await checarConexao();render();
}

/* ============ RENDER ============ */
/* ── FOCO SOBREVIVE AO REDESENHO ───────────────────────────────────
   Trocar o innerHTML destrói os campos e o navegador leva o foco junto.
   Como vários campos redesenham a tela a cada tecla, dava para digitar
   uma letra e o cursor sumia — a pessoa tinha que clicar de novo a cada
   caractere.

   Guardamos qual campo estava em foco e onde o cursor estava, e
   devolvemos os dois depois de repintar. Precisa de id no campo: sem
   ele não há como reencontrar o mesmo elemento do outro lado. */
function comFoco(pintar){
 var ativo=null,ini=null,fim=null;
 try{
  var e=document.activeElement;
  if(e&&e.id&&(e.tagName==="INPUT"||e.tagName==="TEXTAREA")){
   ativo=e.id;
   try{ini=e.selectionStart;fim=e.selectionEnd}catch(x){}
  }
 }catch(x){}
 pintar();
 if(!ativo)return;
 try{
  var novo=document.getElementById(ativo);
  if(!novo)return;
  novo.focus();
  if(ini!=null&&novo.setSelectionRange)novo.setSelectionRange(ini,fim);
 }catch(x){}
}

function render(){
 renderTop();
 var r=S.route,h="";
 // O espaço de trabalho e a conexão com o banco não são produto. Quem
 // entrou pelo link do teste não deveria nem tropeçar neles.
 if(emTeste()&&(r==="modelo"||r==="conexao")){S.route="home";r="home"}

 if(r==="conexao")h=vConexao();
 else if(r==="modelo")h=vModelo();
 else if(r==="home")h=vHome();
 else if(r==="artist")h=vArtist();
 else if(r==="plataforma")h=vLanding();
 // 'auth' e 'cadastro' eram dois nomes para a mesma tela desde que o
 // cadastro virou fluxo único. E vAuth nunca existiu: anônimo em rota
 // protegida caía num ReferenceError e via tela em branco.
 else if(r==="gate"){ if(!S.cad.viaGoogle)entrarComGoogle(); S.route="cadastro"; h=vCadastro(); }
 else if(r==="auth"||r==="cadastro"||r==="signup")h=vCadastro();
 else if(r==="checkin")h=isLog()?vCheckin():vCadastro();
 else if(r==="estudio")h=vEstudio();
 else if(r==="estudio-reivindicar")h=isLog()?vReivindicar():vCadastro();
 else if(r.indexOf("me")===0){
  /* me-quotes e me-payments viraram seções da visão geral. Quem tem a
     rota velha guardada chega na página certa, na altura certa. */
  var rm=r; if(r==="me-quotes"||r==="me-payments"){S.sub=S.sub||{};S.sub.mev=r==="me-quotes"?"quotes":"payments";rm="me"}
  if(rm!==r)S.route=rm;
  h=isLog()?paginaDeGestao(rm,vMe):vCadastro();
 }
 /* Rota antiga guardada no localStorage ou no endereço vira a nova
    antes de chegar na tela. Sem isso, quem já usou o produto abre numa
    tela em branco — e tela em branco parece produto quebrado. */
 else if(r.indexOf("studio")===0){var rr=traduzirRotaAntiga(r); if(rr!==r)S.route=rr; h=isLog()?paginaDeGestao(rr,vStudio):vCadastro();}
 else if(r.indexOf("forn")===0)h=isLog()?paginaDeGestao(r,vForn):vCadastro();
 comFoco(function(){document.getElementById("app").innerHTML=icons(h)});
 document.getElementById("sessionSel").value=S.session;
 if(r==="modelo"&&S.abaModelo==="modelo")calcUE();
 if(r==="home")ligarScrollInfinito();
 if(S.autoAssist){S.autoAssist=false;openDrawer("assist")}
 salvarEstado();
 if(typeof registrarRota==="function")registrarRota(r);
 if(typeof renderConvite==="function")renderConvite();
}

/* ── PORTÃO DO TESTE ───────────────────────────────────────────────
   Com ?teste=1 e sem consentimento ainda, a tela de entrada substitui
   tudo — barra superior inclusive. Sem o parâmetro, este bloco inteiro
   não roda e o protótipo é o protótipo de sempre. */
function precisaDoPortao(){
 return typeof testeLigado==="function" && testeLigado() && !T.ligado;
}
function renderEntrada(){ renderConvite() }
function entrarNoTeste(){
 if(S.te.enviando)return;
 S.te.enviando=true;S.te.erro=null;renderConvite();
 abrirSessaoDeTeste(S.te.nome,S.te.email,S.te.perfil).then(function(r){
  S.te.enviando=false;
  if(!r.ok){S.te.erro=r.erro;renderConvite();return}
  ligarCapturaDeCliques();
  ligarEnvioAutomatico();
  S.conviteAberto=false;
  renderConvite();                 // o convite some
  render();                        // e a navegação segue de onde estava
 });
}
/* ── COMO O TESTE COMEÇA ───────────────────────────────────────────
   Visitante, na descoberta, com os dados fictícios. Três garantias, e
   cada uma existe por um motivo:

   · visitante, porque a primeira coisa que queremos saber é o que a
     pessoa entende sem estar logada;
   · dados fictícios, porque o banco real tem zero tatuadores — quem
     caísse nele veria um catálogo vazio e um teste sem objeto;
   · barra de desenvolvimento escondida, porque ela deixa trocar de
     papel e de banco, e nada disso existe no produto. O participante
     que mexesse ali estaria testando outra coisa. */
/* Duas coisas valem sempre, e uma só na primeira vez.

   Sempre: dados fictícios e ferramentas internas escondidas. Banco real
   mostraria catálogo vazio, e a barra de desenvolvimento deixa trocar
   de papel — nenhum dos dois é produto.

   Só na primeira vez: começar como visitante, no feed. Quem volta
   depois retoma onde parou, com a conta que criou no protótipo — é o
   que a tela de entrada promete, e desfazer isso seria mentir. */
function prepararSessaoDeTeste(primeiraVez){
 S.modo="demo";
 var pb=document.getElementById("protobar"); if(pb)pb.style.display="none";
 var tb=document.getElementById("topbar");   if(tb)tb.style.display="";
 if(!primeiraVez)return;
 S.session="anon";
 S.emailConfirmado=null;
 // Link com endereço explícito manda: alguém pode ter compartilhado
 // uma tela específica de propósito.
 var temEndereco=false;
 try{temEndereco=!!(location.hash||"").replace(/^#\/?/,"")}catch(e){}
 if(!temEndereco){S.route="home";S.tab="discover"}
}

/* ── O CONVITE, EM VEZ DO PORTÃO ───────────────────────────────────
   Antes o consentimento vinha primeiro e a plataforma ficava atrás de
   um formulário. Isso media a disposição de preencher formulário, não
   a primeira impressão do produto.

   Agora a pessoa cai no feed, como cairia se o link fosse do produto.
   O convite fica numa faixa embaixo, visível e sem bloquear. Quem
   aceita passa a ser registrado dali em diante; quem recusa navega
   igual e não gera dado nenhum.

   O custo é real e assumido: perdemos os primeiros segundos de quem
   demora a aceitar. Em troca, o que a pessoa faz nos primeiros
   segundos passa a ser verdade, e não reação a um formulário. */
function iniciarPortaoDoTeste(){
 if(!testeLigado())return false;
 var salva=sessaoSalva();
 var jaConsentiu=!!(salva&&salva.id);

 prepararSessaoDeTeste(!jaConsentiu);

 if(jaConsentiu){                            // retoma de onde parou
  T.sessao=salva;T.ligado=true;T.ordem=0;
  ligarCapturaDeCliques();ligarEnvioAutomatico();
  registrar("entrada",{rota:S.route,detalhe:{retomada:true}});
 }
 return false;                               // nunca segura o render
}

function recusouConvite(){
 try{return localStorage.getItem("ink.teste.recusou")==="1"}catch(e){return false}
}
function recusarConvite(){
 try{localStorage.setItem("ink.teste.recusou","1")}catch(e){}
 S.conviteAberto=false;renderConvite();
}
function abrirConvite(){ S.conviteAberto=true;renderConvite() }
function fecharConvite(){ S.conviteAberto=false;renderConvite() }

function renderConvite(){
 var host=document.getElementById("conviteHost");
 if(!host)return;
 // Some assim que a pessoa aceita, e não volta.
 if(!testeLigado()||T.ligado){host.innerHTML="";return}

 if(S.conviteAberto){
  host.innerHTML=icons('<div class="scrim" onclick="fecharConvite()"></div>'+
   '<div class="convitecx">'+telaDeEntradaDoTeste()+'</div>');
  return;
 }
 if(recusouConvite()){host.innerHTML="";return}

 var h='<div class="convitebarra"><div class="wrap">';
 h+='<div style="min-width:0;flex:1"><div class="b small">Isto é um teste do Ink Creators</div>';
 h+='<div class="tiny muted">Navegue à vontade. Se topar participar, registramos por onde você passa — leva um minuto.</div></div>';
 h+='<div class="row" style="gap:var(--e2);flex-shrink:0">';
 h+='<button class="btn sm" onclick="recusarConvite()">Agora não</button>';
 h+='<button class="btn sm primary" onclick="abrirConvite()">Participar</button>';
 h+='</div></div></div>';
 host.innerHTML=icons(h);
}
document.getElementById("sessionSel").addEventListener("change",function(e){
 S.session=e.target.value;
 if(S.session==="artist"&&!S.roleSource)S.roleSource="signup_trigger";
 if(!isLog()&&(S.route.indexOf("me")===0||S.route.indexOf("studio")===0||S.route.indexOf("forn")===0))S.route="home";
 // Trocar de papel com a rota de outro papel na tela deixaria o visitante
 // olhando para um cadeado sem entender por quê.
 if(!isForn()&&S.route.indexOf("forn")===0)S.route="home";
 if(!isArt()&&S.route.indexOf("studio")===0)S.route="home";
 if(isForn()&&S.route.indexOf("me")===0)S.route="forn";
 render();
});
/* markup estático da barra superior também passa pelo pós-processador */
["staticSearchIc","staticTheme"].forEach(function(id){
 var e=document.getElementById(id);if(e)e.innerHTML=icons(e.innerHTML);
});

/* Ordem importa: o que estava salvo primeiro, a URL por cima. Um link
   compartilhado tem que ganhar da última tela em que a pessoa estava. */
/* ── O CARIMBO DE VERSÃO ─────────────────────────────────────────
   document.lastModified é a hora em que o ARQUIVO aberto foi salvo —
   funciona em file:// e no publicado (via cabeçalho HTTP). Se ela
   pediu um ajuste agora e o carimbo mostra hora velha, a aba está
   servindo passado: um clique nele recarrega. Depois de 15 minutos
   com a aba aberta, ele avisa sozinho. */
(function(){
 var el=document.getElementById("carimbo");
 if(!el)return;
 var m=new Date(document.lastModified);
 function dois(x){return String(x).padStart(2,"0")}
 var rot="v. "+dois(m.getDate())+"/"+dois(m.getMonth()+1)+" "+dois(m.getHours())+":"+dois(m.getMinutes());
 el.textContent=rot;
 setInterval(function(){
  if(Date.now()-m.getTime()>15*60*1000){
   el.textContent=rot+" · aba antiga? clique";
  }
 },60*1000);
})();

restaurarEstado();
aplicarURL();
var seguraPeloPortao = (typeof testeLigado==="function") && iniciarPortaoDoTeste();
try{
 window.addEventListener("hashchange",function(){
  if(aplicarURL())render();
 });
}catch(e){}
if(!seguraPeloPortao){
 render();
 try{if(!location.hash)location.hash=urlDaRota()}catch(e){}
}
</script>
