<!-- Porta de entrada do GitHub Pages. O protótipo mora em prototipo/,
     e quem recebe o link não deveria precisar saber disso.
     O redirecionamento leva junto a query e o hash: sem isso o ?teste=1
     se perderia no caminho e a pessoa entraria sem ser registrada. -->
<script>
  (function () {
    var destino = "prototipo/index.html" + (location.search || "") + (location.hash || "");
    location.replace(destino);
  })();
</script>

</style>
